function rangeEntries(){return db.entries.filter(e=>e.status==='posted'&&!e.closing&&e.date>=db.periodStart&&e.date<=db.periodEnd)}function pnl(){const v={income:0,cost:0,expense:0};rangeEntries().forEach(e=>lines(e).forEach(l=>{const a=acct(l.accountId);if(!a)return;if(a.type==='Income')v.income+=+l.credit- +l.debit;if(a.type==='Expense'){if(['Cost of goods','Direct expense'].includes(a.sub))v.cost+=+l.debit- +l.credit;else v.expense+=+l.debit- +l.credit}}));v.gross=v.income-v.cost;v.net=v.gross-v.expense;return v}
function postedCount(){return db.entries.filter(e=>e.status==='posted').length}function activePage(){return document.querySelector('.nav button.active')?.dataset.page||'dashboard'}
function nav(page){document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const group=['journal','accounts','reports'].includes(page)?'Accounting':['sales','purchases','inventory','partners','review'].includes(page)?'Operations':page==='dashboard'?'':'Administration',crumb=document.getElementById('crumb');crumb.innerHTML=group?`<button type="button" onclick="nav('dashboard')">Books</button><span aria-hidden="true"> / </span><span>${group}</span><span aria-hidden="true"> / </span><span class="current">${esc(pageNames[page]||page)}</span>`:`<button type="button" onclick="nav('dashboard')">Books</button><span aria-hidden="true"> / </span><span class="current">${esc(pageNames[page]||page)}</span>`;render(page);window.scrollTo(0,0)}const pageNames={dashboard:'Overview',journal:'Journal',accounts:'Accounts & ledgers',reports:'Financial reports',sales:'Sales & customers',purchases:'Purchases & suppliers',inventory:'Inventory',partners:'Partners',review:'Review drafts',close:'Period close',settings:'Settings & backup'};
document.querySelectorAll('.nav button[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));document.getElementById('period-tag').textContent=`${day(db.periodStart)} — ${day(db.periodEnd)}`;
function render(page=activePage()){document.getElementById('view').innerHTML=({dashboard:dashboard,journal:journal,accounts:accountsPage,reports:reports,sales:()=>salesPage('Sales'),purchases:()=>salesPage('Purchase'),inventory:inventory,partners:partners,review:review,close:closePage,settings:settings})[page]?.()||''}
const head=(title,sub,actions='')=>`<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;
function dashboard(){const b=balances(db.periodEnd),p=pnl(),cash=(b.cash||0)+(b.bank||0),asset=db.accounts.filter(a=>a.type==='Asset').reduce((s,a)=>s+(b[a.id]||0),0),draft=db.entries.filter(e=>e.status==='draft').length;let recent=[...db.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `${head(`Good ${new Date().getHours()<12?'morning':'day'}`,'A clear view of your books for the selected accounting period.',`<button class="btn" onclick="nav('reports')">View reports</button><button class="btn primary" onclick="openEntry()">＋ Record transaction</button>`)}${db.entries.length===0?'<div class="notice"><b>Books are ready.</b> No transactions have been posted. Opening partner capital balances from your brief are prepared as clearly labeled opening-balance drafts for review.</div>':''}<div class="stats"><div class="card stat"><div class="goldline"></div><label>Cash & bank</label><strong>${money(cash)}</strong><small>Closing balance at ${day(db.periodEnd)}</small></div><div class="card stat"><div class="goldline"></div><label>Sales this period</label><strong>${money(p.income)}</strong><small>${rangeEntries().length} posted transaction${rangeEntries().length===1?'':'s'} in period</small></div><div class="card stat"><div class="goldline"></div><label>Net profit / (loss)</label><strong style="color:${p.net<0?'var(--red)':'inherit'}">${money(p.net)}</strong><small>For selected accounting period</small></div><div class="card stat"><div class="goldline"></div><label>Total assets</label><strong>${money(asset)}</strong><small>At period end</small></div></div><div class="grid2"><section class="card section"><div class="section-top"><h2>Recent activity</h2><button class="btn sm" onclick="nav('journal')">Open journal</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>Date / reference</th><th>Description</th><th>Status</th><th class="num">Amount</th></tr></thead><tbody>${recent.map(e=>`<tr><td>${day(e.date)}<br><span class="muted">${esc(e.ref||'')}</span></td><td>${esc(e.memo||'—')}</td><td><span class="badge ${e.status==='posted'?'green':''}">${e.status==='posted'?'Posted':'Draft'}</span></td><td class="num">${money(totals(e).dr)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No activity yet. Start by reviewing your drafts or recording an opening balance.</div>'}</section><section class="card section"><div class="section-top"><h2>Needs your review</h2><button class="btn sm" onclick="nav('review')">Review drafts${draft?` (${draft})`:''}</button></div>${draft?`<p class="small muted"><span class="alert-dot"></span>${draft} draft item${draft===1?'':'s'} waiting for review. Drafts never affect your reports or balances.</p>`:'<p class="small muted">There are no drafts waiting for review.</p>'}<div class="breakdown"><span>Accounting period</span><b>${day(db.periodStart)} – ${day(db.periodEnd)}</b></div><div class="breakdown"><span>GST configuration</span><b>${db.gstEnabled?'Enabled':'Optional · not enabled'}</b></div><div class="breakdown"><span>Partners</span><b>3</b></div></section></div><div class="banner">Opening balances and transaction references supplied in the brief are labeled as user-provided or unposted examples. Review and confirm each draft before posting.</div>`}
function entryTable(es,editable=true){if(!es.length)return '<div class="empty">No entries to show.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Reference</th><th>Description</th><th>Source</th><th>Status</th><th class="num">Debit</th><th>Actions</th></tr></thead><tbody>${es.map(e=>`<tr><td>${day(e.date)}</td><td>${esc(e.ref||'—')}</td><td>${esc(e.memo||'—')}</td><td>${esc(e.entryType||'Journal')}</td><td><span class="badge ${e.status==='posted'?'green':e.status==='void'?'red':''}">${esc(e.status==='posted'?'Posted':e.status==='void'?'Voided':'Draft')}</span></td><td class="num">${money(totals(e).dr)}</td><td><div class="actions">${e.status==='draft'?`<button class="btn sm gold" onclick="editEntry('${e.id}')">Review</button>`:`<button class="btn sm" onclick="inspectEntry('${e.id}')">View</button>${e.status==='posted'?`<button class="btn sm" onclick="editEntry('${e.id}')">Edit</button>`:''}`}${e.status!=='void'?`<button class="btn sm danger" onclick="deleteEntry('${e.id}')">${e.status==='posted'?'Void':'×'}</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`}
function journal(){return `${head('Journal','Every posted entry is balanced, dated and retained in the audit trail.',`<button class="btn" onclick="exportCSV()">Export journal CSV</button><button class="btn primary" onclick="openEntry()">＋ New entry</button>`)}<div class="card section"><div class="section-top"><h2>Transaction history</h2><span class="muted small">${db.entries.length} total · ${postedCount()} posted</span></div>${entryTable([...db.entries].sort((a,b)=>b.date.localeCompare(a.date)))}</div>`}
function accountsPage(){const b=balances(db.periodEnd);let sel=window.selectedAccount||'all';return `${head('Accounts & ledgers','Account balances and source transactions through '+day(db.periodEnd))}<div class="card section"><div class="form-grid" style="margin-bottom:17px"><div class="field"><label>ACCOUNT LEDGER</label><select onchange="window.selectedAccount=this.value;render('accounts')"><option value="all" ${sel==='all'?'selected':''}>All accounts · trial balance</option>${db.accounts.map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''}>${esc(a.name)} · ${esc(a.type)}</option>`).join('')}</select></div><div class="field"><label>AS OF</label><input type="date" value="${db.periodEnd}" onchange="window.ledgerAsOf=this.value;render('accounts')"></div></div>${sel==='all'?`<div class="table-wrap"><table><thead><tr><th>Account</th><th>Type</th><th class="num">Debit balance</th><th class="num">Credit balance</th></tr></thead><tbody>${db.accounts.map(a=>{const n=b[a.id]||0;return n?`<tr><td>${esc(a.name)}</td><td>${esc(a.type)}</td><td class="num">${n>0?money(n):'—'}</td><td class="num">${n<0?money(-n):'—'}</td></tr>`:''}).join('')||'<tr><td colspan="4" class="muted">No posted balances yet.</td></tr>'}</tbody><tfoot><tr><th colspan="2">Totals</th><th class="num">${money(Object.values(b).filter(x=>x>0).reduce((s,x)=>s+x,0))}</th><th class="num">${money(-Object.values(b).filter(x=>x<0).reduce((s,x)=>s+x,0))}</th></tr></tfoot></table></div><p class="small muted">Unadjusted trial balance includes all posted accounts. Net profit is shown in reports and becomes retained/partner equity at period close.</p>`:ledger(sel,window.ledgerAsOf||db.periodEnd)}</div>`}
function ledger(accountId,end){const a=acct(accountId),ls=allLines().filter(l=>l.accountId===accountId&&l.date<=end).sort((x,y)=>x.date.localeCompare(y.date));let run=0;return `<h2>${esc(a?.name||'Account')} <span class="muted small">· ${esc(a?.type||'')}</span></h2><p class="muted small">Transactions through ${day(end)}</p><div class="table-wrap"><table><thead><tr><th>Date</th><th>Reference / memo</th><th>Debit</th><th>Credit</th><th>Balance</th></tr></thead><tbody>${ls.length?ls.map(l=>{let s=['Asset','Expense'].includes(a.type)?1:-1;run+=(+l.debit- +l.credit)*s;return `<tr><td>${day(l.date)}</td><td>${esc(l.ref)} · ${esc(l.memo)}</td><td>${l.debit?money(l.debit):'—'}</td><td>${l.credit?money(l.credit):'—'}</td><td>${money(run)} ${s===1?'Dr':'Cr'}</td></tr>`}).join(''):'<tr><td colspan="5" class="muted">No posted transactions in this account.</td></tr>'}</tbody></table></div><p class="small muted">Opening balance: ${money(run)} ${['Asset','Expense'].includes(a.type)?'Dr':'Cr'}</p>`}
function reports(){const p=pnl(),b=balances(db.periodEnd);let assets=db.accounts.filter(a=>a.type==='Asset').map(a=>[a.name,b[a.id]||0]).filter(x=>x[1]);let liabs=db.accounts.filter(a=>a.type==='Liability').map(a=>[a.name,-(b[a.id]||0)]).filter(x=>x[1]);let eq=db.accounts.filter(a=>a.type==='Equity').map(a=>[a.name,-(b[a.id]||0)]).filter(x=>x[1]);let grossrows=db.accounts.filter(a=>a.type==='Income'||a.sub==='Cost of goods'||a.sub==='Direct expense').map(a=>[a.name,(b[a.id]||0)*(a.type==='Income'?-1:1)]).filter(x=>x[1]);return `${head('Financial reports','Accrual-basis reports for '+day(db.periodStart)+' to '+day(db.periodEnd),`<button class="btn" onclick="window.print()">Print reports</button><button class="btn" onclick="exportCSV()">Export CSV</button>`)}<div class="tabs"><button class="active">Trading & P&amp;L</button><button onclick="document.getElementById('bs').scrollIntoView({behavior:'smooth'})">Balance sheet</button><button onclick="document.getElementById('tb').scrollIntoView({behavior:'smooth'})">Trial balance</button><button onclick="document.getElementById('cb').scrollIntoView({behavior:'smooth'})">Cash book</button></div><div class="report-grid"><section class="card section"><div class="section-top"><h2>Trading account</h2><span class="muted small">${day(db.periodStart)} – ${day(db.periodEnd)}</span></div>${breakRows(grossrows,p.gross,'Gross profit')}</section><section class="card section"><div class="section-top"><h2>Profit & loss account</h2><span class="muted small">${day(db.periodStart)} – ${day(db.periodEnd)}</span></div><div class="breakdown"><span>Gross profit / (loss)</span><b>${money(p.gross)}</b></div>${db.accounts.filter(a=>a.type==='Expense'&&!['Cost of goods','Direct expense'].includes(a.sub)).map(a=>{let n=(b[a.id]||0);return n?`<div class="breakdown"><span>${esc(a.name)}</span><span>${money(n)}</span></div>`:''}).join('')}<div class="breakdown total"><span>Net profit / (loss)</span><b>${money(p.net)}</b></div></section><section class="card section" id="bs"><div class="section-top"><h2>Balance sheet</h2><span class="muted small">As at ${day(db.periodEnd)}</span></div><b class="small">Assets</b>${rows(assets)}<div class="breakdown total"><span>Total assets</span><b>${money(assets.reduce((s,x)=>s+x[1],0))}</b></div><br><b class="small">Liabilities</b>${rows(liabs)}<b class="small">Partners' equity</b>${rows(eq)}<div class="breakdown"><span>Current period profit / (loss)</span><b>${money(p.net)}</b></div><div class="breakdown total"><span>Liabilities & equity</span><b>${money(liabs.reduce((s,x)=>s+x[1],0)+eq.reduce((s,x)=>s+x[1],0)+p.net)}</b></div><p class="small muted">Balance-sheet inventory uses posted asset balances. Cost of goods sold is reflected in current-period profit.</p></section><section class="card section" id="tb"><div class="section-top"><h2>Trial balance</h2><span class="muted small">As at ${day(db.periodEnd)}</span></div>${trialBalance(b)}</section><section class="card section" id="cb"><div class="section-top"><h2>Cash book</h2><span class="muted small">Posted cash and bank movements</span></div>${cashBook()}</section></div>`}
function rows(arr){return arr.length?arr.map(x=>`<div class="breakdown"><span>${esc(x[0])}</span><span>${money(x[1])}</span></div>`).join(''):'<div class="breakdown muted"><span>No posted balances</span><span>—</span></div>'}function breakRows(arr,total,label){return `${arr.map(x=>`<div class="breakdown"><span>${esc(x[0])}</span><span>${money(x[1])}</span></div>`).join('')}<div class="breakdown total"><span>${label}</span><b>${money(total)}</b></div>`}
function trialBalance(b){let rows=db.accounts.map(a=>{let n=b[a.id]||0;return [a,n>0?n:0,n<0?-n:0]}).filter(x=>x[1]||x[2]);return `<div class="table-wrap"><table><thead><tr><th>Account</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>${rows.map(([a,d,c])=>`<tr><td>${esc(a.name)}</td><td class="num">${d?money(d):'—'}</td><td class="num">${c?money(c):'—'}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">No balances posted.</td></tr>'}</tbody><tfoot><tr><th>Total</th><th class="num">${money(rows.reduce((s,x)=>s+x[1],0))}</th><th class="num">${money(rows.reduce((s,x)=>s+x[2],0))}</th></tr></tfoot></table></div>`}
function cashBook(){const lines=allLines().filter(l=>['cash','bank'].includes(l.accountId)&&l.date>=db.periodStart&&l.date<=db.periodEnd).sort((a,b)=>a.date.localeCompare(b.date));return lines.length?`<table><thead><tr><th>Date</th><th>Account / narration</th><th>Inflow</th><th>Outflow</th></tr></thead><tbody>${lines.map(l=>`<tr><td>${day(l.date)}</td><td>${esc(acct(l.accountId)?.name)} · ${esc(l.memo)}</td><td>${l.debit?money(l.debit):'—'}</td><td>${l.credit?money(l.credit):'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No posted cash or bank activity in this period.</div>'}
function salesPage(kind){const isSales=kind==='Sales',type=isSales?'sale':'purchase',list=db.entries.filter(e=>e.entryType===kind.toLowerCase()&&e.status==='posted');return `${head(kind,isSales?'Record invoices, receipts and customer balances.':'Record supplier bills, payments and supplier balances.',`<button class="btn primary" onclick="openEntry('${type}')">＋ Record ${isSales?'sale':'purchase'}</button>`)}<div class="card section"><div class="section-top"><h2>${kind} transactions</h2><span class="muted small">${list.length} posted</span></div>${entryTable(list)}</div><div class="grid2" style="margin-top:16px"><section class="card section"><h2>${isSales?'Customer':'Supplier'} balances</h2>${partyBalances(isSales?'ar':'ap')}</section><section class="card section"><h2>Posting guide</h2><p class="small muted">${isSales?'Sales on credit debit receivables and credit sales. Record a separate receipt against receivables when the customer pays.':'Purchases on credit debit purchases and credit payables. Record payment separately against payables when paid.'} Enter GST lines only when registered and supported by a valid tax invoice.</p></section></div>`}
function partyBalances(id){const a=acct(id),ls=allLines().filter(l=>l.accountId===id);let balance=ls.reduce((s,l)=>s+(+l.debit- +l.credit),0);return `<div class="breakdown"><span>${esc(a.name)} · total</span><b>${money(balance)}</b></div><p class="small muted">For party-level balances, include the customer or supplier name in the transaction memo; individual sub-ledgers are shown in the ledger.</p>`}
function inventory(){let b=balances(),v=b.inventory||0,products=db.products||[];return `${head('Inventory','Track items, quantities and posted inventory value.',`<button class="btn primary" onclick="addProduct()">＋ Add item</button>`)}<div class="stats"><div class="card stat"><div class="goldline"></div><label>Posted inventory value</label><strong>${money(v)}</strong><small>From posted inventory asset entries</small></div><div class="card stat"><div class="goldline"></div><label>Tracked items</label><strong>${products.length}</strong><small>Non-posting quantity register</small></div><div class="card stat"><div class="goldline"></div><label>Valuation policy</label><strong style="font-size:16px">Weighted average</strong><small>Configure before posting stock movements</small></div><div class="card stat"><div class="goldline"></div><label>GST</label><strong style="font-size:16px">${db.gstEnabled?'Enabled':'Not enabled'}</strong><small>Optional setting</small></div></div><div class="notice">Inventory register is a quantity aid; postings to the inventory asset account remain the accounting source of truth. Enable quantity movements only after confirming opening stock and costing method.</div><div class="card section"><div class="section-top"><h2>Item register</h2><button class="btn sm" onclick="addProduct()">Add item</button></div>${products.length?`<table><thead><tr><th>Item</th><th>SKU</th><th class="num">On hand</th><th>Unit</th><th class="num">Unit cost</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku||'—')}</td><td class="num">${+p.qty||0}</td><td>${esc(p.unit||'unit')}</td><td class="num">${money(p.cost)}</td><td><button class="btn sm danger" onclick="removeProduct('${p.id}')">Remove</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No items configured. Add stock items to maintain a simple item register.</div>'}</div>`}
function partners(){let b=balances(),names=['shuaib','joshvin','rahul'];return `${head('Partners','Partner capital and current accounts. Seed balances below are user-provided and remain drafts until confirmed.',`<button class="btn" onclick="nav('review')">Review opening balances</button>`)}<div class="notice"><b>Opening capital values provided in the brief.</b> These are not verified books. They are available as a single balanced opening-balance draft; confirm the opening date and corresponding opening assets/liabilities before posting.</div><div class="stats">${PARTNERS.map((p,i)=>{const cap=b['cap-'+names[i]]||0,cur=b['cur-'+names[i]]||0;return `<div class="card stat"><div class="goldline"></div><label>${p}</label><strong>${money(cap+cur)}</strong><small>Capital ${money(cap)} · Current ${money(cur)}</small></div>`}).join('')}<div class="card stat"><div class="goldline"></div><label>Total partners' equity</label><strong>${money(PARTNERS.reduce((s,_,i)=>s+(b['cap-'+names[i]]||0)+(b['cur-'+names[i]]||0),0))}</strong><small>Posted balances only</small></div></div><div class="card section"><h2>Partner terms</h2><p class="small muted">Profit-sharing percentages, interest on capital, drawings rules and partner remuneration have not been provided. Enter approved terms in Settings before allocation at period close.</p><div class="table-wrap"><table><thead><tr><th>Partner</th><th>Role</th><th>Profit share</th><th>Capital</th><th>Current</th></tr></thead><tbody><tr><td>Shuaib S</td><td>Founder &amp; CEO</td><td>Not configured</td><td>${money(b['cap-shuaib'])}</td><td>${money(b['cur-shuaib'])}</td></tr><tr><td>Joshvin Thomas</td><td>Co-founder &amp; COO</td><td>Not configured</td><td>${money(b['cap-joshvin'])}</td><td>${money(b['cur-joshvin'])}</td></tr><tr><td>Rahul R</td><td>Co-founder &amp; CMO</td><td>Not configured</td><td>${money(b['cap-rahul'])}</td><td>${money(b['cur-rahul'])}</td></tr></tbody></table></div></div>`}
function reviewCards(entries){if(!entries.length)return '<div class="empty">No drafts are waiting for review.</div>';return `<div class="review-grid">${entries.map(e=>{const source=e.importedFrom?`Imported from ${e.importedFrom}`:e.seedGroup==='brief'?'Brief reference · unposted':'Created in AETHEL books';return `<article class="review-card"><div class="review-copy"><p class="review-description">${esc(e.memo||'Description needed')}</p><p class="review-source">${esc(source)}${e.ref?` · ${esc(e.ref)}`:''}</p></div><div class="review-card-meta"><div class="review-meta"><label>Transaction type</label><span>${esc(e.entryType||'Journal')}</span></div><div class="review-meta"><label>Status</label><span class="badge">Draft · unposted</span></div><div class="review-meta review-amount"><label>Amount</label><span>${money(totals(e).dr)}</span></div></div><div class="review-actions"><button class="btn gold" onclick="editEntry('${e.id}')">Review</button><button class="btn review-delete" onclick="deleteEntry('${e.id}')">Delete</button></div></article>`}).join('')}</div>`}
function review(){let drafts=db.entries.filter(e=>e.status==='draft');return `${head('Review drafts','Review each item before it affects your accounts or reports.',`<button class="btn" onclick="seedDrafts()">＋ Load brief reference drafts</button>`)}<div class="notice">Imported and sample transactions stay unposted until you verify the details. Reviewing a draft opens its entry form, where you can edit it or confirm and post it.</div><section class="card section review-section"><div class="section-top"><div><h2>Transaction review</h2><span class="muted small">Descriptions first · amounts remain outside the books until posted</span></div><span class="badge">${drafts.length} awaiting review</span></div>${reviewCards(drafts)}</section>`}
function closePage(){const p=pnl(),existing=db.entries.find(e=>e.closing&&e.date===db.periodEnd);return `${head('Period close','Review the period before locking in the final balances.',`<button class="btn" onclick="nav('reports')">Review reports</button>`)}<div class="notice">This app does not provide statutory assurance. Reconcile bank, inventory and tax records; review the partner deed and consult your accountant before closing.</div><div class="grid2"><section class="card section"><h2>Pre-close checklist</h2>${[['Trial balance balances',Math.abs(trialDiff())<0.005?'Ready':'Investigate difference'],['Draft entries reviewed',db.entries.some(e=>e.status==='draft')?'Action needed':'Ready'],['Accounting period',`${day(db.periodStart)} – ${day(db.periodEnd)}`],['GST status',db.gstEnabled?'Enabled · reconcile tax returns':'Optional · not enabled'],['Partner profit shares','Not configured · allocation not available']].map(x=>`<div class="breakdown"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}</section><section class="card section"><h2>Period result</h2><div class="breakdown"><span>Sales and other income</span><b>${money(p.income)}</b></div><div class="breakdown"><span>Trading gross profit / (loss)</span><b>${money(p.gross)}</b></div><div class="breakdown total"><span>Net result</span><b>${money(p.net)}</b></div><p class="small muted">Partner allocation is withheld until you enter approved profit-sharing terms.</p>${existing?'<span class="badge green">Closing entry posted</span>':`<button class="btn primary" style="margin-top:10px" onclick="closePeriod()">Post period closing entry</button>`}</section></div>`}
function trialDiff(){const b=balances();return Object.values(b).reduce((s,x)=>s+x,0)}
function settings(){return `${head('Settings & backup','Configure your books, export data and preserve a local backup.',`<button class="btn" onclick="backup()">Download backup</button><button class="btn" onclick="document.getElementById('restore-file').click()">Restore backup</button>`)}<div class="grid2"><section class="card section"><div class="section-top"><h2>Business & period</h2></div><div class="form-grid"><div class="field full"><label>BUSINESS NAME</label><input id="set-company" value="${esc(db.company)}"></div><div class="field"><label>PERIOD START</label><input type="date" id="set-start" value="${db.periodStart}"></div><div class="field"><label>PERIOD END</label><input type="date" id="set-end" value="${db.periodEnd}"></div><div class="field full"><label>CURRENCY</label><select id="set-currency"><option value="INR">Indian Rupee (₹)</option></select></div><div class="field full"><label class="switch"><input type="checkbox" id="set-gst" ${db.gstEnabled?'checked':''}> Enable GST configuration (optional)</label></div><div class="field full"><label>GSTIN (if registered)</label><input id="set-gstin" value="${esc(db.gstin||'')}" placeholder="15-character GSTIN"></div><div class="field full"><button class="btn primary" onclick="saveSettings()">Save settings</button></div></div></section><section class="card section"><h2>Accounting policies</h2><div class="breakdown"><span>Basis</span><b>Accrual</b></div><div class="breakdown"><span>Entry method</span><b>Double entry</b></div><div class="breakdown"><span>Inventory costing</span><b>Weighted average · confirm</b></div><div class="breakdown"><span>GST</span><b>Optional · registration not presumed</b></div><div class="breakdown"><span>Domain prepayment</span><b>Separate monthly adjustment required</b></div><p class="small muted">Accounting policy: record income/expenses when earned/incurred; capitalize prepaid subscriptions and expense over the covered period when material and supported; track GST only against valid documents and registration status. Verify treatment with your accountant.</p><div class="actions"><button class="btn" onclick="exportCSV()">Export posted entries CSV</button><button class="btn danger" onclick="wipeData()">Reset local books</button></div></section></div><input id="restore-file" type="file" accept="application/json" hidden onchange="restoreBackup(event)"><div class="banner">Data is stored in this browser's local storage on this device. Download regular backups. No cloud sync is configured.</div>`}
function saveSettings(){let start=document.getElementById('set-start').value,end=document.getElementById('set-end').value;if(!start||!end||start>end)return toast('Choose a valid accounting period.');db.company=document.getElementById('set-company').value.trim()||'AETHEL COLLECTIVE';db.periodStart=start;db.periodEnd=end;db.gstEnabled=document.getElementById('set-gst').checked;db.gstin=document.getElementById('set-gstin').value.trim();document.getElementById('period-tag').textContent=`${day(start)} — ${day(end)}`;save();toast('Settings saved');render('settings')}
function entryCols(count){const width=window.innerWidth||1400,max=width>=1500?7:width>=1200?6:4;return Math.min(max,Math.max(1,Math.ceil(Math.sqrt(Math.max(count,1)*1.35))))}
function openEntry(kind='journal',existing=null){const e=existing||{},isDraft=e.status==='draft',ls=e.lines?.length?e.lines:[{accountId:'',debit:'',credit:''},{accountId:'',debit:'',credit:''}],title=existing?(isDraft?'Review draft':'Edit posted transaction'):'New '+(kind==='sale'?'sale':kind==='purchase'?'purchase':'journal entry'),kindopts=[['journal','Journal'],['sale','Sale'],['purchase','Purchase'],['opening','Opening balance'],['adjustment','Adjustment']];document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal entry-modal"><div class="modal-head"><div><div class="eyebrow">AETHEL COLLECTIVE · BOOKS</div><h2>${title}</h2></div><button class="x" onclick="closeModal()" aria-label="Close journal entry">×</button></div><div class="form-grid entry-form"><div class="field"><label>ENTRY ID</label><input id="e-ref" value="${esc(e.ref||'') }" placeholder="Auto assigned if blank"></div><div class="field"><label>DATE</label><input id="e-date" type="date" value="${e.date||isoToday()}"></div><div class="field"><label>ENTRY TYPE</label><select id="e-type">${kindopts.map(([v,l])=>`<option value="${v}" ${(e.entryType?.toLowerCase()===v||(!e.entryType&&v===kind))?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>COUNTERPARTY</label><input id="e-party" value="${esc(e.party||'')}" placeholder="Optional"></div><div class="field full"><label>NOTES</label><input id="e-memo" value="${esc(e.memo||'')}" placeholder="Business purpose and source document"></div></div><div class="entry-lines-heading"><div><b>JOURNAL LINES</b><span class="muted">Choose an account, then enter a debit or credit.</span></div><button class="btn sm" onclick="addLine()">＋ Add line</button></div><div id="entry-lines" style="--line-cols:${entryCols(ls.length)}">${ls.map(l=>lineEditor(l)).join('')}</div><div class="totals"><span>Debits <b id="sum-dr">₹0.00</b></span><span>Credits <b id="sum-cr">₹0.00</b></span><b id="sum-diff" style="color:var(--red)">Difference ₹0.00</b></div>${isDraft?'<div class="notice entry-notice">Draft only · verify date, supporting documents, business purpose, payment status and tax treatment before posting.</div>':''}${e.importedFrom?'<label class="notice entry-notice"><input id="e-import-confirm" type="checkbox"> I verified this imported entry’s date, amount and account split against the original books.</label>':''}<div class="actions entry-actions"><label class="reconcile-check"><input id="e-reconcile" type="checkbox" ${e.reconciled?'checked':''}> Reconciled</label><span class="spacer"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveEntry('${existing?.id||''}',true)">Save draft</button><button class="btn primary" onclick="saveEntry('${existing?.id||''}',false)">${isDraft?'Confirm & post':'Post entry'}</button></div></div></div>`;window.currentEditId=e.id||'';updateSums();fitEntryGrid();requestAnimationFrame(fitEntryGrid)}function lineEditor(l={}){return `<div class="line-item"><div class="account-pick"><select class="li-account"><option value="">Choose account</option>${db.accounts.map(a=>`<option value="${a.id}" ${l.accountId===a.id?'selected':''}>${esc(a.name)} (${esc(a.type)})</option>`).join('')}</select><button type="button" class="btn sm account-add" title="Create an account" onclick="openAccountCreator(this.previousElementSibling)">+</button></div><input class="li-debit" type="number" min="0" step="0.01" placeholder="Debit ₹" value="${l.debit||''}"><input class="li-credit" type="number" min="0" step="0.01" placeholder="Credit ₹" value="${l.credit||''}"><button class="btn sm danger remove-line" onclick="this.parentElement.remove();updateSums()">×</button></div>`}
function openAccountCreator(target=null){window.accountLineTarget=target;document.getElementById('modal-root').insertAdjacentHTML('beforeend',`<div class="modal-bg account-modal-bg" onclick="if(event.target===this)this.remove()"><div class="modal narrow"><div class="modal-head"><h2>Create account</h2><button class="x" onclick="this.closest('.account-modal-bg').remove()">×</button></div><div class="form-grid"><div class="field full"><label>ACCOUNT NAME</label><input id="new-account-name" placeholder="e.g. Office supplies" autofocus></div><div class="field"><label>ACCOUNT TYPE</label><select id="new-account-type"><option>Asset</option><option>Liability</option><option>Equity</option><option>Income</option><option>Expense</option></select></div><div class="field"><label>GROUP / SUBTYPE</label><input id="new-account-sub" placeholder="Optional"></div></div><p class="small muted">Choose the account’s normal financial statement category carefully. The account will be available immediately in this journal entry.</p><div class="actions" style="justify-content:flex-end"><button class="btn" onclick="this.closest('.account-modal-bg').remove()">Cancel</button><button class="btn primary" onclick="saveNewAccount()">Create account</button></div></div></div>`);document.getElementById('new-account-name').focus()}
function saveNewAccount(){let name=document.getElementById('new-account-name').value.trim(),type=document.getElementById('new-account-type').value,sub=document.getElementById('new-account-sub').value.trim()||type;if(!name)return toast('Enter an account name.');if(db.accounts.some(a=>a.name.toLowerCase()===name.toLowerCase()))return toast('An account with that name already exists.');let slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),base='custom-'+(slug||id()),accountId=base;while(acct(accountId))accountId=base+'-'+Math.random().toString(36).slice(2,6);let a={id:accountId,name,type,sub};db.accounts.push(a);save();if(window.accountLineTarget){let o=document.createElement('option');o.value=a.id;o.textContent=`${a.name} (${a.type})`;window.accountLineTarget.appendChild(o);window.accountLineTarget.value=a.id}document.querySelectorAll('.account-modal-bg').forEach(x=>x.remove());toast('Account created and selected');window.accountLineTarget=null}
function addLine(){document.getElementById('entry-lines').insertAdjacentHTML('beforeend',lineEditor());fitEntryGrid();updateSums();requestAnimationFrame(fitEntryGrid)}function fitEntryGrid(){let el=document.getElementById('entry-lines');if(!el)return;let count=Math.max(el.children.length,1),cols=entryCols(count),rows=Math.ceil(count/cols),height=el.clientHeight;el.style.setProperty('--line-cols',cols);if(height>0)el.style.setProperty('--line-height',Math.max(18,Math.min(31,Math.floor((height-5*(rows-1))/rows)))+'px')}document.addEventListener('input',e=>{if(e.target.matches('.li-debit,.li-credit'))updateSums()});function updateSums(){let d=0,c=0;document.querySelectorAll('.li-debit').forEach(e=>d+=+e.value||0);document.querySelectorAll('.li-credit').forEach(e=>c+=+e.value||0);let dr=document.getElementById('sum-dr');if(dr){document.getElementById('sum-dr').textContent=money(d);document.getElementById('sum-cr').textContent=money(c);let dif=d-c;document.getElementById('sum-diff').textContent=Math.abs(dif)<.005?'Balanced':'Difference '+money(Math.abs(dif));document.getElementById('sum-diff').style.color=Math.abs(dif)<.005?'var(--green)':'var(--red)'}}
function saveEntry(existingId,draft){let date=document.getElementById('e-date').value,entryType=document.getElementById('e-type').value,ref=document.getElementById('e-ref').value.trim(),party=document.getElementById('e-party').value.trim(),memo=document.getElementById('e-memo').value.trim();let arr=[...document.querySelectorAll('.line-item')].map(el=>({accountId:el.querySelector('.li-account').value,debit:+el.querySelector('.li-debit').value||0,credit:+el.querySelector('.li-credit').value||0})).filter(l=>l.accountId&&(l.debit||l.credit));let d=arr.reduce((s,l)=>s+l.debit,0),c=arr.reduce((s,l)=>s+l.credit,0),old=existingId&&db.entries.find(x=>x.id===existingId);if(!date)return toast('Choose an entry date.');if(arr.length<2)return toast('Add at least two complete entry lines.');if(arr.some(l=>l.debit&&l.credit))return toast('A line cannot contain both a debit and a credit.');if(!draft&&Math.abs(d-c)>.005)return toast('Entry must balance before posting.');if(!draft&&arr.some(l=>!acct(l.accountId)))return toast('Choose a valid account for every line.');if(old?.importedFrom&&!draft&&!document.getElementById('e-import-confirm')?.checked)return toast('Confirm the imported date, amount and account split before posting.');let obj={...(old||{}),id:existingId||id(),date,entryType:entryType==='sale'?'Sale':entryType==='purchase'?'Purchase':entryType[0].toUpperCase()+entryType.slice(1),ref:ref||'AET-'+date.replaceAll('-','')+'-'+String(db.entries.length+1).padStart(3,'0'),party,memo,reconciled:document.getElementById('e-reconcile')?.checked||false,lines:arr,status:draft?'draft':'posted',createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(old&&old.status==='posted'&&!draft)obj.auditTrail=[...(old.auditTrail||[]),{at:new Date().toISOString(),action:'Edited',before:JSON.stringify(old.lines)}];if(existingId)db.entries[db.entries.findIndex(x=>x.id===existingId)]=obj;else db.entries.push(obj);save();closeModal();toast(draft?'Draft saved':'Entry posted');render(activePage())}
function closeModal(){document.getElementById('modal-root').innerHTML=''}function editEntry(eid){let e=db.entries.find(x=>x.id===eid);if(e)openEntry(e.entryType?.toLowerCase()==='sale'?'sale':e.entryType?.toLowerCase()==='purchase'?'purchase':'journal',e)}function inspectEntry(eid){let e=db.entries.find(x=>x.id===eid);if(!e)return;document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal narrow"><div class="modal-head"><h2>${esc(e.ref)}</h2><button class="x" onclick="closeModal()">×</button></div><p>${day(e.date)} · ${esc(e.entryType)}</p><p class="muted">${esc(e.memo)} ${e.party?'· '+esc(e.party):''}</p><table><thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${lines(e).map(l=>`<tr><td>${esc(acct(l.accountId)?.name||l.accountId)}</td><td>${l.debit?money(l.debit):'—'}</td><td>${l.credit?money(l.credit):'—'}</td></tr>`).join('')}</tbody></table><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" onclick="closeModal()">Close</button><button class="btn" onclick="editEntry('${e.id}')">Edit</button></div></div></div>`}
function deleteEntry(eid){let e=db.entries.find(x=>x.id===eid);if(!e)return;if(e.status==='posted'){if(!confirm('Void this posted entry? It will be excluded from balances and reports, and retained in the audit trail.'))return;e.auditTrail=[...(e.auditTrail||[]),{at:new Date().toISOString(),action:'Voided',beforeStatus:'posted'}];e.status='void';e.updatedAt=new Date().toISOString();save();toast('Entry voided and retained in the audit trail')}else{if(!confirm('Delete this unposted draft?'))return;db.entries=db.entries.filter(x=>x.id!==eid);save();toast('Draft deleted')}render(activePage())}
function seedDrafts(){if(db.entries.some(e=>e.seedGroup==='brief'))return toast('Brief reference drafts are already loaded.');let g='brief',date=db.periodStart,make=(ref,memo,lines,party='',type='Adjustment')=>({id:id(),date,ref,memo,party,entryType:type,status:'draft',seedGroup:g,lines,createdAt:new Date().toISOString()});const dr=[];
dr.push(make('OPEN-CAP-001','User-provided partner capital balances. Opening-balance date and corresponding assets/liabilities need confirmation.',[{accountId:'bank',debit:6976},{accountId:'cap-shuaib',credit:2712},{accountId:'cap-joshvin',credit:2264},{accountId:'cap-rahul',credit:2000}],'' ,'Opening'));
dr.push(make('REF-WEB-001','Unposted draft reference: website ₹650 and domain ₹1,299. Domain provisionally classified as prepaid pending invoice/date confirmation. Domain described as a one-year subscription ending early February 2027; first month-end adjustment requested for October end. Confirm exact coverage dates, payment account, amortization amount and schedule before posting.',[{accountId:'website',debit:650},{accountId:'prepaid',debit:1299},{accountId:'cash',credit:1949}],'' ,'Adjustment'));
dr.push(make('REF-PACK-001','Unposted reference: 100 covers ₹278 + 20 boxes ₹225 + 5m bubble wrap ₹127 = ₹630 (brief also labels total packaging purchase ₹580; discrepancy needs review).', [{accountId:'packaging',debit:630},{accountId:'cash',credit:630}],'' ,'Purchase'));
dr.push(make('REF-PACK-PLAN','Planned, not confirmed: stickers ₹250, visiting cards ₹350, thank-you cards ₹300.',[{accountId:'packaging',debit:900},{accountId:'cash',credit:900}],'' ,'Purchase'));
dr.push(make('REF-ADS-001','Unposted reference: advertisement card expense ₹500. Confirm date and payment method.',[{accountId:'advertising',debit:500},{accountId:'cash',credit:500}],'' ,'Adjustment'));
dr.push(make('REF-WATCH-001','Unposted reference: Fixen ladies watch purchase ₹300; sale ₹500; ₹400 received and ₹100 receivable. Confirm inventory cost treatment and dates.',[{accountId:'purchases',debit:300},{accountId:'cash',credit:300}], 'Fixen ladies watch','Purchase'));
dr.push(make('REF-WATCH-002','Unposted reference: Fixen ladies watch sale ₹500; ₹400 received, ₹100 receivable. Confirm customer, date, tax and cost of goods sold.',[{accountId:'cash',debit:400},{accountId:'ar',debit:100},{accountId:'sales-income',credit:500}], 'Fixen ladies watch','Sale'));
dr.push(make('REF-ADV-001','Unposted reference: Rageesha advance ₹500 for product expected around ₹700. Treat receipt as customer advance pending delivery; confirm balance, item, dates and payment account.',[{accountId:'cash',debit:500},{accountId:'customer-advance',credit:500}], 'Rageesha','Sale'));
dr.push(make('REF-DURGA-001','Unposted / ambiguous: Durga paid ₹550 for Magneto Jupiter watch; separately mentioned stock purchase ₹1,550; corrected product original rate ₹400. Confirm invoice, cost, and whether ₹400 is selling price or cost.',[{accountId:'cash',debit:550},{accountId:'sales-income',credit:550}], 'Durga','Sale'));
db.entries.push(...dr);save();toast('Brief reference drafts loaded');render('review')}
function closePeriod(){if(db.entries.some(e=>e.status==='draft'))return toast('Review all drafts before period close.');if(Math.abs(trialDiff())>.005)return toast('Trial balance is not balanced. Investigate before close.');if(db.entries.some(e=>e.closing&&e.date===db.periodEnd))return toast('This period already has a closing entry.');let movement={};rangeEntries().forEach(e=>lines(e).forEach(l=>{movement[l.accountId]=(movement[l.accountId]||0)+(+l.debit)-(+l.credit)}));let closingLines=[];db.accounts.filter(a=>a.type==='Income'||a.type==='Expense').forEach(a=>{let raw=movement[a.id]||0;if(Math.abs(raw)>.005)closingLines.push({accountId:a.id,debit:raw<0?-raw:0,credit:raw>0?raw:0})});let diff=closingLines.reduce((s,l)=>s+l.debit-l.credit,0);if(Math.abs(diff)>.005){if(!acct('profit-summary'))db.accounts.push({id:'profit-summary',name:'Unallocated period profit / (loss)',type:'Equity',sub:'Unallocated profit'});closingLines.push({accountId:'profit-summary',debit:diff<0?-diff:0,credit:diff>0?diff:0})}if(closingLines.length<2)return toast('No balances to close.');db.entries.push({id:id(),date:db.periodEnd,ref:'CLOSE-'+db.periodEnd.replaceAll('-',''),memo:'Period close — transfer income and expenses to unallocated partner equity. Partner allocation remains pending approved sharing ratios.',entryType:'Closing',status:'posted',closing:true,lines:closingLines,createdAt:new Date().toISOString()});save();toast('Period closing entry posted');render('close')}
function addProduct(){document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal narrow"><div class="modal-head"><h2>Add inventory item</h2><button class="x" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field full"><label>ITEM NAME</label><input id="prod-name"></div><div class="field"><label>SKU</label><input id="prod-sku"></div><div class="field"><label>UNIT</label><input id="prod-unit" value="unit"></div><div class="field"><label>OPENING QUANTITY</label><input id="prod-qty" type="number" min="0" value="0"></div><div class="field"><label>UNIT COST (₹)</label><input id="prod-cost" type="number" min="0" step=".01" value="0"></div></div><div class="notice">Registering an item does not post an accounting entry or verify opening stock.</div><div class="actions" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProduct()">Add item</button></div></div></div>`}
function saveProduct(){let name=document.getElementById('prod-name').value.trim();if(!name)return toast('Enter an item name.');db.products=db.products||[];db.products.push({id:id(),name,sku:document.getElementById('prod-sku').value.trim(),unit:document.getElementById('prod-unit').value.trim()||'unit',qty:+document.getElementById('prod-qty').value||0,cost:+document.getElementById('prod-cost').value||0});save();closeModal();render('inventory');toast('Inventory item added')}
function removeProduct(pid){db.products=(db.products||[]).filter(p=>p.id!==pid);save();render('inventory')}
function backup(){const blob=new Blob([JSON.stringify({...db,backupAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AETHEL-books-backup-'+isoToday()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded')}
function restoreBackup(event){let f=event.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result);if(!Array.isArray(parsed.accounts)||!Array.isArray(parsed.entries))throw Error();if(!confirm('Replace the current local books with this backup?'))return;db={...structuredClone(defaults),...parsed};save();render('settings');toast('Backup restored')}catch{toast('This file is not a valid AETHEL books backup.')}};reader.readAsText(f)}
function exportCSV(){let rows=[['Date','Reference','Entry Type','Status','Counterparty','Memo','Account','Account Type','Debit INR','Credit INR']];db.entries.forEach(e=>lines(e).forEach(l=>rows.push([e.date,e.ref,e.entryType,e.status,e.party,e.memo,acct(l.accountId)?.name||l.accountId,acct(l.accountId)?.type||'',l.debit||0,l.credit||0])));let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='AETHEL-journal-'+isoToday()+'.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV exported')}
function wipeData(){if(!confirm('Permanently clear all AETHEL books and drafts stored in this browser? Download a backup first if needed.'))return;db=structuredClone(defaults);save();render('settings');toast('Local books reset')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.openEntry=openEntry;window.closeModal=closeModal;window.addLine=addLine;window.updateSums=updateSums;window.saveEntry=saveEntry;window.editEntry=editEntry;window.inspectEntry=inspectEntry;window.deleteEntry=deleteEntry;window.seedDrafts=seedDrafts;window.nav=nav;window.saveSettings=saveSettings;window.backup=backup;window.restoreBackup=restoreBackup;window.exportCSV=exportCSV;window.wipeData=wipeData;window.closePeriod=closePeriod;window.addProduct=addProduct;window.saveProduct=saveProduct;window.removeProduct=removeProduct;window.render=render;window.openAccountCreator=openAccountCreator;window.saveNewAccount=saveNewAccount;render('dashboard');
})();
</script></body></html>
