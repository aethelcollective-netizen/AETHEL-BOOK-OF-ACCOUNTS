function salesRevenueSummary(){let amount=0,count=0;rangeEntries().forEach(entry=>{let includesSales=false;(entry.lines||[]).forEach(line=>{const account=acct(line.accountId);if(!isSalesRevenueAccount(account))return;includesSales=true;amount+=(+line.credit||0)-(+line.debit||0)});if(includesSales)count++});return {amount,count}}function isSalesRevenueAccount(account){if(account?.type!=='Income')return false;const name=String(account.name||'').trim().toLowerCase(),sub=String(account.sub||'').trim().toLowerCase();return account.id==='sales-income'||['sales','sales revenue','sales returns'].includes(sub)||/^sales(?:\s|$|\/|[-–])/.test(name)}function expectedSaleDeadline(value){if(!value)return 'Deadline not set';const [date,time='']=String(value).split('T');if(!date)return 'Deadline not set';const timeLabel=time?new Date(`${date}T${time}`).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';return `${day(date)}${timeLabel?' · '+timeLabel:''}`}function expectedSaleStatusLabel(status){return ({new:'New lead',contacted:'Contacted',expected:'Expected sale','not-proceeding':'Not proceeding'})[status]||'New lead'}function expectedSalesTracker(){const prospects=[...(Array.isArray(db.salesProspects)?db.salesProspects:[])].sort((a,b)=>String(a.deadline||'').localeCompare(String(b.deadline||''))),active=prospects.filter(x=>x.status!=='not-proceeding'),value=active.reduce((sum,x)=>sum+(+x.expectedPrice||0),0);return `<section class="card section expected-sales-section"><div class="section-top expected-sales-top"><div><div class="eyebrow">PRIVATE PLANNING SPACE</div><h2>Expected sales</h2><span class="small muted">Track interested customers and follow-up deadlines. This list stays separate from your accounting books.</span></div><button class="btn primary" onclick="openExpectedSale()">＋ Add prospect</button></div><div class="expected-sales-summary"><span><b>${active.length}</b> active prospect${active.length===1?'':'s'}</span><span>Potential value <b>${money(value)}</b></span></div>${prospects.length?`<div class="expected-sales-grid">${prospects.map(x=>`<article class="expected-sale-card"><div class="expected-sale-head"><div><h3>${esc(x.name||'Unnamed prospect')}</h3><span class="small muted">${esc(x.productName||'Product not set')}</span></div><span class="badge ${x.status==='expected'?'green':x.status==='not-proceeding'?'red':''}">${expectedSaleStatusLabel(x.status)}</span></div><div class="expected-sale-price">${money(x.expectedPrice)} <small>expected price</small></div><div class="expected-sale-details"><div><label>DEADLINE</label><span>${esc(expectedSaleDeadline(x.deadline))}</span></div>${x.phone?`<div><label>PHONE</label><span>${esc(x.phone)}</span></div>`:''}${x.instagram?`<div><label>INSTAGRAM</label><span>${esc(x.instagram)}</span></div>`:''}</div><div class="expected-sale-actions"><select aria-label="Prospect status" onchange="updateExpectedSaleStatus('${esc(x.id)}',this.value)"><option value="new" ${(!x.status||x.status==='new')?'selected':''}>New lead</option><option value="contacted" ${x.status==='contacted'?'selected':''}>Contacted</option><option value="expected" ${x.status==='expected'?'selected':''}>Expected sale</option><option value="not-proceeding" ${x.status==='not-proceeding'?'selected':''}>Not proceeding</option></select><button class="btn sm" onclick="openExpectedSale('${esc(x.id)}')">Edit</button><button class="btn sm danger" onclick="deleteExpectedSale('${esc(x.id)}')">Delete</button></div></article>`).join('')}</div>`:'<div class="empty expected-sales-empty">No prospects added yet. Record an interested customer here; it will not create a journal entry or change your reports.</div>'}<p class="small muted expected-sales-note">Planning only: creating or updating a prospect never records a sale, invoice, receivable, or journal entry. When a sale is confirmed, enter it separately through Invoices or Journal.</p></section>`}
function dashboard(){const b=balances(db.periodEnd),p=pnl(),sales=salesRevenueSummary(),asset=db.accounts.filter(a=>a.type==='Asset').reduce((sum,a)=>sum+(b[a.id]||0),0),draft=db.entries.filter(e=>e.status==='draft').length;let recent=[...db.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `${head(`Good ${new Date().getHours()<12?'morning':'day'}`,'A clear view of your books for the selected accounting period.',`<button class="btn" onclick="nav('reports')">View reports</button><button class="btn primary" onclick="openEntry()">＋ Record transaction</button>`)}${db.entries.length===0?'<div class="notice"><b>Books are ready.</b> No transactions have been posted. Opening partner capital balances from your brief are prepared as clearly labeled opening-balance drafts for review.</div>':''}<div class="stats"><div class="card stat cash-bank-stat"><div class="goldline"></div><label>Cash &amp; bank</label><div class="cash-bank-values"><div><small>Cash in hand</small><strong>${money(b.cash||0)}</strong></div><div><small>Bank</small><strong>${money(b.bank||0)}</strong></div></div><small>Balances as at ${day(db.periodEnd)}</small></div><div class="card stat"><div class="goldline"></div><label>Sales this period</label><strong>${money(sales.amount)}</strong><small>${sales.count} posted sale transaction${sales.count===1?'':'s'} in period</small></div><div class="card stat"><div class="goldline"></div><label>Net profit / (loss)</label><strong style="color:${p.net<0?'var(--red)':'inherit'}">${money(p.net)}</strong><small>For selected accounting period</small></div><div class="card stat"><div class="goldline"></div><label>Total assets</label><strong>${money(asset)}</strong><small>At period end</small></div></div>${expectedSalesTracker()}<div class="grid2"><section class="card section"><div class="section-top"><h2>Recent activity</h2><button class="btn sm" onclick="nav('journal')">Open journal</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>Date / reference</th><th>Description</th><th>Status</th><th class="num">Amount</th></tr></thead><tbody>${recent.map(e=>`<tr><td>${day(e.date)}<br><span class="muted">${esc(e.ref||'')}</span></td><td>${esc(e.memo||'—')}</td><td><span class="badge ${e.status==='posted'?'green':''}">${e.status==='posted'?'Posted':'Draft'}</span></td><td class="num">${money(totals(e).dr)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No activity yet. Start by reviewing your drafts or recording an opening balance.</div>'}</section><section class="card section"><div class="section-top"><h2>Needs your review</h2><button class="btn sm" onclick="nav('review')">Review drafts${draft?` (${draft})`:''}</button></div>${draft?`<p class="small muted"><span class="alert-dot"></span>${draft} draft item${draft===1?'':'s'} waiting for review. Drafts never affect your reports or balances.</p>`:'<p class="small muted">There are no drafts waiting for review.</p>'}<div class="breakdown"><span>Accounting period</span><b>${day(db.periodStart)} – ${day(db.periodEnd)}</b></div><div class="breakdown"><span>GST configuration</span><b>${db.gstEnabled?'Enabled':'Optional · not enabled'}</b></div><div class="breakdown"><span>Partners</span><b>3</b></div></section></div><div class="banner">Opening balances and transaction references supplied in the brief are labeled as user-provided or unposted examples. Review and confirm each draft before posting.</div>`}

t proceeding</option></select></div></div><div class="notice expected-sale-notice">Standalone tracker only. Saving this prospect does not create an invoice, journal entry, ledger balance, or financial-report amount.</div><div class="actions" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveExpectedSale('${esc(prospectId)}')">Save prospect</button></div></div></div>`}
function saveExpectedSale(prospectId=''){const name=document.getElementById('expected-sale-name').value.trim(),phone=document.getElementById('expected-sale-phone').value.trim(),instagram=document.getElementById('expected-sale-instagram').value.trim(),productName=document.getElementById('expected-sale-product').value.trim(),priceText=document.getElementById('expected-sale-price').value.trim(),expectedPrice=Number(priceText),deadline=document.getElementById('expected-sale-deadline').value,status=document.getElementById('expected-sale-status').value;if(!name||!productName||priceText===''||!Number.isFinite(expectedPrice)||expectedPrice<0||!deadline)return toast('Enter a contact name, product, non-negative expected price, and deadline date/time.');const list=Array.isArray(db.salesProspects)?db.salesProspects:(db.salesProspects=[]),old=list.find(x=>x.id===prospectId),item={...(old||{}),id:old?.id||id(),name,phone,instagram,productName,expectedPrice,deadline,status,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(old)list[list.indexOf(old)]=item;else list.push(item);save();closeModal();render('dashboard');toast('Prospect saved in the standalone tracker')}

function journal(){const sort=window.journalSort||'date-desc',sortLabel={"date-desc":"Date · newest first","date-asc":"Date · oldest first","reference-asc":"Reference ID · A–Z","reference-desc":"Reference ID · Z–A","entry-asc":"Entry ID · A–Z","entry-desc":"Entry ID · Z–A"},field=sort.startsWith('reference-')?'ref':sort.startsWith('entry-')?'id':'date',descending=sort.endsWith('-desc'),compare=(a,b)=>String(a||'').localeCompare(String(b||''),'en',{numeric:true,sensitivity:'base'}),entries=[...db.entries].sort((a,b)=>{const result=compare(a[field],b[field]);return (descending?-result:result)||compare(a.ref,b.ref)||compare(a.id,b.id)});return `${head('Journal','Every posted entry is balanced, dated and retained in the audit trail.',`<button class="btn" onclick="exportCSV()">Export journal CSV</button><button class="btn primary" onclick="openEntry()">＋ New entry</button>`)}<div class="card section"><div class="journal-tools"><div><h2>Transaction history</h2><span class="muted small">${db.entries.length} total · ${postedCount()} posted</span></div><label class="journal-sort-label">SORT BY<select class="journal-sort" aria-label="Sort journal entries" onchange="window.journalSort=this.value;render('journal')">${Object.entries(sortLabel).map(([value,label])=>`<option value="${value}" ${sort===value?'selected':''}>${label}</option>`).join('')}</select></label></div>${entryTable(entries)}</div>`}

function recordAccountChange(action,account,before=null){if(!Array.isArray(db.accountAudit))db.accountAudit=[];if(!Array.isArray(db.products))db.products=[];if(!Array.isArray(db.bankStatementRows))db.bankStatementRows=[];if(!Array.isArray(db.recurringExpenses))db.recurringExpenses=[];if(!['weighted-average','fifo'].includes(db.inventoryMethod))db.inventoryMethod='weighted-average';const snap=x=>x?{id:x.id,name:x.name,type:x.type,sub:x.sub,archived:!!x.archived}:null,ref=account||before;let summary=action==='Edited'?(before?.name!==account?.name?`${before?.name||'Account'} renamed to ${account?.name||'Account'}`:`${account?.name||'Account'} details updated`):action==='Created'?`${account?.name||'Account'} created`:`${ref?.name||'Account'} ${action.toLowerCase()}`;if(action==='Edited'&&before?.type!==account?.type)summary+=` · ${before.type} → ${account.type}`;db.accountAudit.unshift({at:new Date().toISOString(),action,accountId:ref?.id||'',accountName:ref?.name||'Account',summary,before:snap(before),after:snap(account)});db.accountAudit=db.accountAudit.slice(0,100)}

function chartAccounts(){const rows=db.accounts.map(a=>{const used=accountUsage(a.id),archived=!!a.archived,search=(a.name+' '+a.type+' '+(a.sub||'')).toLowerCase();return `<div class="chart-row${archived?' is-archived':''}" data-search="${esc(search)}" data-archived="${archived}"><div class="chart-account"><strong>${esc(a.name)}</strong><small>${archived?'<span class="badge red">Archived</span> ':''}${esc(a.id)}</small></div><div class="chart-meta-grid"><div class="chart-meta"><label>Type</label><span class="badge ${a.type==='Income'?'green':''}">${esc(a.type)}</span></div><div class="chart-meta"><label>Group</label><span>${esc(a.sub||'—')}</span></div><div class="chart-meta"><label>Journal use</label><span>${used} ${used===1?'entry':'entries'}</span></div></div><div class="chart-actions">${archived?`<button class="btn sm gold" onclick="restoreAccount('${esc(a.id)}')">Restore</button>`:`<button class="btn sm" onclick="openAccountLedger('${esc(a.id)}')">Ledger</button><button class="btn sm" onclick="editAccount('${esc(a.id)}')">Edit</button><button class="btn sm danger" onclick="deleteAccount('${esc(a.id)}')">Delete</button>`}</div></div>`}).join('');const events=(db.accountAudit||[]).slice(0,8);return `${head('Chart of Accounts','Manage the accounts available in journal entries and follow account changes.',`<button class="btn primary" onclick="openAccountCreator()">＋ New account</button>`)}<div class="notice">Account names and groups update everywhere by account ID. Accounts with journal history are archived when removed from new entries so posted books and drafts stay intact. Only unused custom accounts can be permanently deleted.</div><section class="card section chart-section"><div class="section-top chart-tools"><div><h2>Accounts</h2><span class="muted small">${db.accounts.filter(a=>!a.archived).length} active · ${db.accounts.filter(a=>a.archived).length} archived</span></div><div class="chart-filters"><input class="chart-search" type="search" placeholder="Sear function filterChartAccounts(query){const search=typeof query==='string'?query.toLowerCase().trim():(document.querySelector('.chart-search')?.value||'').toLowerCase().trim(),status=document.getElementById('chart-status-filter')?.value||'active';let shown=0;document.querySelectorAll('.chart-row[data-search]').forEach(row=>{const isArchived=row.dataset.archived==='true',matchesSearch=row.dataset.search.includes(search),matchesStatus=status==='all'||(status==='archived'?isArchived:!isArchived);row.hidden=!(matchesSearch&&matchesStatus);if(!row.hidden)shown++});const empty=document.getElementById('chart-no-results');if(empty)empty.hidden=shown>0}
function editAccount(accountId){const a=acct(accountId);if(!a)return;const refs=accountUsage(a.id);document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal narrow"><div class="modal-head"><div><div class="eyebrow">CHART OF ACCOUNTS</div><h2>Edit account</h2></div><button class="x" onclick="closeModal()" aria-label="Close">×</button></div><div class="form-grid"><div class="field full"><label>ACCOUNT NAME</label><input id="edit-account-name" maxlength="100" value="${esc(a.name)}"></div><div class="field"><label>ACCOUNT TYPE</label><select id="edit-account-type" onchange="updateAccountSubtypeChoices('edit-account')">${['Asset','Liability','Equity','Income','Expense'].map(t=>`<option ${a.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>GROUP / SUBTYPE</label><select id="edit-account-sub" onchange="toggleAccountSubtypeCustom('edit-account')">${accountSubtypeOptions(a.type,a.sub||'')}</select><input id="edit-account-sub-custom" maxlength="80" placeholder="Enter custom subtype" hidden></div></div>${refs?`<div class="notice account-reclass-note"><b>${refs} journal ${refs===1?'entry':'entries'} use this account.</b> Changing its type or subtype changes where the complete history appears in financial reports.<label class="switch"><input id="account-reclass-confirm" type="checkbox"> I understand the report classification will change.</label></div>`:''}${a.archived?'<div class="banner">This account is archived and unavailable for new journal lines. Restoring it is available from the Chart of Accounts.</div>':''}<div class="actions" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAccount('${esc(a.id)}')">Save changes</button></div></div></div>`}
function saveAccount(accountId){const a=acct(accountId);if(!a)return;const name=document.getElementById('edit-account-name').value.trim(),type=document.getElementById('edit-account-type').value,sub=accountSubtypeValue('edit-account');if(!name)return toast('Enter an account name.');if(!sub)return toast('Choose or enter an account subtype.');if(db.accounts.some(x=>x.id!==accountId&&x.name.toLowerCase()===name.toLowerCase()))return toast('An account with that name already exists.');const refs=accountUsage(accountId);if(refs&&(type!==a.type||sub!==a.sub)&&!document.getElementById('account-reclass-confirm')?.checked)return toast('Confirm the report reclassification before changing account type or subtype.');const before={...a};a.name=name;a.type=type;a.sub=sub;recordAccountChange('Edited',a,before);save();closeModal();toast('Account updated across the books');render(activePage())}

function updateInvoiceTotals(){const box=document.getElementById('invoice-items');if(!box)return;const rows=[...box.querySelectorAll('.invoice-item-row')].map(row=>({quantity:+row.querySelector('.invoice-item-qty').value||0,rate:+row.querySelector('.invoice-item-rate').value||0,taxRate:+row.querySelector('.invoice-item-tax').value||0})),inv={items:rows,discount:+document.getElementById('inv-discount')?.value||0,shipping:+document.getElementById('inv-shipping')?.value||0,shippingTaxRate:+document.getElementById('inv-shipping-tax')?.value||0},amounts=invoiceTotals(inv);document.getElementById('inv-subtotal').textContent=money(amounts.grossSubtotal);document.getElementById('inv-discount-total').textContent=money(amounts.discount);document.getElementById('inv-shipping-total').textContent=money(amounts.shipping);document.getElementById('inv-tax-total').textContent=money(amounts.tax);document.getElementById('inv-grand-total').textContent=money(amounts.total);updateInvoicePreview()}
function normalizeInvoiceState(v){return String(v||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('en-IN')}function ensureInvoiceGstAccounts(){for(const [id,name,sub] of [['gst-cgst-out','CGST payable','CGST'],['gst-sgst-out','SGST / UTGST payable','SGST'],['gst-igst-out','IGST payable','IGST']])if(!acct(id))db.accounts.push({id,name,type:'Liability',sub:'Tax'})}
function saveInvoice(invoiceId='',issue=false){const profile=invoiceProfileFromForm(),old=invoiceId&&db.invoices.find(x=>x.id===invoiceId),items=invoiceStartedRows().map(x=>({description:x.description,hsn:x.hsn,unit:x.unit,quantity:x.quantity,rate:x.rate,taxRate:x.taxRate}));if(issue&&!items.length)return toast('Add at least one described invoice line.');if(issue&&items.some(x=>!x.description||!Number.isFinite(x.quantity)||x.quantity<=0||x.rate===''||!Number.isFinite(x.rate)||x.rate<0))return toast('Complete each invoice line with a description, positive quantity, and non-negative rate.');if(issue&&!db.gstEnabled&&items.some(x=>x.taxRate>0))return toast('Enable GST in Settings before adding GST to an invoice.');if(issue){for(let step=0;step<6;step++){const problem=invoiceWizardStepIssue(step);if(problem)return toast(problem)}}const invoiceNumber=document.getElementById('inv-number').value.trim(),date=document.getElementById('inv-date').value,dueDate=document.getElementById('inv-due').value,customerName=document.getElementById('inv-customer').value.trim(),customerGstin=document.getElementById('inv-gstin').value.trim().toUpperCase();if(!invoiceNumber||invoiceNumber.length>16||!date||!dueDate||dueDate<date)return toast('Enter a unique invoice number up to 16 characters and valid issue and due dates.');if(issue&&!customerName)return toast('Enter the customer name before issuing.');if(issue&&customerGstin&&(!db.gstEnabled||customerGstin.length!==15))return toast('Enter a 15-character GSTIN only when GST is enabled.');if(db.invoices.some(x=>x.id!==invoiceId&&x.invoiceNumber.toLowerCase()===invoiceNumber.toLowerCase()))return toast('That invoice number is already in use.');const draft={...(old||{}),id:old?.id||id(),invoiceNumber,date,dueDate,customerName,customerGstin,address:document.getElementById('inv-address').value.trim(),placeOfSupply:document.getElementById('inv-place').value.trim(),gstType:'',businessProfile:profile,discount:Math.max(0,+document.getElementById('inv-discount').value||0),shipping:Math.max(0,+document.getElementById('inv-shipping').value||0),shippingTaxRate:+document.getElementById('inv-shipping-tax').value||0,notes:document.getElementById('inv-notes').value.trim(),items,paidAmount:+old?.paidAmount||0,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),status:issue?'issued':'draft'},amounts=invoiceTotals(draft);if(issue&&db.entries.some(e=>e.closing&&e.status==='posted'&&date<=e.date))return toast('Void the covering period close before issuing an earlier-dated invoice.');if(issue){if(amounts.total<=0)return toast('The invoice total must be greater than zero.');if(!acct('ar')||!acct('sales-income'))return toast('Accounts receivable and Sales accounts are required.');if(amounts.tax>.005){if(!db.gstEnabled)return toast('Enable GST only if AETHEL is registered and ready to issue a tax invoice.');if(!profile.gstin||profile.gstin.length!==15||!profile.address||!profile.state||!draft.placeOfSupply)return toast('For a GST invoice, set the business address, state and GSTIN in Settings, and enter the place of supply.');if(amounts.total>=50000&&!customerGstin&&!draft.address)return toast('For an unregistered customer invoice of ₹50,000 or more, enter the customer address.');draft.gstType=normalizeInvoiceState(profile.state)===normalizeInvoiceState(draft.placeOfSupply)?'intra':'inter';ensureInvoiceGstAccounts();Object.assign(amounts,invoiceTotals(draft))}const journalLines=[{accountId:'ar',debit:amounts.total,credit:0},{accountId:'sales-income',debit:0,credit:amounts.subtotal}];if(amounts.tax>.005){if(draft.gstType==='intra')journalLines.push({accountId:'gst-cgst-out',debit:0,credit:amounts.cgst},{accountId:'gst-sgst-out',debit:0,credit:amounts.sgst});else journalLines.push({accountId:'gst-igst-out',debit:0,credit:amounts.igst})}if(Math.abs(journalLines.reduce((s,l)=>s+l.debit-l.credit,0))>.005)return toast('Invoice totals do not balance; check the line tax rates.');const entry={id:id(),date,ref:invoiceNumber,memo:`Customer invoice ${invoiceNumber}`,entryType:'Sale',status:'posted',party:customerName,invoiceId:draft.id,lines:journalLines,createdAt:new Date().toISOString()};db.entries.push(entry);draft.journalEntryId=entry.id}db.invoiceProfile={...profile};db.company=profile.name||db.company;db.businessAddress=profile.address;db.businessState=profile.state;db.gstin=profile.gstin;const index=db.invoices.findIndex(x=>x.id===draft.id);if(index>=0)db.invoices[index]=draft;else db.invoices.push(draft);save();closeModal();render('invoices');toast(issue?'Invoice issued and posted to the journal':'Invoice draft saved')}
function invoiceCard(inv){const t=invoiceTotals(inv),balance=invoiceRound(t.total-(+inv.paidAmount||0)),status=inv.status==='issued'&&inv.paidAmount>0?'Part-paid':inv.status==='issued'?'Issued':inv.status==='paid'?'Paid':inv.status==='void'?'Void':'Draft';return `<article class="invoice-card"><div class="invoice-card-top"><div><span class="eyebrow">${esc(inv.invoiceNumber)}</span><h3>${esc(inv.customerName||'Customer not set')}</h3><span class="small muted">Issued ${day(inv.date)} · Due ${day(inv.dueDate)}</span></div><span class="badge ${['paid','issued'].includes(inv.status)?'green':inv.status==='void'?'red':''}">${status}</span></div><div class="invoice-card-bottom"><div><small>Total</small><b>${money(t.total)}</b></div><div><small>Received</small><b>${money(inv.paidAmount||0)}</b></div><div><small>Balance</small><b>${money(balance)}</b></div></div><div class="actions invoice-card-actions">${inv.status==='draft'?`<button class="btn sm gold" onclick="openInvoice('${esc(inv.id)}')">Edit draft</button><button class="btn sm primary" onclick="openInvoice('${esc(inv.id)}')">Issue invoice</button><button class="btn sm danger" onclick="deleteInvoice('${esc(inv.id)}')">Delete</button>`:inv.status==='void'?'<span class="small muted">Voided invoice retained in history</span>':`<button class="btn sm" onclick="printInvoice('${esc(inv.id)}')">Print / PDF</button>${inv.status!=='paid'?`<button class="btn sm gold" onclick="recordInvoicePayment('${esc(inv.id)}')">Record payment</button>`:''}<button class="btn sm danger" onclick="deleteInvoice('${esc(inv.id)}')">Void</button>`}</div></article>`}
function invoicesPage(){const docs=[...(Array.isArray(db.invoices)?db.invoices:[])].sort((a,b)=>String(b?.date||'').localeCompare(String(a?.date||''))||String(b?.invoiceNumber||'').localeCompare(String(a?.invoiceNumber||''))),issued=docs.filter(x=>['issued','paid'].includes(x.status)),outstanding=issued.reduce((s,x)=>s+Math.max(0,invoiceTotals(x).total-(+x.paidAmount||0)),0);return `${head('Invoices','Create polished customer invoices and post issued invoices directly to the sales ledger.',`<button class="btn" onclick="nav('sales')">Sales ledger</button><button class="btn primary" onclick="openInvoice()">＋ Create invoice</button>`)}<div class="stats invoice-stats"><div class="card stat"><div class="goldline"></div><label>Invoices</label><strong>${docs.length}</strong><small>Drafts stay outside the ledgers</small></div><div class="card stat"><div class="goldline"></div><label>Outstanding</label><strong>${money(outstanding)}</strong><small>Issued invoices less recorded receipts</small></div><div class="card stat"><div class="goldline"></div><label>GST</label><strong>${db.gstEnabled?'Enabled':'Off'}</strong><small>${db.gstEnabled?'Tax lines can be added':'Optional · enable in Settings only if registered'}</small></div></div>${docs.length?`<div class="invoice-list">${docs.map(invoiceCard).join('')}</div>`:`<section class="card section invoice-empty"><div class="eyebrow">AETHEL INVOICING</div><h2>Your invoices, beautifully presented.</h2><p class="muted">Create a draft, add customer details and item lines, then issue it to post the sale and receivable. Print to paper or save as PDF.</p><button class="btn primary" onclick="openInvoice()">Create first invoice</button></section>`}<div class="banner invoice-policy">Issued invoices post to Accounts receivable and Sales. Customer payments are separate cash / bank receipts. GST is optional and only appears when enabled.</div>`}

function printInvoice(invoiceId){const inv=db.invoices.find(x=>x.id===invoiceId);if(!inv)return;const root=document.getElementById('invoice-print-root');root.innerHTML=invoicePrintMarkup(inv);root.hidden=false;document.body.classList.add('print-invoice');const finish=()=>{document.body.classList.remove('print-invoice');root.hidden=true;window.removeEventListener('afterprint',finish)};window.addEventListener('afterprint',finish,{once:true});window.print();setTimeout(finish,30000)}
function deleteInvoice(invoiceId){const inv=db.invoices.find(x=>x.id===invoiceId);if(!inv)return;if(inv.status==='draft'){if(!confirm(`Delete invoice draft ${inv.invoiceNumber}?`))return;db.invoices=db.invoices.filter(x=>x.id!==invoiceId);save();render('invoices');return}if(inv.status==='void')return toast('This invoice is already void.');if(db.entries.some(e=>e.closing&&e.status==='posted'&&inv.date<=e.date))return toast('Void the covering period close before voiding this invoice.');if((+inv.paidAmount||0)>.005)return toast('This invoice has receipts. Reverse or reallocate those payments before voiding it.');if(!confirm(`Void invoice ${inv.invoiceNumber} and its posted sales entry? The records will be retained as void.`))return;const entry=db.entries.find(e=>e.id===inv.journalEntryId);if(entry&&entry.status==='posted'){entry.auditTrail=[...(entry.auditTrail||[]),{at:new Date().toISOString(),action:'Voided with invoice',beforeStatus:'posted'}];entry.status='void';entry.updatedAt=new Date().toISOString()}inv.status='void';inv.updatedAt=new Date().toISOString();save();render('invoices');toast('Invoice voided and retained')}

function saveInvoicePayment(invoiceId){const inv=db.invoices.find(x=>x.id===invoiceId),date=document.getElementById('inv-pay-date').value,amount=invoiceRound(+document.getElementById('inv-pay-amount').value),accountId=document.getElementById('inv-pay-account').value,due=invoiceRound(invoiceTotals(inv).total-(+inv.paidAmount||0));if(!inv||!date||date<inv.date||!Number.isFinite(amount)||amount<=0||amount>due+.005)return toast('Enter a valid receipt date and amount no greater than the balance due.');if(!accountId||!acct(accountId))return toast('Choose a cash or bank account.');const ref=document.getElementById('inv-pay-ref').value.trim(),entry={id:id(),date,ref:ref||`RCPT-${inv.invoiceNumber}-${String(db.entries.length+1).padStart(3,'0')}`,memo:`Receipt for invoice ${inv.invoiceNumber}`,entryType:'Receipt',status:'posted',party:inv.customerName,invoiceId:inv.id,lines:[{accountId,debit:amount,credit:0},{accountId:'ar',debit:0,credit:amount}],createdAt:new Date().toISOString()};db.entries.push(entry);inv.paidAmount=invoiceRound((+inv.paidAmount||0)+amount);inv.status=inv.paidAmount>=invoiceTotals(inv).total-.005?'paid':'issued';inv.updatedAt=new Date().toISOString();save();closeModal();render('invoices');toast('Customer receipt posted to the journal')}
function partyBalances(id){const a=acct(id),ls=allLines().filter(l=>l.accountId===id);let balance=ls.reduce((s,l)=>s+(+l.debit- +l.credit),0);return `<div class="breakdown"><span>${esc(a.name)} · total</span><b>${money(balance)}</b></div><p class="small muted">For party-level balances, include the customer or supplier name in the transaction memo; individual sub-ledgers are shown in the ledger.</p>`}
function inventoryState(product,method=db.inventoryMethod){let qty=+product.qty||0,value=qty*(+product.cost||0),layers=qty>0?[{qty,cost:+product.cost||0}]:[],events=db.entries.filter(e=>e.status==='posted'&&e.stockMovement?.productId===product.id).sort((a,b)=>a.date.localeCompare(b.date)||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));for(const e of events){const m=e.stockMovement,q=+m.quantity||0;if(m.action==='receipt'){qty+=q;value+=+m.totalCost||q*(+m.unitCost||0);if(method==='fifo')layers.push({qty:q,cost:+m.unitCost||0})}else if(m.action==='issue'){if(method==='fifo'){let left=q;while(left>.000001&&layers.length){const layer=layers[0],take=Math.min(left,layer.qty);value-=take*layer.cost;layer.qty-=take;left-=take;if(layer.qty<.000001)layers.shift()}qty-=q}else{qty-=q;value-=+m.totalCost||0}}}return {qty:Math.max(0,qty),value:Math.max(0,value),unitCost:qty>.000001?Math.max(0,value)/qty:0,layers}}
function inventoryIssueCost(product,quantity){const state=inventoryState(product),qty=+quantity;if(qty>state.qty+.000001)return null;if(db.inventoryMethod==='fifo'){let left=qty,cost=0;for(const layer of state.layers){const take=Math.min(left,layer.qty);cost+=take*layer.cost;left-=take;if(left<.000001)break}return left<.000001?cost:null}return qty*state.unitCost}
function inventory(){const b=balances(),products=db.products||[],states=products.map(p=>({product:p,state:inventoryState(p)})),stockValue=states.reduce((s,x)=>s+x.state.value,0),glValue=b.inventory||0,methodLocked=db.entries.some(e=>e.status==='posted'&&e.stockMovement);return `${head('Inventory','Value stock by weighted average or FIFO, with every movement linked to a journal entry.',`<button class="btn" onclick="addProduct()">＋ Add item</button><button class="btn primary" onclick="openStockMovement()" ${products.length?'':'disabled'}>＋ Record stock movement</button>`)}<div class="stats"><div class="card stat"><div class="goldline"></div><label>Tracked stock value</label><strong>${money(stockValue)}</strong><small>Calculated from opening items and posted movements</small></div><div class="card stat"><div class="goldline"></div><label>Inventory account</label><strong>${money(glValue)}</strong><small>Posted general-ledger balance</small></div><div class="card stat"><div class="goldline"></div><label>Items tracked</label><strong>${products.length}</strong><small>${money(states.reduce((s,x)=>s+x.state.qty,0))} total units</small></div><div class="card stat"><div class="goldline"></div><label>Valuation method</label><strong style="font-size:16px">${db.inventoryMethod==='fifo'?'FIFO':'Weighted average'}</strong><small>${methodLocked?'Locked after posted stock movements':'Changeable until first movement'}</small></div></div><div class="notice"><b>Inventory subledger check:</b> tracked stock ${money(stockValue)} · posted Inventory account ${money(glValue)} · difference ${money(stockValue-glValue)}. Opening quantities are item-register values only until supported and posted. Stock movements post a journal entry; do not also book the same receipt as a separate inventory purchase.</div><div class="card section"><div class="section-top"><h2>Item valuation</h2><label class="journal-sort-label">COSTING METHOD<select class="journal-sort" onchange="setInventoryMethod(this.value)" ${methodLocked?'disabled':''}><option value="weighted-average" ${db.inventoryMethod==='weighted-average'?'selected':''}>Weighted average</option><option value="fifo" ${db.inventoryMethod==='fifo'?'selected':''}>FIFO · first in, first out</option></select></label></div>${products.length?`<div class="table-wrap"><table><thead><tr><th>Item / SKU</th><th class="num">On hand</th><th>Unit</th><th class="num">Avg / FIFO unit cost</th><th class="num">Valuation</th></tr></thead><tbody>${states.map(({product:p,state:s})=>`<tr><td><b>${esc(p.name)}</b><br><span class="muted small">${esc(p.sku||'No SKU')}</span></td><td class="num">${s.qty.toLocaleString('en-IN',{maximumFractionDigits:3})}</td><td>${esc(p.unit||'unit')}</td><td class="num">${money(s.unitCost)}</td><td class="num">${money(s.value)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No items yet. Add products, then record reviewed stock receipts and issues.</div>'}</div><div class="card section" style="margin-top:15px"><div class="section-top"><h2>Recent stock movements</h2><span class="muted small">Posted movements are also in the journal</span></div>${inventoryMovementTable()}</div>`}
function inventoryMovementTable(){const rows=db.entries.filter(e=>e.status==='posted'&&e.stockMovement).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);return rows.length?`<div class="table-wrap"><table><thead><tr><th>Date / reference</th><th>Item</th><th>Movement</th><th class="num">Quantity</th><th class="num">Cost</th></tr></thead><tbody>${rows.map(e=>{const m=e.stockMovement,p=(db.products||[]).find(x=>x.id===m.productId);return `<tr><td>${day(e.date)}<br><span class="muted small">${esc(e.ref)}</span></td><td>${esc(p?.name||'Archived item')}</td><td>${m.action==='receipt'?'Receipt':'Issue'}</td><td class="num">${(+m.quantity||0).toLocaleString('en-IN')}</td><td class="num">${money(m.totalCost)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No stock movements posted yet.</div>'}
function setInventoryMethod(method){if(db.entries.some(e=>e.status==='posted'&&e.stockMovement)&&method!==db.inventoryMethod)return toast('Costing method is locked after the first posted stock movement.');if(!['weighted-average','fifo'].includes(method))return;db.inventoryMethod=method;save();render('inventory')}


function partnerAllocation(){const startTime=new Date(db.periodStart+'T00:00:00').getTime(),endTime=new Date(db.periodEnd+'T00:00:00').getTime(),days=Math.max(1,Math.floor((endTime-startTime)/86400000)+1),rateCapital=Math.max(0,+db.partnerTerms.interestCapitalRate||0),rateDrawings=Math.max(0,+db.partnerTerms.interestDrawingsRate||0),round2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100,netResult=round2(pnl().net),profitEligible=netResult>0,posted=allLines(),details=db.partners.map(p=>{const capitalBefore=posted.filter(l=>l.accountId===p.capitalAccountId&&l.date<db.periodStart).reduce((s,l)=>s+(+l.credit||0)-(+l.debit||0),0),capitalPeriod=posted.filter(l=>l.accountId===p.capitalAccountId&&l.date>=db.periodStart&&l.date<=db.periodEnd&&l.entryType!=='Closing'),capitalByDate={};capitalPeriod.forEach(l=>capitalByDate[l.date]=(capitalByDate[l.date]||0)+(+l.credit||0)-(+l.debit||0));let capitalBalance=capitalBefore,capitalTimeInterest=0,cursor=startTime;Object.entries(capitalByDate).sort(([a],[b])=>a.localeCompare(b)).forEach(([date,change])=>{const eventTime=new Date(date+'T00:00:00').getTime(),elapsed=Math.max(0,(eventTime-cursor)/86400000);capitalTimeInterest+=Math.max(0,capitalBalance)*rateCapital/100*elapsed/365;capitalBalance+=change;cursor=eventTime});const remainingDays=Math.max(0,Math.floor((endTime-cursor)/86400000)+1);capitalTimeInterest+=Math.max(0,capitalBalance)*rateCapital/100*remainingDays/365;const openingCapital=Math.max(0,capitalBefore+(capitalByDate[db.periodStart]||0)),capitalInterest=profitEligible?round2(capitalTimeInterest):0,drawings=posted.filter(l=>l.accountId===p.currentAccountId&&l.date>=db.periodStart&&l.date<=db.periodEnd&&l.entryType==='Drawing').reduce((s,l)=>{const amount=Math.max(0,(+l.debit||0)-(+l.credit||0)),left=Math.max(0,Math.floor((endTime-new Date(l.date+'T00:00:00').getTime())/86400000)+1);return s+amount*rateDrawings/100*left/365},0),drawingsInterest=round2(drawings),remuneration=profitEligible?round2(Math.max(0,+p.remunerati function savePartnerSettings(){if(db.entries.some(e=>e.closing&&e.status==='posted'&&e.date===db.periodEnd))return toast('Void the posted period close before changing terms.');const next=db.partners.map(p=>({...p,name:document.getElementById('partner-name-'+p.id).value.trim(),role:document.getElementById('partner-role-'+p.id).value.trim(),share:+document.getElementById('partner-share-'+p.id).value,remuneration:+document.getElementById('partner-remuneration-'+p.id).value})),capitalRate=+document.getElementById('partner-interest-capital').value,drawingsRate=+document.getElementById('partner-interest-drawings').value;if(next.some(p=>!p.name||!Number.isFinite(p.share)||p.share<0||!Number.isFinite(p.remuneration)||p.remuneration<0))return toast('Enter a name, non-negative share ratio and remuneration for each partner.');if(next.reduce((s,p)=>s+p.share,0)<=0)return toast('The total profit-sharing ratio must be greater than zero.');if(!Number.isFinite(capitalRate)||capitalRate<0||capitalRate>100||!Number.isFinite(drawingsRate)||drawingsRate<0||drawingsRate>100)return toast('Interest rates must be between 0% and 100%.');next.forEach(p=>{for(const [accountId,name] of [[p.capitalAccountId,`${p.name} — Capital`],[p.currentAccountId,`${p.name} — Current`]]){const a=acct(accountId);if(a&&a.name!==name){const before={...a};a.name=name;recordAccountChange('Edited',a,before)}}});db.partners=next;db.partnerTerms={interestCapitalRate:capitalRate,interestDrawingsRate:drawingsRate};save();closeModal();render('partners');toast('Partner terms saved')}

function cloudSaveConfigFromFields(){const url=document.getElementById('cloud-project-url')?.value.trim()||cloudConfig.projectUrl,key=document.getElementById('cloud-publishable-key')?.value.trim()||cloudConfig.publishableKey;let parsed;try{parsed=new URL(url)}catch{throw new Error('Enter your Supabase project URL first.')}if(parsed.protocol!=='https:'||!key)throw new Error('Enter the HTTPS project URL and publishable key.');cloudConfig={...cloudConfig,projectUrl:url.replace(/\/$/,''),publishableKey:key};cloudStoreConfig()}
async function cloudLoadMemberships(){if(!cloudSession?.user?.id)return;const q=`rest/v1/aethel_members?select=workspace_id,role,workspace:aethel_workspaces(name)&user_id=eq.${encodeURIComponent(cloudSession.user.id)}`;cloudMembers=await cloudRequest(q);if(cloudMembers.length===1)cloudConfig.workspaceId=cloudMembers[0].workspace_id;cloudStoreConfig();if(cloudConfig.workspaceId&&cloudMembers.some(m=>m.workspace_id===cloudConfig.workspaceId))await cloudSelectWorkspace(cloudConfig.workspaceId,false)}
async function cloudSelectWorkspace(workspaceId,refresh=true){cloudConfig.workspaceId=workspaceId;cloudStoreConfig();cloudReady=false;cloudConflict=false;cloudRemoteRow=null;if(!workspaceId){cloudStatusMessage='Choose an AETHEL workspace.';if(refresh)render('settings');return}try{const rows=await cloudRequest(`rest/v1/aethel_books?select=revision,data,updated_at&workspace_id=eq.${encodeURIComponent(workspaceId)}&limit=1`);cloudRemoteRow=rows[0]||null;if(cloudRemoteRow){const remoteRevision=+cloudRemoteRow.revision||0,markerWorkspace=localStorage.getItem('aethel-cloud-baseline-workspace'),markerRevision=+(localStorage.getItem('aethel-cloud-baseline-revision')||0),savedBaseline=localStorage.getItem('aethel-cloud-baseline')||'';cloudRevision=remoteRevision;if(markerWorkspace===workspaceId&&savedBaseline){cloudBaseline=savedBaseline;cloudReady=true;const localChanged=JSON.stringify(db)!==savedBaseline;if(localChanged&&remoteRevision!==markerRevision){cloudConflict=true;cloudStatusMessage='Both this device and the shared books changed since the last sync. Download a backup of local work, then resolve the cloud conflict before continuing.'}else if(!localChanged&&remoteRevision>markerRevision){cloudAdoptData(cloudRemoteRow.data);cloudRevision=remoteRevision;cloudMarkBaseline(cloudRemoteBaselineData||db);cloudRemoteBaselineData=null;const purged=cloudIsDirty();if(purged)scheduleCloudSave();cloudStatusMessage=purged?'Legacy sample drafts removed; cleaning the shared books.':`Latest shared books loaded · revision ${cloudRevision}.`}else if(localChanged&&remoteRevision===markerRevision){cloudStatusMessage='Resuming a local save that was waiting to sync.';scheduleCloudSave()}else if(remoteRevision<markerRevision){cloudConflict=true;cloudStatusMessage='The shared revision is older than this device’s last synced version. Review the restore point before syncing.'}else cloudStatusMessage=`Automatic sync resumed · revision ${cloudRevision}.`}else cloudStatusMessage=`Shared books are available at revision ${cloudRevision}. Load them onto this device to turn on automatic sync.`}else cloudStatusMessage='Workspace found, but its book record is missing. Ask the owner to create the shared books.'}catch(e){cloudStatusMessage=e.message}if(refresh)render('settings')}
function cloudMarkBaseline(data=db){cloudBaseline=JSON.stringify(data);try{localStorage.setItem('aethel-cloud-baseline',cloudBaseline);localStorage.setItem('aethel-cloud-baseline-workspace',cloudConfig.workspaceId||'');localStorage.setItem('aethel-cloud-baseline-revision',String(cloudRevision))}catch{}cloudReady=true;cloudConflict=false}
async function cloudResumeSession(){if(!cloudSession?.access_token)return;try{await cloudLoadMemberships();if(activePage()==='settings')render('settings')}catch(e){cloudStatusMessage=`Cloud sign-in needs attention: ${e.message}`}}
function cloudCurrentMember(){return cloudMembers.find(m=>m.workspace_id===cloudConfig.workspaceId)}
async function cloudCreateWorkspace(){if(!cloudSession?.access_token)return toast('Sign in first.');if(!confirm(`Create the shared AETHEL workspace from this browser's current books (${db.entries.length} entries)? Other partners will be able to access it after you invite their accounts.`))return;try{const result=await cloudRequest('rest/v1/rpc/aethel_create_workspace',{method:'POST',body:JSON.stringify({p_name:db.company||'AETHEL COLLECTIVE',p_data:db})}),row=Array.isArray(result)?result[0]:result;cloudConfig.workspaceId=row.workspace_id;cloudStoreConfig();cloudMembers=[{workspace_id:row.workspace_id,role:'owner',workspace:{name:db.company}}];cloudRevision=+row.revision||1;cloudMarkBaseline();cloudStatusMessage='Shared workspace created. Invite the other partners by their signed-up email addresses.';render('settings');toast('Shared AETHEL books created')}catch(e){cloudStatusMessage=e.message;render('settings');toast(e.message)}}
function cloudMakeLocalRestorePoint(reason){let points=localRestorePoints();points.push({id:`manual-${Date.now()}`,day:isoToday(),createdAt:new Date().toISOString(),reason,data:structuredClone(db)});try{localStorage.setItem('aethel-books-restore-points',JSON.stringify(points.slice(-7)))}catch{}}
function cloudAdoptData(data){if(!data||!Array.isArray(data.accounts)||!Array.isArray(data.entries))throw new Error('The shared book record is incomplete.');cloudMakeLocalRestorePoint('Before cloud refresh');window.suppressCloudUpload=true;cloudRemoteBaselineData={...structuredClone(defaults),...structuredClone(data)};db=structuredClone(cloudRemoteBaselineData);db.entries=db.entries.filter(e=>!isLegacySampleDraft(e));db.products=Array.isArray(db.products)?db.products:[];db.bankStatementRows=Array.isArray(db.bankStatementRows)?db.bankStatementRows:[];db.recurringExpenses=Array.isArray(db.recurringExpenses)?db.recurringExpenses:[];db.salesProspects=Array.isArray(db.salesProspects)?db.salesProspects:[];db.accountAudit=Array.isArray(db.accountAudit)?db.accountAudit:[];localStorage.setItem('aethel-books-v1',JSON.stringify(db));window.suppressCloudUpload=false;cloudBaseline=JSON.stringify(cloudRemoteBaselineData);cloudReady=true;cloudConflict=false;const state=document.getElementById('save-state');if(state)state.textContent='Cloud copy synced';}
async function cloudDownloadShared(){try{const rows=await cloudRequest(`rest/v1/aethel_books?select=revision,data,updated_at&workspace_id=eq.${encodeURIComponent(cloudConfig.workspaceId)}&limit=1`),row=rows[0];if(!row)throw new Error('No shared books were found for this workspace.');if(!confirm(`Load the shared copy at revision ${row.revision} onto this device? Current local books will first be saved as a restore point.`))return;cloudAdoptData(row.data);cloudRevision=+row.revision;cloudRemoteRow=row;cloudMarkBaseline(cloudRemoteBaselineData||db);cloudRemoteBaselineData=null;const purged=cloudIsDirty();if(purged)scheduleCloudSave();cloudStatusMessage=purged?'Legacy sample drafts removed; cleaning the shared books.':`Synced with shared books · revision ${cloudRevision}.`;cloudStoreConfig();render(activePage());toast('Shared books loaded on this device')}catch(e){cloudStatusMessage=e.message;render('settings');toast(e.message)}}
function cloudIsDirty(){return !!cloudReady&&!!cloudBaseline&&JSON.stringify(db)!==cloudBaseline}
async function cloudPushLocal(showToast=true){if(!cloudReady||!cloudSession?.access_token||!cloudConfig.workspaceId)return;if(cloudConflict)throw new Error('A partner update is waiting. Load the latest shared copy before syncing this browser.');if(!cloudIsDirty()){cloudStatusMessage=`Already synced · revision ${cloudRevision}.`;if(showToast)toast('Books are already synced');return}const next=await cloudRequest('rest/v1/rpc/aethel_save_book',{method:'POST',body:JSON.stringify({p_workspace_id:cloudConfig.workspaceId,p_expected_revision:cloudRevision,p_data:db})});cloudRevision=Number(Array.isArray(next)?next[0]:next);cloudMarkBaseline();cloudStatusMessage=`Cloud sync complete · revision ${cloudRevision}.`;const state=document.getElementById('save-state');if(state)state.textContent='Cloud synced · '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});if(showToast)toast('Books synced with the shared workspace')}
function scheduleCloudSave(){if(!cloudReady||!cloudSession?.access_token||cloudConflict)return;clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(()=>cloudPushLocal(false).catch(e=>{if(/revision|concurrent|conflict/i.test(e.message)){cloudConflict=true;cloudStatusMessage='A partner saved newer books. Load the shared copy before continuing to avoid overwriting their work.'}else cloudStatusMessage=`Local save is safe; cloud sync needs attention: ${e.message}`;const state=document.getElementById('save-state');if(state)state.textContent=cloudConflict?'Cloud conflict · local copy retained':'Saved locally · cloud sync pending'}),1200)}
async function cloudSyncNow(){if(!cloudConfig.workspaceId||!cloudReady){return cloudDownloadShared()}try{await cloudPushLocal(true)}catch(e){cloudStatusMessage=e.message;if(/revision|concurrent|conflict/i.test(e.message))cloudConflict=true;render('settings');toast(e.message)}}
async function cloudPoll(){if(cloudPollBusy||!cloudReady||!cloudSession?.access_token||!cloudConfig.workspaceId)return;cloudPollBusy=true;try{const rows=await cloudRequest(`rest/v1/aethel_books?select=revision,data,updated_at&workspace_id=eq.${encodeURIComponent(cloudConfig.workspaceId)}&limit=1`),row=rows[0];if(row&&+row.revision>cloudRevision){if(cloudIsDirty()){cloudConflict=true;cloudStatusMessage='Another partner updated the books while this browser has unsynced edits. Your local copy is preserved; load the shared copy after reviewing/exporting these edits.'}else if(!document.querySelector('#modal-root .modal-bg')){cloudAdoptData(row.data);cloudRevision=+row.revision;cloudRemoteRow=row;cloudMarkBaseline(cloudRemoteBaselineData||db);cloudRemoteBaselineData=null;const purged=cloudIsDirty();cloudStatusMessage=purged?'Legacy sample drafts removed; cleaning the shared books.':`Partner update received · revision ${cloudRevision}.`;if(purged)scheduleCloudSave();render(activePage())}}}catch(e){cloudStatusMessage=`Cloud check paused: ${e.message}`}finally{cloudPollBusy=false}}
async function cloudSignOut(){try{if(cloudSession?.access_token)await cloudRequest('auth/v1/logout',{method:'POST'},cloudSession.access_token,false)}catch{}cloudSession=null;localStorage.removeItem('aethel-cloud-session');cloudMembers=[];cloudReady=false;cloudBaseline='';cloudConflict=false;cloudStatusMessage='Signed out. This device keeps its local books.';render('settings')}
async function cloudInvitePartner(){const email=document.getElementById('cloud-invite-email')?.value.trim().toLowerCase(),role='editor';if(!email||!email.includes('@'))return toast('Enter the partner email used for their Supabase account.');try{await cloudRequest('rest/v1/rpc/aethel_invite_member',{method:'POST',body:JSON.stringify({p_workspace_id:cloudConfig.workspaceId,p_email:email,p_role:role})});cloudStatusMessage=`${email} added as ${role}. They can sign in and load the shared books.`;await cloudLoadMemberships();render('settings');toast('Partner added to the workspace')}catch(e){cloudStatusMessage=e.message;render('settings');toast(e.message)}}
async function cloudSaveRestorePoint(){try{await cloudRequest('rest/v1/rpc/aethel_create_backup',{method:'POST',body:JSON.stringify({p_workspace_id:cloudConfig.workspaceId,p_reason:'Manual restore point'})});cloudStatusMessage='Cloud restore point saved.';await cloudLoadBackups();render('settings');toast('Shared restore point saved')}catch(e){toast(e.message)}}
async function cloudLoadBackups(){try{cloudBackups=await cloudRequest(`rest/v1/aethel_backups?select=id,revision,reason,created_at&workspace_id=eq.${encodeURIComponent(cloudConfig.workspaceId)}&order=created_at.desc&limit=20`);cloudStatusMessage=`${cloudBackups.length} cloud restore point${cloudBackups.length===1?'':'s'} available.`;render('settings')}catch(e){cloudStatusMessage=e.message;render('settings');toast(e.message)}}
async function cloudRestoreSelected(){const backupId=document.getElementById('cloud-backup-select')?.value;if(!backupId)return toast('Load the cloud restore points and select one first.');if(!confirm('Restore this shared backup for all partners? The current cloud books will be saved as a separate restore point first.'))return;try{await cloudRequest('rest/v1/rpc/aethel_restore_backup',{method:'POST',body:JSON.stringify({p_workspace_id:cloudConfig.workspaceId,p_backup_id:backupId,p_expected_revision:cloudRevision})});const rows=await cloudRequest(`rest/v1/aethel_books?select=revision,data,updated_at&workspace_id=eq.${encodeURIComponent(cloudConfig.workspaceId)}&limit=1`),row=rows[0];cloudAdoptData(row.data);cloudRevision=+row.revision;cloudMarkBaseline(cloudRemoteBaselineData||db);cloudRemoteBaselineData=null;const purged=cloudIsDirty();if(purged)scheduleCloudSave();cloudStatusMessage=purged?'Legacy sample drafts removed; cleaning the shared books.':`Shared restore completed · revision ${cloudRevision}.`;render(activePage());toast('Shared cloud backup restored')}catch(e){cloudConflict=true;cloudStatusMessage=e.message;render('settings');toast(e.message)}}
function cloudSettingsPanel(){
 const member=cloudCurrentMember();
 const workspaces=cloudMembers.map(m=>`<option value="${esc(m.workspace_id)}" ${m.workspace_id===cloudConfig.workspaceId?'selected':''}>${esc(m.workspace?.name||'AETHEL workspace')} · ${esc(m.role)}</option>`).join('');
 const connectionForm=`<div class="form-grid"><div class="field"><label>SUPABASE PROJECT URL</label><input id="cloud-project-url" type="url" value="${esc(cloudConfig.projectUrl)}" placeholder="https://your-project.supabase.co"></div><div class="field"><label>PUBLISHABLE KEY (OR LEGACY ANON KEY)</label><input id="cloud-publishable-key" type="password" autocomplete="off" value="${esc(cloudConfig.publishableKey)}" placeholder="sb_publishable_…"></div><div class="field full"><button class="btn" onclick="cloudSaveConfig()">Save cloud connection</button></div></div>`;
 let content='';
 if(!cloudSession?.access_token){
  content=`<div class="cloud-login"><div class="form-grid"><div class="field"><label>PARTNER EMAIL</label><input id="cloud-email" type="email" autocomplete="username"></div><div class="field"><label>PASSWORD</label><input id="cloud-password" type="password" autocomplete="current-password"></div></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="cloudSignIn(false)">Sign in & load membership</button><button class="btn" onclick="cloudSignIn(true)">Create partner account</button></div><p class="small muted">Sign in once per device. Each partner uses their own account; workspace permissions protect shared books. If email confirmation is enabled, wait for one confirmation email; repeated sign-up attempts can trigger Supabase’s email limit.</p><div class="small muted cloud-status">${esc(cloudStatusMessage)}</div></div>`;
 }else{
  const workspaceUi=cloudMembers.length?`<div class="field"><label>SHARED WORKSPACE</label><select id="cloud-workspace" onchange="cloudSelectWorkspace(this.value)">${workspaces}</select></div>`:`<div class="notice">No AETHEL workspace is linked to this account. The first partner can create it from this device’s current local books.</div><button class="btn primary" onclick="cloudCreateWorkspace()">Create shared AETHEL workspace from this device</button>`;
  let backupUi='';
  if(cloudBackups.length)backupUi=`<div class="form-grid cloud-backup-row"><div class="field"><label>RESTORE SHARED SNAPSHOT</label><select id="cloud-backup-select">${cloudBackups.map(b=>`<option value="${esc(b.id)}">${new Date(b.created_at).toLocaleString('en-IN')} · revision ${b.revision} · ${esc(b.reason)}</option>`).join('')}</select></div><div class="field" style="align-self:end"><button class="btn danger" onclick="cloudRestoreSelected()">Restore shared snapshot</button></div></div>`;
  let inviteUi='';
  if(member?.role==='owner')inviteUi=`<div class="cloud-invite"><h3>Invite a partner</h3><p class="small muted">Each partner first creates their own Supabase sign-in. Then add the same email here.</p><div class="form-grid"><div class="field"><label>PARTNER EMAIL</label><input id="cloud-invite-email" type="email" placeholder="partner@example.com"></div><div class="field"><label>PARTNER ACCESS</label><div class="notice">Editor · can post and edit the shared books</div></div></div><button class="btn" style="margin-top:9px" onclick="cloudInvitePartner()">Add partner</button></div>`;
  let memberUi='';
  if(member)memberUi=`<div class="breakdown"><span>Access</span><b>${esc(member.role)} · ${cloudReady?'automatic sync enabled':'load shared books to enable sync'}</b></div><div class="small muted cloud-status">${esc(cloudStatusMessage)}</div><div class="actions"><button class="btn" onclick="cloudDownloadShared()">Load shared books to this device</button><button class="btn primary" onclick="cloudSyncNow()">Sync local changes now</button><button class="btn" onclick="cloudSaveRestorePoint()">Save cloud restore point</button><button class="btn" onclick="cloudLoadBackups()">View cloud backups</button></div>${backupUi}${inviteUi}`;
  content=`<div class="cloud-connected"><div class="breakdown"><span>Signed in as</span><b>${esc(cloudSession.user?.email||'Partner')}</b></div>${workspaceUi}${memberUi}<button class="btn sm" style="margin-top:12px" onclick="cloudSignOut()">Sign out on this device</button></div>`;
 }
 const state=cloudSession?.access_token?cloudReady?(cloudConflict?'Needs conflict review':'Connected'):'Signed in · not synced':'Not connected';
 return `<section class="card section cloud-section"><div class="section-top"><div><div class="eyebrow">SHARED PARTNER BOOKS</div><h2>Supabase cloud sync</h2></div><span class="badge ${cloudSession?.access_token&&cloudReady&&!cloudConflict?'green':''}">${state}</span></div><p class="small muted">Use a Supabase publishable/anon key with the supplied row-level-security setup. Never put a service_role key in this app.</p>${connectionForm}${content}<div class="banner cloud-setup-steps"><b>Setup order:</b> Create a Supabase project · run the supplied <code>AETHEL-Supabase-Setup.sql</code> in SQL Editor · enter the project URL and publishable key · create/sign in to the first partner account · create the workspace · have the other partners sign up and invite their emails.</div></section>`;
}
setInterval(()=>cloudPoll(),30000);
Object.assign(window,{cloudSaveConfig,cloudSignIn,cloudCreateWorkspace,cloudSelectWorkspace,cloudDownloadShared,cloudSyncNow,cloudSignOut,cloudInvitePartner,cloudSaveRestorePoint,cloudLoadBackups,cloudRestoreSelected,scheduleCloudSave});
if(cloudSession?.access_token)cloudResumeSession();

})();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}))}</script></body></html>
