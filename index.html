<script>
(()=>{'use strict';
const PARTNERS=['Shuaib S','Joshvin Thomas','Rahul R'];
const defaults={version:1,company:'AETHEL COLLECTIVE',currency:'INR',gstEnabled:false,gstin:'',periodStart:'2026-10-01',periodEnd:'2027-03-31',entries:[],products:[],inventoryMethod:'weighted-average',bankStatementRows:[],recurringExpenses:[],accounts:[
{id:'cash',name:'Cash in hand',type:'Asset',sub:'Cash'}, {id:'bank',name:'Bank account',type:'Asset',sub:'Bank'}, {id:'ar',name:'Accounts receivable',type:'Asset',sub:'Receivable'}, {id:'inventory',name:'Inventory',type:'Asset',sub:'Inventory'}, {id:'prepaid',name:'Prepaid expenses',type:'Asset',sub:'Prepaid'}, {id:'equipment',name:'Equipment',type:'Asset',sub:'Fixed asset'}, {id:'ap',name:'Accounts payable',type:'Liability',sub:'Payable'}, {id:'customer-advance',name:'Customer advances',type:'Liability',sub:'Current liability'}, {id:'gst-out',name:'GST payable',type:'Liability',sub:'Tax'}, {id:'gst-in',name:'GST input credit',type:'Asset',sub:'Tax'},
{id:'cap-shuaib',name:'Shuaib S — Capital',type:'Equity',sub:'Partner capital'}, {id:'cap-joshvin',name:'Joshvin Thomas — Capital',type:'Equity',sub:'Partner capital'}, {id:'cap-rahul',name:'Rahul R — Capital',type:'Equity',sub:'Partner capital'}, {id:'cur-shuaib',name:'Shuaib S — Current',type:'Equity',sub:'Partner current'}, {id:'cur-joshvin',name:'Joshvin Thomas — Current',type:'Equity',sub:'Partner current'}, {id:'cur-rahul',name:'Rahul R — Current',type:'Equity',sub:'Partner current'},
{id:'sales-income',name:'Sales',type:'Income',sub:'Operating income'}, {id:'other-income',name:'Other income',type:'Income',sub:'Other income'}, {id:'purchases',name:'Purchases',type:'Expense',sub:'Cost of goods'}, {id:'freight-in',name:'Freight inward',type:'Expense',sub:'Direct expense'}, {id:'packaging',name:'Packaging expense',type:'Expense',sub:'Direct expense'}, {id:'advertising',name:'Advertising & marketing',type:'Expense',sub:'Operating expense'}, {id:'website',name:'Website & domain expense',type:'Expense',sub:'Operating expense'}, {id:'rent',name:'Rent',type:'Expense',sub:'Operating expense'}, {id:'utilities',name:'Utilities',type:'Expense',sub:'Operating expense'}, {id:'bank-fees',name:'Bank charges',type:'Expense',sub:'Operating expense'}, {id:'wages',name:'Wages & salaries',type:'Expense',sub:'Operating expense'}, {id:'misc-expense',name:'General expenses',type:'Expense',sub:'Operating expense'}]};
let db;try{db=JSON.parse(localStorage.getItem('aethel-books-v1'))||structuredClone(defaults)}catch{db=structuredClone(defaults)}
db={...structuredClone(defaults),...db};if(!db.accounts?.length)db.accounts=structuredClone(defaults.accounts);if(!Array.isArray(db.accountAudit))db.accountAudit=[];if(!Array.isArray(db.products))db.products=[];if(!Array.isArray(db.bankStatementRows))db.bankStatementRows=[];if(!Array.isArray(db.recurringExpenses))db.recurringExpenses=[];if(!['weighted-average','fifo'].includes(db.inventoryMethod))db.inventoryMethod='weighted-average';
const INR=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2});const money=n=>INR.format(Number(n)||0);const id=()=>crypto.randomUUID();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';const isoToday=()=>new Date().toISOString().slice(0,10);
function save(){const storageKey='aethel-books-v1',previous=localStorage.getItem(storageKey),today=isoToday();if(previous){let points=[];try{points=JSON.parse(localStorage.getItem('aethel-books-restore-points')||'[]')}catch{}if(!points.some(p=>p.day===today)){try{points.push({id:today,day:today,createdAt:new Date().toISOString(),reason:'Automatic daily restore point',data:JSON.parse(previous)});localStorage.setItem('aethel-books-restore-points',JSON.stringify(points.slice(-7)))}catch{}}}localStorage.setItem(storageKey,JSON.stringify(db));const state=document.getElementById('save-state');if(state)state.textContent='Saved locally · '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});if(!window.suppressCloudUpload)window.scheduleCloudSave?.()}
function ensureMTRAccounts(){const mapping=[['cash','Cash a/c'],['cap-shuaib','Shuaib Capital a/c'],['cap-joshvin','Joshvin Capital a/c'],['cap-rahul','Rahul Capital a/c'],['website','Website a/c'],['customer-advance','Rageesha-customer advance a/c'],['packaging','Packaging materials a/c'],['purchases','Purchase a/c'],['sales-income','Sales a/c'],['advertising','Advertisement expense a/c']];let changed=false;mapping.forEach(([id,name])=>{const a=acct(id);if(a&&a.name!==name){a.name=name;changed=true}});if(!acct('domain-prepaid')){db.accounts.push({id:'domain-prepaid',name:'Domain a/c',type:'Asset',sub:'Prepaid'});changed=true}if(!acct('sanju-debtor')){db.accounts.push({id:'sanju-debtor',name:'Sanju - debtor a/c',type:'Asset',sub:'Receivable'});changed=true}if(changed)localStorage.setItem('aethel-books-v1',JSON.stringify(db))}
function isLegacySampleDraft(e){return e?.status==='draft'&&(e.importedFrom==='BOOK OF ACCOUNTS.mtr'||e.seedGroup==='brief')}
function removeLegacySampleDrafts(){const before=db.entries.length;db.entries=db.entries.filter(e=>!isLegacySampleDraft(e));if(db.entries.length!==before)save()}
ensureMTRAccounts();
removeLegacySampleDrafts();
function toast(t){const r=document.getElementById('toast-root');r.innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>r.innerHTML='',2600)}
function acct(id){return db.accounts.find(a=>a.id===id)}function lines(entry){return entry.lines||[]}
function totals(e){return lines(e).reduce((o,l)=>{o.dr+=+l.debit||0;o.cr+=+l.credit||0;return o},{dr:0,cr:0})}
function allLines(){return db.entries.filter(e=>e.status==='posted').flatMap(e=>lines(e).map(l=>({...l,date:e.date,entryId:e.id,ref:e.ref,memo:e.memo,entryType:e.entryType||'Journal'})))}
function balances(asOf=null){const result={};db.accounts.forEach(a=>result[a.id]=0);allLines().filter(l=>!asOf||l.date<=asOf).forEach(l=>{const a=acct(l.accountId);if(!a)return;const natural=['Asset','Expense'].includes(a.type)?1:-1;result[l.accountId]+=(+l.debit- +l.credit)*natural});return result}
function rangeEntries(){return db.entries.filter(e=>e.status==='posted'&&!e.closing&&e.date>=db.periodStart&&e.date<=db.periodEnd)}function pnl(){const v={income:0,cost:0,expense:0};rangeEntries().forEach(e=>lines(e).forEach(l=>{const a=acct(l.accountId);if(!a)return;if(a.type==='Income')v.income+=+l.credit- +l.debit;if(a.type==='Expense'){if(['Cost of goods','Direct expense'].includes(a.sub))v.cost+=+l.debit- +l.credit;else v.expense+=+l.debit- +l.credit}}));v.gross=v.income-v.cost;v.net=v.gross-v.expense;return v}
function postedCount(){return db.entries.filter(e=>e.status==='posted').length}function activePage(){return document.querySelector('.nav button.active')?.dataset.page||'dashboard'}
function nav(page){document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const group=['journal','accounts','reports'].includes(page)?'Accounting':['sales','purchases','inventory','bank','recurring','partners','review'].includes(page)?'Operations':page==='dashboard'?'':'Administration',crumb=document.getElementById('crumb');crumb.innerHTML=group?`<img class="topbar-mark" src="AethelMonogram.png" alt="" aria-hidden="true"><button type="button" onclick="nav('dashboard')">Books</button><span aria-hidden="true"> / </span><span>${group}</span><span aria-hidden="true"> / </span><span class="current">${esc(pageNames[page]||page)}</span>`:`<img class="topbar-mark" src="AethelMonogram.png" alt="" aria-hidden="true"><button type="button" onclick="nav('dashboard')">Books</button><span aria-hidden="true"> / </span><span class="current">${esc(pageNames[page]||page)}</span>`;render(page);window.scrollTo(0,0)}const pageNames={dashboard:'Overview',journal:'Journal',accounts:'Accounts & ledgers',reports:'Financial reports',sales:'Sales & customers',purchases:'Purchases & suppliers',inventory:'Inventory',bank:'Bank reconciliation',recurring:'Recurring expenses',partners:'Partners',review:'Review drafts',chart:'Chart of Accounts',close:'Period close',settings:'Settings & backup'};
document.querySelectorAll('.nav button[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));document.getElementById('period-tag').textContent=`${day(db.periodStart)} — ${day(db.periodEnd)}`;
function render(page=activePage()){document.getElementById('view').innerHTML=({dashboard:dashboard,journal:journal,accounts:accountsPage,reports:reports,sales:()=>salesPage('Sales'),purchases:()=>salesPage('Purchase'),inventory:inventory,bank:bankReconciliation,recurring:recurringExpenses,partners:partners,review:review,close:closePage,settings:settings,chart:chartAccounts})[page]?.()||''}
const head=(title,sub,actions='')=>`<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;
function dashboard(){const b=balances(db.periodEnd),p=pnl(),cash=(b.cash||0)+(b.bank||0),asset=db.accounts.filter(a=>a.type==='Asset').reduce((s,a)=>s+(b[a.id]||0),0),draft=db.entries.filter(e=>e.status==='draft').length;let recent=[...db.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `${head(`Good ${new Date().getHours()<12?'morning':'day'}`,'A clear view of your books for the selected accounting period.',`<button class="btn" onclick="nav('reports')">View reports</button><button class="btn primary" onclick="openEntry()">＋ Record transaction</button>`)}${db.entries.length===0?'<div class="notice"><b>Books are ready.</b> No transactions have been posted. Opening partner capital balances from your brief are prepared as clearly labeled opening-balance drafts for review.</div>':''}<div class="stats"><div class="card stat"><div class="goldline"></div><label>Cash & bank</label><strong>${money(cash)}</strong><small>Closing balance at ${day(db.periodEnd)}</small></div><div class="card stat"><div class="goldline"></div><label>Sales this period</label><strong>${money(p.income)}</strong><small>${rangeEntries().length} posted transaction${rangeEntries().length===1?'':'s'} in period</small></div><div class="card stat"><div class="goldline"></div><label>Net profit / (loss)</label><strong style="color:${p.net<0?'var(--red)':'inherit'}">${money(p.net)}</strong><small>For selected accounting period</small></div><div class="card stat"><div class="goldline"></div><label>Total assets</label><strong>${money(asset)}</strong><small>At period end</small></div></div><div class="grid2"><section class="card section"><div class="section-top"><h2>Recent activity</h2><button class="btn sm" onclick="nav('journal')">Open journal</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>Date / reference</th><th>Description</th><th>Status</th><th class="num">Amount</th></tr></thead><tbody>${recent.map(e=>`<tr><td>${day(e.date)}<br><span class="muted">${esc(e.ref||'')}</span></td><td>${esc(e.memo||'—')}</td><td><span class="badge ${e.status==='posted'?'green':''}">${e.status==='posted'?'Posted':'Draft'}</span></td><td class="num">${money(totals(e).dr)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No activity yet. Start by reviewing your drafts or recording an opening balance.</div>'}</section><section class="card section"><div class="section-top"><h2>Needs your review</h2><button class="btn sm" onclick="nav('review')">Review drafts${draft?` (${draft})`:''}</button></div>${draft?`<p class="small muted"><span class="alert-dot"></span>${draft} draft item${draft===1?'':'s'} waiting for review. Drafts never affect your reports or balances.</p>`:'<p class="small muted">There are no drafts waiting for review.</p>'}<div class="breakdown"><span>Accounting period</span><b>${day(db.periodStart)} – ${day(db.periodEnd)}</b></div><div class="breakdown"><span>GST configuration</span><b>${db.gstEnabled?'Enabled':'Optional · not enabled'}</b></div><div class="breakdown"><span>Partners</span><b>3</b></div></section></div><div class="banner">Opening balances and transaction references supplied in the brief are labeled as user-provided or unposted examples. Review and confirm each draft before posting.</div>`}
function entryTable(es,editable=true){if(!es.length)return '<div class="empty">No entries to show.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Reference / entry ID</th><th>Description</th><th>Source</th><th>Status</th><th class="num">Debit</th><th>Actions</th></tr></thead><tbody>${es.map(e=>`<tr><td>${day(e.date)}</td><td><span>${esc(e.ref||'—')}</span><br><span class="muted small">${esc(e.id||'—')}</span></td><td>${esc(e.memo||'—')}</td><td>${esc(e.entryType||'Journal')}</td><td><span class="badge ${e.status==='posted'?'green':e.status==='void'?'red':''}">${esc(e.status==='posted'?'Posted':e.status==='void'?'Voided':'Draft')}</span></td><td class="num">${money(totals(e).dr)}</td><td><div class="actions">${e.closing||e.stockMovement?`<button class="btn sm" onclick="inspectEntry('${esc(e.id)}')">View</button><span class="badge">${e.closing?'Period close':'Stock movement'}</span>`:`${e.status==='draft'?`<button class="btn sm gold" onclick="editEntry('${esc(e.id)}')">Review</button>`:`<button class="btn sm" onclick="inspectEntry('${esc(e.id)}')">View</button>${e.status==='posted'?`<button class="btn sm" onclick="editEntry('${esc(e.id)}')">Edit</button>`:''}`}${e.status!=='void'?`<button class="btn sm danger" onclick="deleteEntry('${esc(e.id)}')">${e.status==='posted'?'Void':'×'}</button>`:''}`}</div></td></tr>`).join('')}</tbody></table></div>`}

function journal(){const sort=window.journalSort||'date-desc',sortLabel={"date-desc":"Date · newest first","date-asc":"Date · oldest first","reference-asc":"Reference ID · A–Z","reference-desc":"Reference ID · Z–A","entry-asc":"Entry ID · A–Z","entry-desc":"Entry ID · Z–A"},field=sort.startsWith('reference-')?'ref':sort.startsWith('entry-')?'id':'date',descending=sort.endsWith('-desc'),compare=(a,b)=>String(a||'').localeCompare(String(b||''),'en',{numeric:true,sensitivity:'base'}),entries=[...db.entries].sort((a,b)=>{const result=compare(a[field],b[field]);return (descending?-result:result)||compare(a.ref,b.ref)||compare(a.id,b.id)});return `${head('Journal','Every posted entry is balanced, dated and retained in the audit trail.',`<button class="btn" onclick="exportCSV()">Export journal CSV</button><button class="btn primary" onclick="openEntry()">＋ New entry</button>`)}<div class="card section"><div class="journal-tools"><div><h2>Transaction history</h2><span class="muted small">${db.entries.length} total · ${postedCount()} posted</span></div><label class="journal-sort-label">SORT BY<select class="journal-sort" aria-label="Sort journal entries" onchange="window.journalSort=this.value;render('journal')">${Object.entries(sortLabel).map(([value,label])=>`<option value="${value}" ${sort===value?'selected':''}>${label}</option>`).join('')}</select></label></div>${entryTable(entries)}</div>`}

function accountsPage(){let sel=window.selectedAccount||'all',asOf=window.ledgerAsOf||db.periodEnd;return `${head('Accounts & ledgers','Account balances and source transactions through '+day(asOf))}<div class="card section"><div class="form-grid" style="margin-bottom:17px"><div class="field"><label>ACCOUNT LEDGER</label><select onchange="window.selectedAccount=this.value;render('accounts')"><option value="all" ${sel==='all'?'selected':''}>All accounts · trial balance</option>${db.accounts.map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''}>${esc(a.name)} · ${esc(a.type)}${a.archived?' · archived':''}</option>`).join('')}</select></div><div class="field"><label>AS OF</label><input type="date" value="${asOf}" onchange="window.ledgerAsOf=this.value;render('accounts')"></div></div>${sel==='all'?`${trialBalance(asOf)}<p class="small muted">Each account is shown on its actual net debit or credit side. Only posted entries through the selected date are included.</p>`:ledger(sel,asOf)}</div>`}
function accountUsage(accountId){return db.entries.filter(e=>lines(e).some(l=>l.accountId===accountId)).length}
function recordAccountChange(action,account,before=null){if(!Array.isArray(db.accountAudit))db.accountAudit=[];if(!Array.isArray(db.products))db.products=[];if(!Array.isArray(db.bankStatementRows))db.bankStatementRows=[];if(!Array.isArray(db.recurringExpenses))db.recurringExpenses=[];if(!['weighted-average','fifo'].includes(db.inventoryMethod))db.inventoryMethod='weighted-average';const snap=x=>x?{id:x.id,name:x.name,type:x.type,sub:x.sub,archived:!!x.archived}:null,ref=account||before;let summary=action==='Edited'?(before?.name!==account?.name?`${before?.name||'Account'} renamed to ${account?.name||'Account'}`:`${account?.name||'Account'} details updated`):action==='Created'?`${account?.name||'Account'} created`:`${ref?.name||'Account'} ${action.toLowerCase()}`;if(action==='Edited'&&before?.type!==account?.type)summary+=` · ${before.type} → ${account.type}`;db.accountAudit.unshift({at:new Date().toISOString(),action,accountId:ref?.id||'',accountName:ref?.name||'Account',summary,before:snap(before),after:snap(account)});db.accountAudit=db.accountAudit.slice(0,100)}
function openAccountLedger(accountId){if(!acct(accountId))return;window.selectedAccount=accountId;window.ledgerAsOf=db.periodEnd;nav('accounts')}
function chartAccounts(){const rows=db.accounts.map(a=>{const used=accountUsage(a.id),archived=!!a.archived,search=(a.name+' '+a.type+' '+(a.sub||'')).toLowerCase();return `<div class="chart-row${archived?' is-archived':''}" data-search="${esc(search)}" data-archived="${archived}"><div class="chart-account"><strong>${esc(a.name)}</strong><small>${archived?'<span class="badge red">Archived</span> ':''}${esc(a.id)}</small></div><div class="chart-meta-grid"><div class="chart-meta"><label>Type</label><span class="badge ${a.type==='Income'?'green':''}">${esc(a.type)}</span></div><div class="chart-meta"><label>Group</label><span>${esc(a.sub||'—')}</span></div><div class="chart-meta"><label>Journal use</label><span>${used} ${used===1?'entry':'entries'}</span></div></div><div class="chart-actions">${archived?`<button class="btn sm gold" onclick="restoreAccount('${esc(a.id)}')">Restore</button>`:`<button class="btn sm" onclick="openAccountLedger('${esc(a.id)}')">Ledger</button><button class="btn sm" onclick="editAccount('${esc(a.id)}')">Edit</button><button class="btn sm danger" onclick="deleteAccount('${esc(a.id)}')">Delete</button>`}</div></div>`}).join('');const events=(db.accountAudit||[]).slice(0,8);return `${head('Chart of Accounts','Manage the accounts available in journal entries and follow account changes.',`<button class="btn primary" onclick="openAccountCreator()">＋ New account</button>`)}<div class="notice">Account names and groups update everywhere by account ID. Accounts with journal history are archived when removed from new entries so posted books and drafts stay intact. Only unused custom accounts can be permanently deleted.</div><section class="card section chart-section"><div class="section-top chart-tools"><div><h2>Accounts</h2><span class="muted small">${db.accounts.filter(a=>!a.archived).length} active · ${db.accounts.filter(a=>a.archived).length} archived</span></div><div class="chart-filters"><input class="chart-search" type="search" placeholder="Search accounts" aria-label="Search accounts" oninput="filterChartAccounts(this.value)"><select aria-label="Account status" id="chart-status-filter" onchange="filterChartAccounts()"><option value="active">Active accounts</option><option value="all">All accounts</option><option value="archived">Archived accounts</option></select></div></div><div class="chart-table-head"><span>Account</span><span>Classification & journal use</span><span>Actions</span></div><div class="chart-list">${rows||'<div class="empty">No accounts configured.</div>'}<div class="empty chart-no-results" id="chart-no-results" hidden>No accounts match this search.</div></div></section><details class="card section account-audit"><summary>Recent account changes · ${events.length}</summary>${events.length?`<div class="audit-list">${events.map(e=>`<div class="audit-item"><span><b>${esc(e.action)}</b> · ${esc(e.summary||e.accountName||'Account changed')}</span><time>${esc(e.at?new Date(e.at).toLocaleString('en-IN'):'—')}</time></div>`).join('')}</div>`:'<p class="small muted">Account edits, archives and deletions will appear here.</p>'}</details>`}
function filterChartAccounts(query){const search=typeof query==='string'?query.toLowerCase().trim():(document.querySelector('.chart-search')?.value||'').toLowerCase().trim(),status=document.getElementById('chart-status-filter')?.value||'active';let shown=0;document.querySelectorAll('.chart-row[data-search]').forEach(row=>{const isArchived=row.dataset.archived==='true',matchesSearch=row.dataset.search.includes(search),matchesStatus=status==='all'||(status==='archived'?isArchived:!isArchived);row.hidden=!(matchesSearch&&matchesStatus);if(!row.hidden)shown++});const empty=document.getElementById('chart-no-results');if(empty)empty.hidden=shown>0}
function editAccount(accountId){const a=acct(accountId);if(!a)return;const refs=accountUsage(a.id);document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal narrow"><div class="modal-head"><div><div class="eyebrow">CHART OF ACCOUNTS</div><h2>Edit account</h2></div><button class="x" onclick="closeModal()" aria-label="Close">×</button></div><div class="form-grid"><div class="field full"><label>ACCOUNT NAME</label><input id="edit-account-name" maxlength="100" value="${esc(a.name)}"></div><div class="field"><label>ACCOUNT TYPE</label><select id="edit-account-type">${['Asset','Liability','Equity','Income','Expense'].map(t=>`<option ${a.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>GROUP / SUBTYPE</label><input id="edit-account-sub" maxlength="80" value="${esc(a.sub||'')}"></div></div>${refs?`<div class="notice account-reclass-note"><b>${refs} journal ${refs===1?'entry':'entries'} use this account.</b> Changing its type changes where the complete history appears in financial reports.<label class="switch"><input id="account-reclass-confirm" type="checkbox"> I understand the report classification will change.</label></div>`:''}${a.archived?'<div class="banner">This account is archived and unavailable for new journal lines. Restoring it is available from the Chart of Accounts.</div>':''}<div class="actions" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAccount('${esc(a.id)}')">Save changes</button></div></div></div>`}
function saveAccount(accountId){const a=acct(accountId);if(!a)return;const name=document.getElementById('edit-account-name').value.trim(),type=document.getElementById('edit-account-type').value,sub=document.getElementById('edit-account-sub').value.trim()||type;if(!name)return toast('Enter an account name.');if(db.accounts.some(x=>x.id!==accountId&&x.name.toLowerCase()===name.toLowerCase()))return toast('An account with that name already exists.');const refs=accountUsage(accountId);if(refs&&type!==a.type&&!document.getElementById('account-reclass-confirm')?.checked)return toast('Confirm the report reclassification before changing account type.');const before={...a};a.name=name;a.type=type;a.sub=sub;recordAccountChange('Edited',a,before);save();closeModal();toast('Account updated across the books');render(activePage())}
function deleteAccount(accountId){const a=acct(accountId);if(!a)return;const refs=accountUsage(accountId),system=defaults.accounts.some(x=>x.id===accountId);if(refs||system){if(a.archived)return toast('This account is already archived.');const why=refs?`${refs} journal ${refs===1?'entry uses':'entries use'} this account`:'This is a standard account used by AETHEL accounting workflows';if(!confirm(`${why}. Archive “${a.name}” instead? It will no longer be available for new journal lines, but its history and reports will be preserved.`))return;const before={...a};a.archived=true;recordAccountChange('Archived',a,before);save();render('chart');return toast('Account archived; journal history preserved')}if(!confirm(`Permanently delete unused account “${a.name}”?`))return;const before={...a};recordAccountChange('Deleted',null,before);db.accounts=db.accounts.filter(x=>x.id!==accountId);save();render('chart');toast('Unused account deleted')}
function restoreAccount(accountId){const a=acct(accountId);if(!a?.archived)return;const before={...a};a.archived=false;recordAccountChange('Restored',a,before);save();render('chart');toast('Account restored to journal choices')}
function ledger(accountId,end){const a=acct(accountId),ls=allLines().filter(l=>l.accountId===accountId&&l.date<=end).sort((x,y)=>x.date.localeCompare(y.date));let run=0;return `<h2>${esc(a?.name||'Account')} <span class="muted small">· ${esc(a?.type||'')}</span></h2><p class="muted small">Transactions through ${day(end)} · ${ls.length} journal line${ls.length===1?'':'s'}</p><div class="table-wrap"><table><thead><tr><th>Date</th><th>Reference / memo</th><th>Debit</th><th>Credit</th><th>Balance</th><th>Actions</th></tr></thead><tbody>${ls.length?ls.map(l=>{let s=['Asset','Expense'].includes(a.type)?1:-1;run+=(+l.debit- +l.credit)*s;const source=db.entries.find(e=>e.id===l.entryId),locked=!!(source?.closing||source?.stockMovement);return `<tr><td>${day(l.date)}</td><td>${esc(l.ref)} · ${esc(l.memo)}</td><td>${l.debit?money(l.debit):'—'}</td><td>${l.credit?money(l.credit):'—'}</td><td>${money(run)} ${s===1?'Dr':'Cr'}</td><td><div class="actions ledger-actions"><button class="btn sm" onclick="inspectEntry('${esc(l.entryId)}')">View</button>${locked?`<span class="badge">${source?.closing?'Period close':'Stock movement'}</span>`:`<button class="btn sm" onclick="editEntry('${esc(l.entryId)}')">Edit</button><button class="btn sm danger" onclick="deleteEntry('${esc(l.entryId)}')">Void</button>`}</div></td></tr>`}).join(''):'<tr><td colspan="6" class="muted">No posted transactions in this account.</td></tr>'}</tbody></table></div><p class="small muted">Opening balance: ${money(run)} ${['Asset','Expense'].includes(a.type)?'Dr':'Cr'}. Editing opens the full journal entry; voiding removes it from balances and reports while retaining it in the audit trail.</p>`}
function reports(){const p=pnl(),b=balances(db.periodEnd);let assets=db.accounts.filter(a=>a.type==='Asset').map(a=>[a.name,b[a.id]||0]).filter(x=>x[1]);let liabs=db.accounts.filter(a=>a.type==='Liability').map(a=>[a.name,b[a.id]||0]).filter(x=>x[1]);let eq=db.accounts.filter(a=>a.type==='Equity').map(a=>[a.name,b[a.id]||0]).filter(x=>x[1]);let grossrows=db.accounts.filter(a=>a.type==='Income'||a.sub==='Cost of goods'||a.sub==='Direct expense').map(a=>[a.name,b[a.id]||0]).filter(x=>x[1]);const periodClosed=db.entries.some(e=>e.closing&&e.date===db.periodEnd),unclosedPeriodResult=periodClosed?0:p.net,totalAssets=assets.reduce((s,x)=>s+x[1],0),totalLiabilitiesEquity=liabs.reduce((s,x)=>s+x[1],0)+eq.reduce((s,x)=>s+x[1],0)+unclosedPeriodResult,balanceDifference=totalAssets-totalLiabilitiesEquity;return `${head('Financial reports','Accrual-basis reports for '+day(db.periodStart)+' to '+day(db.periodEnd),`<button class="btn" onclick="window.print()">Print reports</button><button class="btn" onclick="exportCSV()">Export CSV</button>`)}<div class="tabs"><button class="active">Trading & P&amp;L</button><button onclick="document.getElementById('bs').scrollIntoView({behavior:'smooth'})">Balance sheet</button><button onclick="document.getElementById('tb').scrollIntoView({behavior:'smooth'})">Trial balance</button><button onclick="document.getElementById('cb').scrollIntoView({behavior:'smooth'})">Cash book</button></div><div class="report-grid"><section class="card section"><div class="section-top"><h2>Trading account</h2><span class="muted small">${day(db.periodStart)} – ${day(db.periodEnd)}</span></div>${breakRows(grossrows,p.gross,'Gross profit')}</section><section class="card section"><div class="section-top"><h2>Profit & loss account</h2><span class="muted small">${day(db.periodStart)} – ${day(db.periodEnd)}</span></div><div class="breakdown"><span>Gross profit / (loss)</span><b>${money(p.gross)}</b></div>${db.accounts.filter(a=>a.type==='Expense'&&!['Cost of goods','Direct expense'].includes(a.sub)).map(a=>{let n=(b[a.id]||0);return n?`<div class="breakdown"><span>${esc(a.name)}</span><span>${money(n)}</span></div>`:''}).join('')}<div class="breakdown total"><span>Net profit / (loss)</span><b>${money(p.net)}</b></div></section><section class="card section" id="bs"><div class="section-top"><h2>Balance sheet</h2><span class="muted small">As at ${day(db.periodEnd)}</span></div><b class="small">Assets</b>${rows(assets)}<div class="breakdown total"><span>Total assets</span><b>${money(totalAssets)}</b></div><br><b class="small">Liabilities</b>${rows(liabs)}<b class="small">Partners' equity</b>${rows(eq)}<div class="breakdown"><span>${periodClosed?'Current period result (transferred to equity)':'Current period profit / (loss)'}</span><b>${money(unclosedPeriodResult)}</b></div><div class="breakdown total"><span>Liabilities & equity</span><b>${money(totalLiabilitiesEquity)}</b></div><div class="breakdown"><span>Balance check</span><b class="badge ${Math.abs(balanceDifference)<.005?'green':'red'}">${Math.abs(balanceDifference)<.005?'Balanced':'Difference '+money(balanceDifference)}</b></div><p class="small muted">Balance-sheet inventory uses posted asset balances. Cost of goods sold is reflected in current-period profit.</p></section><section class="card section" id="tb"><div class="section-top"><h2>Trial balance</h2><span class="muted small">As at ${day(db.periodEnd)}</span></div>${trialBalance(db.periodEnd)}</section><section class="card section" id="cb"><div class="section-top"><h2>Cash book</h2><span class="muted small">Posted cash and bank movements</span></div>${cashBook()}</section></div>`}
function rows(arr){return arr.length?arr.map(x=>`<div class="breakdown"><span>${esc(x[0])}</span><span>${money(x[1])}</span></div>`).join(''):'<div class="breakdown muted"><span>No posted balances</span><span>—</span></div>'}function breakRows(arr,total,label){return `${arr.map(x=>`<div class="breakdown"><span>${esc(x[0])}</span><span>${money(x[1])}</span></div>`).join('')}<div class="breakdown total"><span>${label}</span><b>${money(total)}</b></div>`}
function trialBalanceRows(asOf=null){const net={};allLines().filter(l=>!asOf||l.date<=asOf).forEach(l=>{net[l.accountId]=(net[l.accountId]||0)+(+l.debit||0)-(+l.credit||0)});const rows=db.accounts.map(a=>{const value=net[a.id]||0;return {name:a.name,type:a.type,debit:Math.max(value,0),credit:Math.max(-value,0)}});const known=new Set(db.accounts.map(a=>a.id));Object.entries(net).filter(([accountId])=>!known.has(accountId)).forEach(([accountId,value])=>rows.push({name:`Unmapped account · ${accountId}`,type:'Unmapped',debit:Math.max(value,0),credit:Math.max(-value,0)}));return rows.filter(r=>r.debit>.005||r.credit>.005)}
function trialBalance(asOf=db.periodEnd){const rows=trialBalanceRows(asOf),debit=rows.reduce((s,r)=>s+r.debit,0),credit=rows.reduce((s,r)=>s+r.credit,0),diff=debit-credit,balanced=Math.abs(diff)<.005;return `<div class="section-top"><span class="small muted">Posted balances by actual net debit or credit side</span><span class="badge ${balanced?'green':'red'}">${balanced?'Balanced':'Difference '+money(diff)}</span></div><div class="table-wrap"><table><thead><tr><th>Account</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}${r.type==='Unmapped'?' <span class="badge red">Review account</span>':''}</td><td class="num">${r.debit>.005?money(r.debit):'—'}</td><td class="num">${r.credit>.005?money(r.credit):'—'}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">No balances posted.</td></tr>'}</tbody><tfoot><tr><th>Total</th><th class="num">${money(debit)}</th><th class="num">${money(credit)}</th></tr></tfoot></table></div>`}
function cashBook(){const lines=allLines().filter(l=>['cash','bank'].includes(l.accountId)&&l.date>=db.periodStart&&l.date<=db.periodEnd).sort((a,b)=>a.date.localeCompare(b.date));return lines.length?`<table><thead><tr><th>Date</th><th>Account / narration</th><th>Inflow</th><th>Outflow</th></tr></thead><tbody>${lines.map(l=>`<tr><td>${day(l.date)}</td><td>${esc(acct(l.accountId)?.name)} · ${esc(l.memo)}</td><td>${l.debit?money(l.debit):'—'}</td><td>${l.credit?money(l.credit):'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No posted cash or bank activity in this period.</div>'}
function salesPage(kind){const isSales=kind==='Sales',type=isSales?'sale':'purchase',list=db.entries.filter(e=>e.entryType===kind.toLowerCase()&&e.status==='posted');return `${head(kind,isSales?'Record invoices, receipts and customer balances.':'Record supplier bills, payments and supplier balances.',`<button class="btn primary" onclick="openEntry('${type}')">＋ Record ${isSales?'sale':'purchase'}</button>`)}<div class="card section"><div class="section-top"><h2>${kind} transactions</h2><span class="muted small">${list.length} posted</span></div>${entryTable(list)}</div><div class="grid2" style="margin-top:16px"><section class="card section"><h2>${isSales?'Customer':'Supplier'} balances</h2>${partyBalances(isSales?'ar':'ap')}</section><section class="card section"><h2>Posting guide</h2><p class="small muted">${isSales?'Sales on credit debit receivables and credit sales. Record a separate receipt against receivables when the customer pays.':'Purchases on credit debit purchases and credit payables. Record payment separately against payables when paid.'} Enter GST lines only when registered and supported by a valid tax invoice.</p></section></div>`}
function partyBalances(id){const a=acct(id),ls=allLines().filter(l=>l.accountId===id);let balance=ls.reduce((s,l)=>s+(+l.debit- +l.credit),0);return `<div class="breakdown"><span>${esc(a.name)} · total</span><b>${money(balance)}</b></div><p class="small muted">For party-level balances, include the customer or supplier name in the transaction memo; individual sub-ledgers are shown in the ledger.</p>`}
function inventoryState(product,method=db.inventoryMethod){let qty=+product.qty||0,value=qty*(+product.cost||0),layers=qty>0?[{qty,cost:+product.cost||0}]:[],events=db.entries.filter(e=>e.status==='posted'&&e.stockMovement?.productId===product.id).sort((a,b)=>a.date.localeCompare(b.date)||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));for(const e of events){const m=e.stockMovement,q=+m.quantity||0;if(m.action==='receipt'){qty+=q;value+=+m.totalCost||q*(+m.unitCost||0);if(method==='fifo')layers.push({qty:q,cost:+m.unitCost||0})}else if(m.action==='issue'){if(method==='fifo'){let left=q;while(left>.000001&&layers.length){const layer=layers[0],take=Math.min(left,layer.qty);value-=take*layer.cost;layer.qty-=take;left-=take;if(layer.qty<.000001)layers.shift()}qty-=q}else{qty-=q;value-=+m.totalCost||0}}}return {qty:Math.max(0,qty),value:Math.max(0,value),unitCost:qty>.000001?Math.max(0,value)/qty:0,layers}}
function inventoryIssueCost(product,quantity){const state=inventoryState(product),qty=+quantity;if(qty>state.qty+.000001)return null;if(db.inventoryMethod==='fifo'){let left=qty,cost=0;for(const layer of state.layers){const take=Math.min(left,layer.qty);cost+=take*layer.cost;left-=take;if(left<.000001)break}return left<.000001?cost:null}return qty*state.unitCost}
function inventory(){const b=balances(),products=db.products||[],states=products.map(p=>({product:p,state:inventoryState(p)})),stockValue=states.reduce((s,x)=>s+x.state.value,0),glValue=b.inventory||0,methodLocked=db.entries.some(e=>e.status==='posted'&&e.stockMovement);return `${head('Inventory','Value stock by weighted average or FIFO, with every movement linked to a journal entry.',`<button class="btn" onclick="addProduct()">＋ Add item</button><button class="btn primary" onclick="openStockMovement()" ${products.length?'':'disabled'}>＋ Record stock movement</button>`)}<div class="stats"><div class="card stat"><div class="goldline"></div><label>Tracked stock value</label><strong>${money(stockValue)}</strong><small>Calculated from opening items and posted movements</small></div><div class="card stat"><div class="goldline"></div><label>Inventory account</label><strong>${money(glValue)}</strong><small>Posted general-ledger balance</small></div><div class="card stat"><div class="goldline"></div><label>Items tracked</label><strong>${products.length}</strong><small>${money(states.reduce((s,x)=>s+x.state.qty,0))} total units</small></div><div class="card stat"><div class="goldline"></div><label>Valuation method</label><strong style="font-size:16px">${db.inventoryMethod==='fifo'?'FIFO':'Weighted average'}</strong><small>${methodLocked?'Locked after posted stock movements':'Changeable until first movement'}</small></div></div><div class="notice"><b>Inventory subledger check:</b> tracked stock ${money(stockValue)} · posted Inventory account ${money(glValue)} · difference ${money(stockValue-glValue)}. Opening quantities are item-register values only until supported and posted. Stock movements post a journal entry; do not also book the same receipt as a separate inventory purchase.</div><div class="card section"><div class="section-top"><h2>Item valuation</h2><label class="journal-sort-label">COSTING METHOD<select class="journal-sort" onchange="setInventoryMethod(this.value)" ${methodLocked?'disabled':''}><option value="weighted-average" ${db.inventoryMethod==='weighted-average'?'selected':''}>Weighted average</option><option value="fifo" ${db.inventoryMethod==='fifo'?'selected':''}>FIFO · first in, first out</option></select></label></div>${products.length?`<div class="table-wrap"><table><thead><tr><th>Item / SKU</th><th class="num">On hand</th><th>Unit</th><th class="num">Avg / FIFO unit cost</th><th class="num">Valuation</th></tr></thead><tbody>${states.map(({product:p,state:s})=>`<tr><td><b>${esc(p.name)}</b><br><span class="muted small">${esc(p.sku||'No SKU')}</span></td><td class="num">${s.qty.toLocaleString('en-IN',{maximumFractionDigits:3})}</td><td>${esc(p.unit||'unit')}</td><td class="num">${money(s.unitCost)}</td><td class="num">${money(s.value)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No items yet. Add products, then record reviewed stock receipts and issues.</div>'}</div><div class="card section" style="margin-top:15px"><div class="section-top"><h2>Recent stock movements</h2><span class="muted small">Posted movements are also in the journal</span></div>${inventoryMovementTable()}</div>`}
function inventoryMovementTable(){const rows=db.entries.filter(e=>e.status==='posted'&&e.stockMovement).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);return rows.length?`<div class="table-wrap"><table><thead><tr><th>Date / reference</th><th>Item</th><th>Movement</th><th class="num">Quantity</th><th class="num">Cost</th></tr></thead><tbody>${rows.map(e=>{const m=e.stockMovement,p=(db.products||[]).find(x=>x.id===m.productId);return `<tr><td>${day(e.date)}<br><span class="muted small">${esc(e.ref)}</span></td><td>${esc(p?.name||'Archived item')}</td><td>${m.action==='receipt'?'Receipt':'Issue'}</td><td class="num">${(+m.quantity||0).toLocaleString('en-IN')}</td><td class="num">${money(m.totalCost)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No stock movements posted yet.</div>'}

async function cloudPushLocal(showToast=true){if(!cloudReady||!cloudSession?.access_token||!cloudConfig.workspaceId)return;if(cloudConflict)throw new Error('A partner update is waiting. Load the latest shared copy before syncing this browser.');if(!cloudIsDirty()){cloudStatusMessage=`Already synced · revision ${cloudRevision}.`;if(showToast)toast('Books are already synced');return}const next=await cloudRequest('rest/v1/rpc/aethel_save_book',{method:'POST',body:JSON.stringify({p_workspace_id:cloudConfig.workspaceId,p_expected_revision:cloudRevision,p_data:db})});cloudRevision=Number(Array.isArray(next)?next[0]:next);cloudMarkBaseline();cloudStatusMessage=`Cloud sync complete · revision ${cloudRevision}.`;const state=document.getElementById('save-state');if(state)state.textContent='Cloud synced · '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});if(showToast)toast('Books synced with the shared workspace')}
function scheduleCloudSave(){if(!cloudReady||!cloudSession?.access_token||cloudConflict)return;clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(()=>cloudPushLocal(false).catch(e=>{if(/revision|concurrent|conflict/i.test(e.message)){cloudConflict=true;cloudStatusMessage='A partner saved newer books. Load the shared copy before continuing to avoid overwriting their work.'}else cloudStatusMessage=`Local save is safe; cloud sync needs attention: ${e.message}`;const state=document.getElementById('save-state');if(state)state.textContent=cloudConflict?'Cloud conflict · local copy retained':'Saved locally · cloud sync pending'}),1200)}
async function cloudSyncNow(){if(!cloudConfig.workspaceId||!cloudReady){return cloudDownloadShared()}try{await cloudPushLocal(true)}catch(e){cloudStatusMessage=e.message;if(/revision|concurrent|conflict/i.test(e.message))cloudConflict=true;render('settings');toast(e.message)}}
async function cloudPoll(){if(cloudPollBusy||!cloudReady||!cloudSession?.access_token||!cloudConfig.workspaceId)return;cloudPollBusy=true;try{const rows=await cloudRequest(`rest/v1/aethel_books?select=revision,data,updated_at&workspace_id=eq.${encodeURIComponent(cloudConfig.workspaceId)}&limit=1`),row=rows[0];if(row&&+row.revision>cloudRevision){if(cloudIsDirty()){cloudConflict=true;cloudStatusMessage='Another partner updated the books while this browser has unsynced edits. Your local copy is preserved; load the shared copy after reviewing/exporting these edits.'}else if(!document.querySelector('#modal-root .modal-bg')){cloudAdoptData(row.data);cloudRevision=+row.revision;cloudRemoteRow=row;cloudMarkBaseline(cloudRemoteBaselineData||db);cloudRemoteBaselineData=null;const purged=cloudIsDirty();cloudStatusMessage=purged?'Legacy sample drafts removed; cleaning the shared books.':`Partner update received · revision ${cloudRevision}.`;if(purged)scheduleCloudSave();render(activePage())}}}catch(e){cloudStatusMessage=`Cloud check paused: ${e.message}`}finally{cloudPollBusy=false}}
async function cloudSignOut(){try{if(cloudSession?.access_token)await cloudRequest('auth/v1/logout',{method:'POST'},cloudSession.access_token,false)}catch{}cloudSession=null;localStorage.removeItem('aethel-cloud-session');cloudMembers=[];cloudReady=false;cloudBaseline='';cloudConflict=false;cloudStatusMessage='Signed out. This device keeps its local books.';render('settings')}
async function cloudInvitePartner(){const email=document.getElementById('cloud-invite-email')?.value.trim().toLowerCase(),role='editor';if(!email||!email.includes('@'))return toast('Enter the partner email used for their Supabase account.');try{await cloudRequest('rest/v1/rpc/aethel_invite_member',{method:'POST',body:JSON.stringify({p_workspace_id:cloudConfig.workspaceId,p_email:email,p_role:role})});cloudStatusMessage=`${email} added as ${role}. They can sign in and load the shared books.`;await cloudLoadMemberships();render('settings');toast('Partner added to the workspace')}catch(e){cloudStatusMessage=e.message;render('settings');toast(e.message)}}
async function cloudSaveRestorePoint(){try{await cloudRequest('rest/v1/rpc/aethel_create_backup',{method:'POST',body:JSON.stringify({p_workspace_id:cloudConfig.workspaceId,p_reason:'Manual restore point'})});cloudStatusMessage='Cloud restore point saved.';await cloudLoadBackups();render('settings');toast('Shared restore point saved')}catch(e){toast(e.message)}}
async function cloudLoadBackups(){try{cloudBackups=await cloudRequest(`rest/v1/aethel_backups?select=id,revision,reason,created_at&workspace_id=eq.${encodeURIComponent(cloudConfig.workspaceId)}&order=created_at.desc&limit=20`);cloudStatusMessage=`${cloudBackups.length} cloud restore point${cloudBackups.length===1?'':'s'} available.`;render('settings')}catch(e){cloudStatusMessage=e.message;render('settings');toast(e.message)}}
async function cloudRestoreSelected(){const backupId=document.getElementById('cloud-backup-select')?.value;if(!backupId)return toast('Load the cloud restore points and select one first.');if(!confirm('Restore this shared backup for all partners? The current cloud books will be saved as a separate restore point first.'))return;try{await cloudRequest('rest/v1/rpc/aethel_restore_backup',{method:'POST',body:JSON.stringify({p_workspace_id:cloudConfig.workspaceId,p_backup_id:backupId,p_expected_revision:cloudRevision})});const rows=await cloudRequest(`rest/v1/aethel_books?select=revision,data,updated_at&workspace_id=eq.${encodeURIComponent(cloudConfig.workspaceId)}&limit=1`),row=rows[0];cloudAdoptData(row.data);cloudRevision=+row.revision;cloudMarkBaseline(cloudRemoteBaselineData||db);cloudRemoteBaselineData=null;const purged=cloudIsDirty();if(purged)scheduleCloudSave();cloudStatusMessage=purged?'Legacy sample drafts removed; cleaning the shared books.':`Shared restore completed · revision ${cloudRevision}.`;render(activePage());toast('Shared cloud backup restored')}catch(e){cloudConflict=true;cloudStatusMessage=e.message;render('settings');toast(e.message)}}
function cloudSettingsPanel(){
 const member=cloudCurrentMember();
 const workspaces=cloudMembers.map(m=>`<option value="${esc(m.workspace_id)}" ${m.workspace_id===cloudConfig.workspaceId?'selected':''}>${esc(m.workspace?.name||'AETHEL workspace')} · ${esc(m.role)}</option>`).join('');
 const connectionForm=`<div class="form-grid"><div class="field"><label>SUPABASE PROJECT URL</label><input id="cloud-project-url" type="url" value="${esc(cloudConfig.projectUrl)}" placeholder="https://your-project.supabase.co"></div><div class="field"><label>PUBLISHABLE KEY (OR LEGACY ANON KEY)</label><input id="cloud-publishable-key" type="password" autocomplete="off" value="${esc(cloudConfig.publishableKey)}" placeholder="sb_publishable_…"></div><div class="field full"><button class="btn" onclick="cloudSaveConfig()">Save cloud connection</button></div></div>`;
 let content='';
 if(!cloudSession?.access_token){
  content=`<div class="cloud-login"><div class="form-grid"><div class="field"><label>PARTNER EMAIL</label><input id="cloud-email" type="email" autocomplete="username"></div><div class="field"><label>PASSWORD</label><input id="cloud-password" type="password" autocomplete="current-password"></div></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="cloudSignIn(false)">Sign in & load membership</button><button class="btn" onclick="cloudSignIn(true)">Create partner account</button></div><p class="small muted">Sign in once per device. Each partner uses their own account; workspace permissions protect shared books. If email confirmation is enabled, wait for one confirmation email; repeated sign-up attempts can trigger Supabase’s email limit.</p><div class="small muted cloud-status">${esc(cloudStatusMessage)}</div></div>`;
 }else{
  const workspaceUi=cloudMembers.length?`<div class="field"><label>SHARED WORKSPACE</label><select id="cloud-workspace" onchange="cloudSelectWorkspace(this.value)">${workspaces}</select></div>`:`<div class="notice">No AETHEL workspace is linked to this account. The first partner can create it from this device’s current local books.</div><button class="btn primary" onclick="cloudCreateWorkspace()">Create shared AETHEL workspace from this device</button>`;
  let backupUi='';
  if(cloudBackups.length)backupUi=`<div class="form-grid cloud-backup-row"><div class="field"><label>RESTORE SHARED SNAPSHOT</label><select id="cloud-backup-select">${cloudBackups.map(b=>`<option value="${esc(b.id)}">${new Date(b.created_at).toLocaleString('en-IN')} · revision ${b.revision} · ${esc(b.reason)}</option>`).join('')}</select></div><div class="field" style="align-self:end"><button class="btn danger" onclick="cloudRestoreSelected()">Restore shared snapshot</button></div></div>`;
  let inviteUi='';
  if(member?.role==='owner')inviteUi=`<div class="cloud-invite"><h3>Invite a partner</h3><p class="small muted">Each partner first creates their own Supabase sign-in. Then add the same email here.</p><div class="form-grid"><div class="field"><label>PARTNER EMAIL</label><input id="cloud-invite-email" type="email" placeholder="partner@example.com"></div><div class="field"><label>PARTNER ACCESS</label><div class="notice">Editor · can post and edit the shared books</div></div></div><button class="btn" style="margin-top:9px" onclick="cloudInvitePartner()">Add partner</button></div>`;
  let memberUi='';
  if(member)memberUi=`<div class="breakdown"><span>Access</span><b>${esc(member.role)} · ${cloudReady?'automatic sync enabled':'load shared books to enable sync'}</b></div><div class="small muted cloud-status">${esc(cloudStatusMessage)}</div><div class="actions"><button class="btn" onclick="cloudDownloadShared()">Load shared books to this device</button><button class="btn primary" onclick="cloudSyncNow()">Sync local changes now</button><button class="btn" onclick="cloudSaveRestorePoint()">Save cloud restore point</button><button class="btn" onclick="cloudLoadBackups()">View cloud backups</button></div>${backupUi}${inviteUi}`;
  content=`<div class="cloud-connected"><div class="breakdown"><span>Signed in as</span><b>${esc(cloudSession.user?.email||'Partner')}</b></div>${workspaceUi}${memberUi}<button class="btn sm" style="margin-top:12px" onclick="cloudSignOut()">Sign out on this device</button></div>`;
 }
 const state=cloudSession?.access_token?cloudReady?(cloudConflict?'Needs conflict review':'Connected'):'Signed in · not synced':'Not connected';
 return `<section class="card section cloud-section"><div class="section-top"><div><div class="eyebrow">SHARED PARTNER BOOKS</div><h2>Supabase cloud sync</h2></div><span class="badge ${cloudSession?.access_token&&cloudReady&&!cloudConflict?'green':''}">${state}</span></div><p class="small muted">Use a Supabase publishable/anon key with the supplied row-level-security setup. Never put a service_role key in this app.</p>${connectionForm}${content}<div class="banner cloud-setup-steps"><b>Setup order:</b> Create a Supabase project · run the supplied <code>AETHEL-Supabase-Setup.sql</code> in SQL Editor · enter the project URL and publishable key · create/sign in to the first partner account · create the workspace · have the other partners sign up and invite their emails.</div></section>`;
}
setInterval(()=>cloudPoll(),30000);
Object.assign(window,{cloudSaveConfig,cloudSignIn,cloudCreateWorkspace,cloudSelectWorkspace,cloudDownloadShared,cloudSyncNow,cloudSignOut,cloudInvitePartner,cloudSaveRestorePoint,cloudLoadBackups,cloudRestoreSelected,scheduleCloudSave});
if(cloudSession?.access_token)cloudResumeSession();

})();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}))}</script></body></html>
