</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="monogram"><img src="AethelMonogram.png" alt="AETHEL monogram"></div><strong>AETHEL COLLECTIVE</strong><small>PARTNERSHIP BOOKS · INDIA</small></div><nav class="nav"><div class="nav-label">WORKSPACE</div><button data-page="dashboard" class="active"><span class="ico">◫</span>Overview</button><button data-page="journal"><span class="ico">≡</span>Journal</button><button data-page="accounts"><span class="ico">▤</span>Accounts & ledgers</button><button data-page="reports"><span class="ico">▥</span>Financial reports</button><div class="nav-label">OPERATIONS</div><button data-page="sales"><span class="ico">↗</span>Sales & customers</button><button data-page="purchases"><span class="ico">↙</span>Purchases & suppliers</button><button data-page="inventory"><span class="ico">◇</span>Inventory</button><button data-page="partners"><span class="ico">♙</span>Partners</button><button data-page="review"><span class="ico">◷</span>Review drafts</button><div class="nav-label">ADMINISTRATION</div><button data-page="chart"><span class="ico">▦</span>Chart of Accounts</button><button data-page="close"><span class="ico">◷</span>Period close</button><button data-page="settings"><span class="ico">⚙</span>Settings & backup</button></nav><div class="side-foot">Double entry · India · INR<br><span id="save-state">Saved in this browser</span></div></aside><main class="main"><header class="topbar"><nav class="crumb" id="crumb" aria-label="Breadcrumb"><img class="topbar-mark" src="AethelMonogram.png" alt="" aria-hidden="true"><button type="button" onclick="nav('dashboard')">Books</button><span aria-hidden="true"> / </span><span class="current">Overview</span></nav><div class="top-actions"><span class="badge" id="period-tag">Current books</span><button class="btn primary" onclick="openEntry()">＋ New journal entry</button></div></header><div class="content" id="view"></div></main></div><div id="modal-root"></div><div id="toast-root"></div>
<script>
(()=>{'use strict';
const PARTNERS=['Shuaib S','Joshvin Thomas','Rahul R'];
const defaults={version:1,company:'AETHEL COLLECTIVE',currency:'INR',gstEnabled:false,gstin:'',periodStart:'2026-10-01',periodEnd:'2027-03-31',entries:[],accounts:[
{id:'cash',name:'Cash in hand',type:'Asset',sub:'Cash'}, {id:'bank',name:'Bank account',type:'Asset',sub:'Bank'}, {id:'ar',name:'Accounts receivable',type:'Asset',sub:'Receivable'}, {id:'inventory',name:'Inventory',type:'Asset',sub:'Inventory'}, {id:'prepaid',name:'Prepaid expenses',type:'Asset',sub:'Prepaid'}, {id:'equipment',name:'Equipment',type:'Asset',sub:'Fixed asset'}, {id:'ap',name:'Accounts payable',type:'Liability',sub:'Payable'}, {id:'customer-advance',name:'Customer advances',type:'Liability',sub:'Current liability'}, {id:'gst-out',name:'GST payable',type:'Liability',sub:'Tax'}, {id:'gst-in',name:'GST input credit',type:'Asset',sub:'Tax'},
{id:'cap-shuaib',name:'Shuaib S — Capital',type:'Equity',sub:'Partner capital'}, {id:'cap-joshvin',name:'Joshvin Thomas — Capital',type:'Equity',sub:'Partner capital'}, {id:'cap-rahul',name:'Rahul R — Capital',type:'Equity',sub:'Partner capital'}, {id:'cur-shuaib',name:'Shuaib S — Current',type:'Equity',sub:'Partner current'}, {id:'cur-joshvin',name:'Joshvin Thomas — Current',type:'Equity',sub:'Partner current'}, {id:'cur-rahul',name:'Rahul R — Current',type:'Equity',sub:'Partner current'},
{id:'sales-income',name:'Sales',type:'Income',sub:'Operating income'}, {id:'other-income',name:'Other income',type:'Income',sub:'Other income'}, {id:'purchases',name:'Purchases',type:'Expense',sub:'Cost of goods'}, {id:'freight-in',name:'Freight inward',type:'Expense',sub:'Direct expense'}, {id:'packaging',name:'Packaging expense',type:'Expense',sub:'Direct expense'}, {id:'advertising',name:'Advertising & marketing',type:'Expense',sub:'Operating expense'}, {id:'website',name:'Website & domain expense',type:'Expense',sub:'Operating expense'}, {id:'rent',name:'Rent',type:'Expense',sub:'Operating expense'}, {id:'utilities',name:'Utilities',type:'Expense',sub:'Operating expense'}, {id:'bank-fees',name:'Bank charges',type:'Expense',sub:'Operating expense'}, {id:'wages',name:'Wages & salaries',type:'Expense',sub:'Operating expense'}, {id:'misc-expense',name:'General expenses',type:'Expense',sub:'Operating expense'}]};
let db;try{db=JSON.parse(localStorage.getItem('aethel-books-v1'))||structuredClone(defaults)}catch{db=structuredClone(defaults)}
db={...structuredClone(defaults),...db};if(!db.accounts?.length)db.accounts=structuredClone(defaults.accounts);if(!Array.isArray(db.accountAudit))db.accountAudit=[];
const INR=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2});const money=n=>INR.format(Number(n)||0);const id=()=>crypto.randomUUID();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';const isoToday=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem('aethel-books-v1',JSON.stringify(db));document.getElementById('save-state').textContent='Saved · '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}
function importMTRData(){const mapping=[['cash','Cash a/c'],['cap-shuaib','Shuaib Capital a/c'],['cap-joshvin','Joshvin Capital a/c'],['cap-rahul','Rahul Capital a/c'],['website','Website a/c'],['customer-advance','Rageesha-customer advance a/c'],['packaging','Packaging materials a/c'],['purchases','Purchase a/c'],['sales-income','Sales a/c'],['advertising','Advertisement expense a/c']];let changed=false;mapping.forEach(([id,name])=>{let a=acct(id);if(a&&a.name!==name){a.name=name;changed=true}});if(!acct('domain-prepaid')){db.accounts.push({id:'domain-prepaid',name:'Domain a/c',type:'Asset',sub:'Prepaid'});changed=true}if(!acct('sanju-debtor')){db.accounts.push({id:'sanju-debtor',name:'Sanju - debtor a/c',type:'Asset',sub:'Receivable'});changed=true}if(!db.entries.some(e=>e.importedFrom==='BOOK OF ACCOUNTS.mtr')){let narratives=[['01','Opening','Capital introduced by partner Shuaib'],['02','Opening','Capital introduced by partner Joshvin'],['03','Opening','Capital introduced by partner Rahul'],['04','Sale','Advance received from Rageesha for product delivery later'],['05','Purchase','Packaging materials purchased from Meesho'],['06','Opening','Additional capital introduced by Joshvin'],['07','Purchase','Purchased Casio New Model watch'],['08','Sale','Sold Casio New Model watch'],['09','Purchase','Purchased Magneto Jupiter watch'],['10','Journal','₹500 paid for advertisement cards for AETHEL COLLECTIVE'],['13','Purchase','Fixen ladies watch purchased for resale for ₹300'],['14','Sale','Fixen ladies watch sold for ₹500; ₹400 received in cash and ₹100 remains receivable']];db.entries.push(...narratives.map(([n,type,memo])=>({id:id(),date:db.periodStart,ref:'MTR-'+n,entryType:type,status:'draft',party:n==='04'?'Rageesha':n==='14'?'Fixen customer':'',memo:`Imported from BOOK OF ACCOUNTS.mtr. DATE, AMOUNT AND ACCOUNT SPLIT REQUIRE REVIEW. Source: ${memo}.`,lines:[],importedFrom:'BOOK OF ACCOUNTS.mtr',createdAt:new Date().toISOString()})));changed=true}if(changed)localStorage.setItem('aethel-books-v1',JSON.stringify(db))}
importMTRData();
function toast(t){const r=document.getElementById('toast-root');r.innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>r.innerHTML='',2600)}
function acct(id){return db.accounts.find(a=>a.id===id)}function lines(entry){return entry.lines||[]}
function totals(e){return lines(e).reduce((o,l)=>{o.dr+=+l.debit||0;o.cr+=+l.credit||0;return o},{dr:0,cr:0})}
function allLines(){return db.entries.filter(e=>e.status==='posted').flatMap(e=>lines(e).map(l=>({...l,date:e.date,entryId:e.id,ref:e.ref,memo:e.memo,entryType:e.entryType||'Journal'})))}
function balances(asOf=null){const result={};db.accounts.forEach(a=>result[a.id]=0);allLines().filter(l=>!asOf||l.date<=asOf).forEach(l=>{const a=acct(l.accountId);if(!a)return;const natural=['Asset','Expense'].includes(a.type)?1:-1;result[l.accountId]+=(+l.debit- +l.credit)*natural});return result}
function rangeEntries(){return db.entries.filter(e=>e.status==='posted'&&!e.closing&&e.date>=db.periodStart&&e.date<=db.periodEnd)}function pnl(){const v={income:0,cost:0,expense:0};rangeEntries().forEach(e=>lines(e).forEach(l=>{const a=acct(l.accountId);if(!a)return;if(a.type==='Income')v.income+=+l.credit- +l.debit;if(a.type==='Expense'){if(['Cost of goods','Direct expense'].includes(a.sub))v.cost+=+l.debit- +l.credit;else v.expense+=+l.debit- +l.credit}}));v.gross=v.income-v.cost;v.net=v.gross-v.expense;return v}
function postedCount(){return db.entries.filter(e=>e.status==='posted').length}function activePage(){return document.querySelector('.nav button.active')?.dataset.page||'dashboard'}
function nav(page){document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const group=['journal','accounts','reports'].includes(page)?'Accounting':['sales','purchases','inventory','partners','review'].includes(page)?'Operations':page==='dashboard'?'':'Administration',crumb=document.getElementById('crumb');crumb.innerHTML=group?`<img class="topbar-mark" src="AethelMonogram.png" alt="" aria-hidden="true"><button type="button" onclick="nav('dashboard')">Books</button><span aria-hidden="true"> / </span><span>${group}</span><span aria-hidden="true"> / </span><span class="current">${esc(pageNames[page]||page)}</span>`:`<img class="topbar-mark" src="AethelMonogram.png" alt="" aria-hidden="true"><button type="button" onclick="nav('dashboard')">Books</button><span aria-hidden="true"> / </span><span class="current">${esc(pageNames[page]||page)}</span>`;render(page);window.scrollTo(0,0)}const pageNames={dashboard:'Overview',journal:'Journal',accounts:'Accounts & ledgers',reports:'Financial reports',sales:'Sales & customers',purchases:'Purchases & suppliers',inventory:'Inventory',partners:'Partners',review:'Review drafts',chart:'Chart of Accounts',close:'Period close',settings:'Settings & backup'};
document.querySelectorAll('.nav button[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));document.getElementById('period-tag').textContent=`${day(db.periodStart)} — ${day(db.periodEnd)}`;
function render(page=activePage()){document.getElementById('view').innerHTML=({dashboard:dashboard,journal:journal,accounts:accountsPage,reports:reports,sales:()=>salesPage('Sales'),purchases:()=>salesPage('Purchase'),inventory:inventory,partners:partners,review:review,close:closePage,settings:settings,chart:chartAccounts})[page]?.()||''}
const head=(title,sub,actions='')=>`<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;
function dashboard(){const b=balances(db.periodEnd),p=pnl(),cash=(b.cash||0)+(b.bank||0),asset=db.accounts.filter(a=>a.type==='Asset').reduce((s,a)=>s+(b[a.id]||0),0),draft=db.entries.filter(e=>e.status==='draft').length;let recent=[...db.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `${head(`Good ${new Date().getHours()<12?'morning':'day'}`,'A clear view of your books for the selected accounting period.',`<button class="btn" onclick="nav('reports')">View reports</button><button class="btn primary" onclick="openEntry()">＋ Record transaction</button>`)}${db.entries.length===0?'<div class="notice"><b>Books are ready.</b> No transactions have been posted. Opening partner capital balances from your brief are prepared as clearly labeled opening-balance drafts for review.</div>':''}<div class="stats"><div class="card stat"><div class="goldline"></div><label>Cash & bank</label><strong>${money(cash)}</strong><small>Closing balance at ${day(db.periodEnd)}</small></div><div class="card stat"><div class="goldline"></div><label>Sales this period</label><strong>${money(p.income)}</strong><small>${rangeEntries().length} posted transaction${rangeEntries().length===1?'':'s'} in period</small></div><div class="card stat"><div class="goldline"></div><label>Net profit / (loss)</label><strong style="color:${p.net<0?'var(--red)':'inherit'}">${money(p.net)}</strong><small>For selected accounting period</small></div><div class="card stat"><div class="goldline"></div><label>Total assets</label><strong>${money(asset)}</strong><small>At period end</small></div></div><div class="grid2"><section class="card section"><div class="section-top"><h2>Recent activity</h2><button class="btn sm" onclick="nav('journal')">Open journal</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>Date / reference</th><th>Description</th><th>Status</th><th class="num">Amount</th></tr></thead><tbody>${recent.map(e=>`<tr><td>${day(e.date)}<br><span class="muted">${esc(e.ref||'')}</span></td><td>${esc(e.memo||'—')}</td><td><span class="badge ${e.status==='posted'?'green':''}">${e.status==='posted'?'Posted':'Draft'}</span></td><td class="num">${money(totals(e).dr)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No activity yet. Start by reviewing your drafts or recording an opening balance.</div>'}</section><section class="card section"><div class="section-top"><h2>Needs your review</h2><button class="btn sm" onclick="nav('review')">Review drafts${draft?` (${draft})`:''}</button></div>${draft?`<p class="small muted"><span class="alert-dot"></span>${draft} draft item${draft===1?'':'s'} waiting for review. Drafts never affect your reports or balances.</p>`:'<p class="small muted">There are no drafts waiting for review.</p>'}<div class="breakdown"><span>Accounting period</span><b>${day(db.periodStart)} – ${day(db.periodEnd)}</b></div><div class="breakdown"><span>GST configuration</span><b>${db.gstEnabled?'Enabled':'Optional · not enabled'}</b></div><div class="breakdown"><span>Partners</span><b>3</b></div></section></div><div class="banner">Opening balances and transaction references supplied in the brief are labeled as user-provided or unposted examples. Review and confirm each draft before posting.</div>`}
function entryTable(es,editable=true){if(!es.length)return '<div class="empty">No entries to show.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Reference / entry ID</th><th>Description</th><th>Source</th><th>Status</th><th class="num">Debit</th><th>Actions</th></tr></thead><tbody>${es.map(e=>`<tr><td>${day(e.date)}</td><td><span>${esc(e.ref||'—')}</span><br><span class="muted small">${esc(e.id||'—')}</span></td><td>${esc(e.memo||'—')}</td><td>${esc(e.entryType||'Journal')}</td><td><span class="badge ${e.status==='posted'?'green':e.status==='void'?'red':''}">${esc(e.status==='posted'?'Posted':e.status==='void'?'Voided':'Draft')}</span></td><td class="num">${money(totals(e).dr)}</td><td><div class="actions">${e.closing?`<button class="btn sm" onclick="inspectEntry('${esc(e.id)}')">View</button><span class="badge">Period close</span>`:`${e.status==='draft'?`<button class="btn sm gold" onclick="editEntry('${esc(e.id)}')">Review</button>`:`<button class="btn sm" onclick="inspectEntry('${esc(e.id)}')">View</button>${e.status==='posted'?`<button class="btn sm" onclick="editEntry('${esc(e.id)}')">Edit</button>`:''}`}${e.status!=='void'?`<button class="btn sm danger" onclick="deleteEntry('${esc(e.id)}')">${e.status==='posted'?'Void':'×'}</button>`:''}`}</div></td></tr>`).join('')}</tbody></table></div>`}

function journal(){const sort=window.journalSort||'date-desc',sortLabel={"date-desc":"Date · newest first","date-asc":"Date · oldest first","reference-asc":"Reference ID · A–Z","reference-desc":"Reference ID · Z–A","entry-asc":"Entry ID · A–Z","entry-desc":"Entry ID · Z–A"},field=sort.startsWith('reference-')?'ref':sort.startsWith('entry-')?'id':'date',descending=sort.endsWith('-desc'),compare=(a,b)=>String(a||'').localeCompare(String(b||''),'en',{numeric:true,sensitivity:'base'}),entries=[...db.entries].sort((a,b)=>{const result=compare(a[field],b[field]);return (descending?-result:result)||compare(a.ref,b.ref)||compare(a.id,b.id)});return `${head('Journal','Every posted entry is balanced, dated and retained in the audit trail.',`<button class="btn" onclick="exportCSV()">Export journal CSV</button><button class="btn primary" onclick="openEntry()">＋ New entry</button>`)}<div class="card section"><div class="journal-tools"><div><h2>Transaction history</h2><span class="muted small">${db.entries.length} total · ${postedCount()} posted</span></div><label class="journal-sort-label">SORT BY<select class="journal-sort" aria-label="Sort journal entries" onchange="window.journalSort=this.value;render('journal')">${Object.entries(sortLabel).map(([value,label])=>`<option value="${value}" ${sort===value?'selected':''}>${label}</option>`).join('')}</select></label></div>${entryTable(entries)}</div>`}

function accountsPage(){let sel=window.selectedAccount||'all',asOf=window.ledgerAsOf||db.periodEnd;return `${head('Accounts & ledgers','Account balances and source transactions through '+day(asOf))}<div class="card section"><div class="form-grid" style="margin-bottom:17px"><div class="field"><label>ACCOUNT LEDGER</label><select onchange="window.selectedAccount=this.value;render('accounts')"><option value="all" ${sel==='all'?'selected':''}>All accounts · trial balance</option>${db.accounts.map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''}>${esc(a.name)} · ${esc(a.type)}${a.archived?' · archived':''}</option>`).join('')}</select></div><div class="field"><label>AS OF</label><input type="date" value="${asOf}" onchange="window.ledgerAsOf=this.value;render('accounts')"></div></div>${sel==='all'?`${trialBalance(asOf)}<p class="small muted">Each account is shown on its actual net debit or credit side. Only posted entries through the selected date are included.</p>`:ledger(sel,asOf)}</div>`}
function accountUsage(accountId){return db.entries.filter(e=>lines(e).some(l=>l.accountId===accountId)).length}
function recordAccountChange(action,account,before=null){if(!Array.isArray(db.accountAudit))db.accountAudit=[];const snap=x=>x?{id:x.id,name:x.name,type:x.type,sub:x.sub,archived:!!x.archived}:null,ref=account||before;let summary=action==='Edited'?(before?.name!==account?.name?`${before?.name||'Account'} renamed to ${account?.name||'Account'}`:`${account?.name||'Account'} details updated`):action==='Created'?`${account?.name||'Account'} created`:`${ref?.name||'Account'} ${action.toLowerCase()}`;if(action==='Edited'&&before?.type!==account?.type)summary+=` · ${before.type} → ${account.type}`;db.accountAudit.unshift({at:new Date().toISOString(),action,accountId:ref?.id||'',accountName:ref?.name||'Account',summary,before:snap(before),after:snap(account)});db.accountAudit=db.accountAudit.slice(0,100)}
function openAccountLedger(accountId){if(!acct(accountId))return;window.selectedAccount=accountId;window.ledgerAsOf=db.periodEnd;nav('accounts')}
function chartAccounts(){const rows=db.accounts.map(a=>{const used=accountUsage(a.id),archived=!!a.archived,search=(a.name+' '+a.type+' '+(a.sub||'')).toLowerCase();return `<div class="chart-row${archived?' is-archived':''}" data-search="${esc(search)}" data-archived="${archived}"><div class="chart-account"><strong>${esc(a.name)}</strong><small>${archived?'<span class="badge red">Archived</span> ':''}${esc(a.id)}</small></div><div class="chart-meta-grid"><div class="chart-meta"><label>Type</label><span class="badge ${a.type==='Income'?'green':''}">${esc(a.type)}</span></div><div class="chart-meta"><label>Group</label><span>${esc(a.sub||'—')}</span></div><div class="chart-meta"><label>Journal use</label><span>${used} ${used===1?'entry':'entries'}</span></div></div><div class="chart-actions">${archived?`<button class="btn sm gold" onclick="restoreAccount('${esc(a.id)}')">Restore</button>`:`<button class="btn sm" onclick="openAccountLedger('${esc(a.id)}')">Ledger</button><button class="btn sm" onclick="editAccount('${esc(a.id)}')">Edit</button><button class="btn sm danger" onclick="deleteAccount('${esc(a.id)}')">Delete</button>`}</div></div>`}).join('');const events=(db.accountAudit||[]).slice(0,8);return `${head('Chart of Accounts','Manage the accounts available in journal entries and follow account changes.',`<button class="btn primary" onclick="openAccountCreator()">＋ New account</button>`)}<div class="notice">Account names and groups update everywhere by account ID. Accounts with journal history are archived when removed from new entries so posted books and drafts stay intact. Only unused custom accounts can be permanently deleted.</div><section class="card section chart-section"><div class="section-top chart-tools"><div><h2>Accounts</h2><span class="muted small">${db.accounts.filter(a=>!a.archived).length} active · ${db.accounts.filter(a=>a.archived).length} archived</span></div><div class="chart-filters"><input class="chart-search" type="search" placeholder="Search accounts" aria-label="Search accounts" oninput="filterChartAccounts(this.value)"><select aria-label="Account status" id="chart-status-filter" onchange="filterChartAccounts()"><option value="active">Active accounts</option><option value="all">All accounts</option><option value="archived">Archived accounts</option></select></div></div><div class="chart-table-head"><span>Account</span><span>Classification & journal use</span><span>Actions</span></div><div class="chart-list">${rows||'<div class="empty">No accounts configured.</div>'}<div class="empty chart-no-results" id="chart-no-results" hidden>No accounts match this search.</div></div></section><details class="card section account-audit"><summary>Recent account changes · ${events.length}</summary>${events.length?`<div class="audit-list">${events.map(e=>`<div class="audit-item"><span><b>${esc(e.action)}</b> · ${esc(e.summary||e.accountName||'Account changed')}</span><time>${esc(e.at?new Date(e.at).toLocaleString('en-IN'):'—')}</time></div>`).join('')}</div>`:'<p class="small muted">Account edits, archives and deletions will appear here.</p>'}</details>`}
function filterChartAccounts(query){const search=typeof query==='string'?query.toLowerCase().trim():(document.querySelector('.chart-search')?.value||'').toLowerCase().trim(),status=document.getElementById('chart-status-filter')?.value||'active';let shown=0;document.querySelectorAll('.chart-row[data-search]').forEach(row=>{const isArchived=row.dataset.archived==='true',matchesSearch=row.dataset.search.includes(search),matchesStatus=status==='all'||(status==='archived'?isArchived:!isArchived);row.hidden=!(matchesSearch&&matchesStatus);if(!row.hidden)shown++});const empty=document.getElementById('chart-no-results');if(empty)empty.hidden=shown>0}
function editAccount(accountId){const a=acct(accountId);if(!a)return;const refs=accountUsage(a.id);document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal narrow"><div class="modal-head"><div><div class="eyebrow">CHART OF ACCOUNTS</div><h2>Edit account</h2></div><button class="x" onclick="closeModal()" aria-label="Close">×</button></div><div class="form-grid"><div class="field full"><label>ACCOUNT NAME</label><input id="edit-account-name" maxlength="100" value="${esc(a.name)}"></div><div class="field"><label>ACCOUNT TYPE</label><select id="edit-account-type">${['Asset','Liability','Equity','Income','Expense'].map(t=>`<option ${a.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>GROUP / SUBTYPE</label><input id="edit-account-sub" maxlength="80" value="${esc(a.sub||'')}"></div></div>${refs?`<div class="notice account-reclass-note"><b>${refs} journal ${refs===1?'entry':'entries'} use this account.</b> Changing its type changes where the complete history appears in financial reports.<label class="switch"><input id="account-reclass-confirm" type="checkbox"> I understand the report classification will change.</label></div>`:''}${a.archived?'<div class="banner">This account is archived and unavailable for new journal lines. Restoring it is available from the Chart of Accounts.</div>':''}<div class="actions" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAccount('${esc(a.id)}')">Save changes</button></div></div></div>`}
function saveAccount(accountId){const a=acct(accountId);if(!a)return;const name=document.getElementById('edit-account-name').value.trim(),type=document.getElementById('edit-account-type').value,sub=document.getElementById('edit-account-sub').value.trim()||type;if(!name)return toast('Enter an account name.');if(db.accounts.some(x=>x.id!==accountId&&x.name.toLowerCase()===name.toLowerCase()))return toast('An account with that name already exists.');const refs=accountUsage(accountId);if(refs&&type!==a.type&&!document.getElementById('account-reclass-confirm')?.checked)return toast('Confirm the report reclassification before changing account type.');const before={...a};a.name=name;a.type=type;a.sub=sub;recordAccountChange('Edited',a,before);save();closeModal();toast('Account updated across the books');render(activePage())}
function deleteAccount(accountId){const a=acct(accountId);if(!a)return;const refs=accountUsage(accountId),system=defaults.accounts.some(x=>x.id===accountId);if(refs||system){if(a.archived)return toast('This account is already archived.');const why=refs?`${refs} journal ${refs===1?'entry uses':'entries use'} this account`:'This is a standard account used by AETHEL accounting workflows';if(!confirm(`${why}. Archive “${a.name}” instead? It will no longer be available for new journal lines, but its history and reports will be preserved.`))return;const before={...a};a.archived=true;recordAccountChange('Archived',a,before);save();render('chart');return toast('Account archived; journal history preserved')}if(!confirm(`Permanently delete unused account “${a.name}”?`))return;const before={...a};recordAccountChange('Deleted',null,before);db.accounts=db.accounts.filter(x=>x.id!==accountId);save();render('chart');toast('Unused account deleted')}
function restoreAccount(accountId){const a=acct(accountId);if(!a?.archived)return;const before={...a};a.archived=false;recordAccountChange('Restored',a,before);save();render('chart');toast('Account restored to journal choices')}
function ledger(accountId,end){const a=acct(accountId),ls=allLines().filter(l=>l.accountId===accountId&&l.date<=end).sort((x,y)=>x.date.localeCompare(y.date));let run=0;return `<h2>${esc(a?.name||'Account')} <span class="muted small">· ${esc(a?.type||'')}</span></h2><p class="muted small">Transactions through ${day(end)} · ${ls.length} journal line${ls.length===1?'':'s'}</p><div class="table-wrap"><table><thead><tr><th>Date</th><th>Reference / memo</th><th>Debit</th><th>Credit</th><th>Balance</th><th>Actions</th></tr></thead><tbody>${ls.length?ls.map(l=>{let s=['Asset','Expense'].includes(a.type)?1:-1;run+=(+l.debit- +l.credit)*s;const source=db.entries.find(e=>e.id===l.entryId),locked=!!source?.closing;return `<tr><td>${day(l.date)}</td><td>${esc(l.ref)} · ${esc(l.memo)}</td><td>${l.debit?money(l.debit):'—'}</td><td>${l.credit?money(l.credit):'—'}</td><td>${money(run)} ${s===1?'Dr':'Cr'}</td><td><div class="actions ledger-actions"><button class="btn sm" onclick="inspectEntry('${esc(l.entryId)}')">View</button>${locked?'<span class="badge">Period close</span>':`<button class="btn sm" onclick="editEntry('${esc(l.entryId)}')">Edit</button><button class="btn sm danger" onclick="deleteEntry('${esc(l.entryId)}')">Void</button>`}</div></td></tr>`}).join(''):'<tr><td colspan="6" class="muted">No posted transactions in this account.</td></tr>'}</tbody></table></div><p class="small muted">Opening balance: ${money(run)} ${['Asset','Expense'].includes(a.type)?'Dr':'Cr'}. Editing opens the full journal entry; voiding removes it from balances and reports while retaining it in the audit trail.</p>`}
function reports(){const p=pnl(),b=balances(db.periodEnd);let assets=db.accounts.filter(a=>a.type==='Asset').map(a=>[a.name,b[a.id]||0]).filter(x=>x[1]);let liabs=db.accounts.filter(a=>a.type==='Liability').map(a=>[a.name,b[a.id]||0]).filter(x=>x[1]);let eq=db.accounts.filter(a=>a.type==='Equity').map(a=>[a.name,b[a.id]||0]).filter(x=>x[1]);let grossrows=db.accounts.filter(a=>a.type==='Income'||a.sub==='Cost of goods'||a.sub==='Direct expense').map(a=>[a.name,b[a.id]||0]).filter(x=>x[1]);const periodClosed=db.entries.some(e=>e.closing&&e.date===db.periodEnd),unclosedPeriodResult=periodClosed?0:p.net,totalAssets=assets.reduce((s,x)=>s+x[1],0),totalLiabilitiesEquity=liabs.reduce((s,x)=>s+x[1],0)+eq.reduce((s,x)=>s+x[1],0)+unclosedPeriodResult,balanceDifference=totalAssets-totalLiabilitiesEquity;return `${head('Financial reports','Accrual-basis reports for '+day(db.periodStart)+' to '+day(db.periodEnd),`<button class="btn" onclick="window.print()">Print reports</button><button class="btn" onclick="exportCSV()">Export CSV</button>`)}<div class="tabs"><button class="active">Trading & P&amp;L</button><button onclick="document.getElementById('bs').scrollIntoView({behavior:'smooth'})">Balance sheet</button><button onclick="document.getElementById('tb').scrollIntoView({behavior:'smooth'})">Trial balance</button><button onclick="document.getElementById('cb').scrollIntoView({behavior:'smooth'})">Cash book</button></div><div class="report-grid"><section class="card section"><div class="section-top"><h2>Trading account</h2><span class="muted small">${day(db.periodStart)} – ${day(db.periodEnd)}</span></div>${breakRows(grossrows,p.gross,'Gross profit')}</section><section class="card section"><div class="section-top"><h2>Profit & loss account</h2><span class="muted small">${day(db.periodStart)} – ${day(db.periodEnd)}</span></div><div class="breakdown"><span>Gross profit / (loss)</span><b>${money(p.gross)}</b></div>${db.accounts.filter(a=>a.type==='Expense'&&!['Cost of goods','Direct expense'].includes(a.sub)).map(a=>{let n=(b[a.id]||0);return n?`<div class="breakdown"><span>${esc(a.name)}</span><span>${money(n)}</span></div>`:''}).join('')}<div class="breakdown total"><span>Net profit / (loss)</span><b>${money(p.net)}</b></div></section><section class="card section" id="bs"><div class="section-top"><h2>Balance sheet</h2><span class="muted small">As at ${day(db.periodEnd)}</span></div><b class="small">Assets</b>${rows(assets)}<div class="breakdown total"><span>Total assets</span><b>${money(totalAssets)}</b></div><br><b class="small">Liabilities</b>${rows(liabs)}<b class="small">Partners' equity</b>${rows(eq)}<div class="breakdown"><span>${periodClosed?'Current period result (transferred to equity)':'Current period profit / (loss)'}</span><b>${money(unclosedPeriodResult)}</b></div><div class="breakdown total"><span>Liabilities & equity</span><b>${money(totalLiabilitiesEquity)}</b></div><div class="breakdown"><span>Balance check</span><b class="badge ${Math.abs(balanceDifference)<.005?'green':'red'}">${Math.abs(balanceDifference)<.005?'Balanced':'Difference '+money(balanceDifference)}</b></div><p class="small muted">Balance-sheet inventory uses posted asset balances. Cost of goods sold is reflected in current-period profit.</p></section><section class="card section" id="tb"><div class="section-top"><h2>Trial balance</h2><span class="muted small">As at ${day(db.periodEnd)}</span></div>${trialBalance(db.periodEnd)}</section><section class="card section" id="cb"><div class="section-top"><h2>Cash book</h2><span class="muted small">Posted cash and bank movements</span></div>${cashBook()}</section></div>`}
function rows(arr){return arr.length?arr.map(x=>`<div class="breakdown"><span>${esc(x[0])}</span><span>${money(x[1])}</span></div>`).join(''):'<div class="breakdown muted"><span>No posted balances</span><span>—</span></div>'}function breakRows(arr,total,label){return `${arr.map(x=>`<div class="breakdown"><span>${esc(x[0])}</span><span>${money(x[1])}</span></div>`).join('')}<div class="breakdown total"><span>${label}</span><b>${money(total)}</b></div>`}
function trialBalanceRows(asOf=null){const net={};allLines().filter(l=>!asOf||l.date<=asOf).forEach(l=>{net[l.accountId]=(net[l.accountId]||0)+(+l.debit||0)-(+l.credit||0)});const rows=db.accounts.map(a=>{const value=net[a.id]||0;return {name:a.name,type:a.type,debit:Math.max(value,0),credit:Math.max(-value,0)}});const known=new Set(db.accounts.map(a=>a.id));Object.entries(net).filter(([accountId])=>!known.has(accountId)).forEach(([accountId,value])=>rows.push({name:`Unmapped account · ${accountId}`,type:'Unmapped',debit:Math.max(value,0),credit:Math.max(-value,0)}));return rows.filter(r=>r.debit>.005||r.credit>.005)}
function trialBalance(asOf=db.periodEnd){const rows=trialBalanceRows(asOf),debit=rows.reduce((s,r)=>s+r.debit,0),credit=rows.reduce((s,r)=>s+r.credit,0),diff=debit-credit,balanced=Math.abs(diff)<.005;return `<div class="section-top"><span class="small muted">Posted balances by actual net debit or credit side</span><span class="badge ${balanced?'green':'red'}">${balanced?'Balanced':'Difference '+money(diff)}</span></div><div class="table-wrap"><table><thead><tr><th>Account</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}${r.type==='Unmapped'?' <span class="badge red">Review account</span>':''}</td><td class="num">${r.debit>.005?money(r.debit):'—'}</td><td class="num">${r.credit>.005?money(r.credit):'—'}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">No balances posted.</td></tr>'}</tbody><tfoot><tr><th>Total</th><th class="num">${money(debit)}</th><th class="num">${money(credit)}</th></tr></tfoot></table></div>`}
function cashBook(){const lines=allLines().filter(l=>['cash','bank'].includes(l.accountId)&&l.date>=db.periodStart&&l.date<=db.periodEnd).sort((a,b)=>a.date.localeCompare(b.date));return lines.length?`<table><thead><tr><th>Date</th><th>Account / narration</th><th>Inflow</th><th>Outflow</th></tr></thead><tbody>${lines.map(l=>`<tr><td>${day(l.date)}</td><td>${esc(acct(l.accountId)?.name)} · ${esc(l.memo)}</td><td>${l.debit?money(l.debit):'—'}</td><td>${l.credit?money(l.credit):'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No posted cash or bank activity in this period.</div>'}
function salesPage(kind){const isSales=kind==='Sales',type=isSales?'sale':'purchase',list=db.entries.filter(e=>e.entryType===kind.toLowerCase()&&e.status==='posted');return `${head(kind,isSales?'Record invoices, receipts and customer balances.':'Record supplier bills, payments and supplier balances.',`<button class="btn primary" onclick="openEntry('${type}')">＋ Record ${isSales?'sale':'purchase'}</button>`)}<div class="card section"><div class="section-top"><h2>${kind} transactions</h2><span class="muted small">${list.length} posted</span></div>${entryTable(list)}</div><div class="grid2" style="margin-top:16px"><section class="card section"><h2>${isSales?'Customer':'Supplier'} balances</h2>${partyBalances(isSales?'ar':'ap')}</section><section class="card section"><h2>Posting guide</h2><p class="small muted">${isSales?'Sales on credit debit receivables and credit sales. Record a separate receipt against receivables when the customer pays.':'Purchases on credit debit purchases and credit payables. Record payment separately against payables when paid.'} Enter GST lines only when registered and supported by a valid tax invoice.</p></section></div>`}
function partyBalances(id){const a=acct(id),ls=allLines().filter(l=>l.accountId===id);let balance=ls.reduce((s,l)=>s+(+l.debit- +l.credit),0);return `<div class="breakdown"><span>${esc(a.name)} · total</span><b>${money(balance)}</b></div><p class="small muted">For party-level balances, include the customer or supplier name in the transaction memo; individual sub-ledgers are shown in the ledger.</p>`}
function inventory(){let b=balances(),v=b.inventory||0,products=db.products||[];return `${head('Inventory','Track items, quantities and posted inventory value.',`<button class="btn primary" onclick="addProduct()">＋ Add item</button>`)}<div class="stats"><div class="card stat"><div class="goldline"></div><label>Posted inventory value</label><strong>${money(v)}</strong><small>From posted inventory asset entries</small></div><div class="card stat"><div class="goldline"></div><label>Tracked items</label><strong>${products.length}</strong><small>Non-posting quantity register</small></div><div class="card stat"><div class="goldline"></div><label>Valuation policy</label><strong style="font-size:16px">Weighted average</strong><small>Configure before posting stock movements</small></div><div class="card stat"><div class="goldline"></div><label>GST</label><strong style="font-size:16px">${db.gstEnabled?'Enabled':'Not enabled'}</strong><small>Optional setting</small></div></div><div class="notice">Inventory register is a quantity aid; postings to the inventory asset account remain the accounting source of truth. Enable quantity movements only after confirming opening stock and costing method.</div><div class="card section"><div class="section-top"><h2>Item register</h2><button class="btn sm" onclick="addProduct()">Add item</button></div>${products.length?`<table><thead><tr><th>Item</th><th>SKU</th><th class="num">On hand</th><th>Unit</th><th class="num">Unit cost</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku||'—')}</td><td class="num">${+p.qty||0}</td><td>${esc(p.unit||'unit')}</td><td class="num">${money(p.cost)}</td><td><button class="btn sm danger" onclick="removeProduct('${p.id}')">Remove</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No items configured. Add stock items to maintain a simple item register.</div>'}</div>`}
function partners(){let b=balances(),names=['shuaib','joshvin','rahul'];return `${head('Partners','Partner capital and current accounts. Seed balances below are user-provided and remain drafts until confirmed.',`<button class="btn" onclick="nav('review')">Review opening balances</button>`)}<div class="notice"><b>Opening capital values provided in the brief.</b> These are not verified books. They are available as a single balanced opening-balance draft; confirm the opening date and corresponding opening assets/liabilities before posting.</div><div class="stats">${PARTNERS.map((p,i)=>{const cap=b['cap-'+names[i]]||0,cur=b['cur-'+names[i]]||0;return `<div class="card stat"><div class="goldline"></div><label>${p}</label><strong>${money(cap+cur)}</strong><small>Capital ${money(cap)} · Current ${money(cur)}</small></div>`}).join('')}<div class="card stat"><div class="goldline"></div><label>Total partners' equity</label><strong>${money(PARTNERS.reduce((s,_,i)=>s+(b['cap-'+names[i]]||0)+(b['cur-'+names[i]]||0),0))}</strong><small>Posted balances only</small></div></div><div class="card section"><h2>Partner terms</h2><p class="small muted">Profit-sharing percentages, interest on capital, drawings rules and partner remuneration have not been provided. Enter approved terms in Settings before allocation at period close.</p><div class="table-wrap"><table><thead><tr><th>Partner</th><th>Role</th><th>Profit share</th><th>Capital</th><th>Current</th></tr></thead><tbody><tr><td>Shuaib S</td><td>Founder &amp; CEO</td><td>Not configured</td><td>${money(b['cap-shuaib'])}</td><td>${money(b['cur-shuaib'])}</td></tr><tr><td>Joshvin Thomas</td><td>Co-founder &amp; COO</td><td>Not configured</td><td>${money(b['cap-joshvin'])}</td><td>${money(b['cur-joshvin'])}</td></tr><tr><td>Rahul R</td><td>Co-founder &amp; CMO</td><td>Not configured</td><td>${money(b['cap-rahul'])}</td><td>${money(b['cur-rahul'])}</td></tr></tbody></table></div></div>`}
function reviewCards(entries){if(!entries.length)return '<div class="empty">No drafts are waiting for review.</div>';return `<div class="review-grid">${entries.map(e=>{const source=e.importedFrom?`Imported from ${e.importedFrom}`:e.seedGroup==='brief'?'Brief reference · unposted':'Created in AETHEL books';return `<article class="review-card"><div class="review-copy"><p class="review-description">${esc(e.memo||'Description needed')}</p><p class="review-source">${esc(source)}${e.ref?` · ${esc(e.ref)}`:''}</p></div><div class="review-card-meta"><div class="review-meta"><label>Transaction type</label><span>${esc(e.entryType||'Journal')}</span></div><div class="review-meta"><label>Status</label><span class="badge">Draft · unposted</span></div><div class="review-meta review-amount"><label>Amount</label><span>${money(totals(e).dr)}</span></div></div><div class="review-actions"><button class="btn gold" onclick="editEntry('${e.id}')">Review</button><button class="btn review-delete" onclick="deleteEntry('${e.id}')">Delete</button></div></article>`}).join('')}</div>`}
function review(){let drafts=db.entries.filter(e=>e.status==='draft');return `${head('Review drafts','Review each item before it affects your accounts or reports.',`<button class="btn" onclick="seedDrafts()">＋ Load brief reference drafts</button>`)}<div class="notice">Imported and sample transactions stay unposted until you verify the details. Reviewing a draft opens its entry form, where you can edit it or confirm and post it.</div><section class="card section review-section"><div class="section-top"><div><h2>Transaction review</h2><span class="muted small">Descriptions first · amounts remain outside the books until posted</span></div><span class="badge">${drafts.length} awaiting review</span></div>${reviewCards(drafts)}</section>`}
function closePage(){const p=pnl(),existing=db.entries.find(e=>e.closing&&e.date===db.periodEnd);return `${head('Period close','Review the period before locking in the final balances.',`<button class="btn" onclick="nav('reports')">Review reports</button>`)}<div class="notice">This app does not provide statutory assurance. Reconcile bank, inventory and tax records; review the partner deed and consult your accountant before closing.</div><div class="grid2"><section class="card section"><h2>Pre-close checklist</h2>${[['Trial balance balances',Math.abs(trialDiff())<0.005?'Ready':'Investigate difference'],['Draft entries reviewed',db.entries.some(e=>e.status==='draft')?'Action needed':'Ready'],['Accounting period',`${day(db.periodStart)} – ${day(db.periodEnd)}`],['GST status',db.gstEnabled?'Enabled · reconcile tax returns':'Optional · not enabled'],['Partner profit shares','Not configured · allocation not available']].map(x=>`<div class="breakdown"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}</section><section class="card section"><h2>Period result</h2><div class="breakdown"><span>Sales and other income</span><b>${money(p.income)}</b></div><div class="breakdown"><span>Trading gross profit / (loss)</span><b>${money(p.gross)}</b></div><div class="breakdown total"><span>Net result</span><b>${money(p.net)}</b></div><p class="small muted">Partner allocation is withheld until you enter approved profit-sharing terms.</p>${existing?'<span class="badge green">Closing entry posted</span>':`<button class="btn primary" style="margin-top:10px" onclick="closePeriod()">Post period closing entry</button>`}</section></div>`}
function trialDiff(){return trialBalanceRows(null).reduce((s,r)=>s+r.debit-r.credit,0)}

function openEntry(kind='journal',existing=null){const e=existing||{},isDraft=e.status==='draft',ls=e.lines?.length?e.lines:[{accountId:'',debit:'',credit:''},{accountId:'',debit:'',credit:''}],title=existing?(isDraft?'Review draft':'Edit posted transaction'):'New '+(kind==='sale'?'sale':kind==='purchase'?'purchase':'journal entry'),kindopts=[['journal','Journal'],['sale','Sale'],['purchase','Purchase'],['opening','Opening balance'],['adjustment','Adjustment']];document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal entry-modal"><div class="modal-head"><div><div class="eyebrow">AETHEL COLLECTIVE · BOOKS</div><h2>${title}</h2></div><button class="x" onclick="closeModal()" aria-label="Close journal entry">×</button></div><div class="form-grid entry-form"><div class="field"><label>REFERENCE ID</label><input id="e-ref" value="${esc(e.ref||'') }" placeholder="Auto assigned if blank"></div><div class="field"><label>DATE</label><input id="e-date" type="date" value="${e.date||isoToday()}"></div><div class="field"><label>ENTRY TYPE</label><select id="e-type">${kindopts.map(([v,l])=>`<option value="${v}" ${(e.entryType?.toLowerCase()===v||(!e.entryType&&v===kind))?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>COUNTERPARTY</label><input id="e-party" value="${esc(e.party||'')}" placeholder="Optional"></div><div class="field full"><label>NOTES</label><input id="e-memo" value="${esc(e.memo||'')}" placeholder="Business purpose and source document"></div></div><div class="entry-lines-heading"><div><b>JOURNAL LINES</b><span class="muted">Choose an account, then enter a debit or credit.</span></div><button class="btn sm" onclick="addLine()">＋ Add line</button></div><div id="entry-lines" class="entry-line-list">${ls.map(l=>lineEditor(l)).join('')}</div><div class="totals"><span>Debits <b id="sum-dr">₹0.00</b></span><span>Credits <b id="sum-cr">₹0.00</b></span><b id="sum-diff" style="color:var(--red)">Difference ₹0.00</b></div>${isDraft?'<div class="notice entry-notice">Draft only · verify date, supporting documents, business purpose, payment status and tax treatment before posting.</div>':''}${e.importedFrom?'<label class="notice entry-notice"><input id="e-import-confirm" type="checkbox"> I verified this imported entry’s date, amount and account split against the original books.</label>':''}<div class="actions entry-actions"><label class="reconcile-check"><input id="e-reconcile" type="checkbox" ${e.reconciled?'checked':''}> Reconciled</label><span class="spacer"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveEntry('${existing?.id||''}',true)">Save draft</button><button class="btn primary" onclick="saveEntry('${existing?.id||''}',false)">${isDraft?'Confirm & post':'Post entry'}</button></div></div></div>`;window.currentEditId=e.id||'';updateSums()}function lineEditor(l={}){const listId='journal-accounts-'+(++window.accountPickerSequence|| (window.accountPickerSequence=1)),accounts=db.accounts.filter(a=>!a.archived||a.id===l.accountId),selected=acct(l.accountId),label=selected?accountPickerLabel(selected):'';return `<div class="line-item"><div class="account-pick"><input class="li-account-search" type="search" list="${listId}" aria-label="Search or choose account" placeholder="Search or choose account" autocomplete="off" value="${esc(label)}" oninput="syncJournalAccount(this)" onchange="syncJournalAccount(this)"><input class="li-account" type="hidden" value="${esc(l.accountId||'')}"><datalist id="${listId}">${accounts.map(a=>`<option value="${esc(accountPickerLabel(a))}" data-account-id="${esc(a.id)}"></option>`).join('')}</datalist><button type="button" class="btn sm account-add" title="Create an account" aria-label="Create an account" onclick="openAccountCreator(this.closest('.account-pick').querySelector('.li-account-search') )">+</button></div><input class="li-debit" type="number" min="0" step="0.01" placeholder="Debit ₹" aria-label="Debit amount" value="${l.debit||''}"><input class="li-credit" type="number" min="0" step="0.01" placeholder="Credit ₹" aria-label="Credit amount" value="${l.credit||''}"><button type="button" class="btn sm danger remove-line" aria-label="Remove journal line" onclick="this.parentElement.remove();updateSums()">×</button></div>`}function openAccountCreator(target=null){window.accountLineTarget=target;document.getElementById('modal-root').insertAdjacentHTML('beforeend',`<div class="modal-bg account-modal-bg" onclick="if(event.target===this)this.remove()"><div class="modal narrow"><div class="modal-head"><h2>Create account</h2><button class="x" onclick="this.closest('.account-modal-bg').remove()">×</button></div><div class="form-grid"><div class="field full"><label>ACCOUNT NAME</label><input id="new-account-name" placeholder="e.g. Office supplies" autofocus></div><div class="field"><label>ACCOUNT TYPE</label><select id="new-account-type"><option>Asset</option><option>Liability</option><option>Equity</option><option>Income</option><option>Expense</option></select></div><div class="field"><label>GROUP / SUBTYPE</label><input id="new-account-sub" placeholder="Optional"></div></div><p class="small muted">Choose the account’s normal financial statement category carefully. The account will be available immediately in this journal entry.</p><div class="actions" style="justify-content:flex-end"><button class="btn" onclick="this.closest('.account-modal-bg').remove()">Cancel</button><button class="btn primary" onclick="saveNewAccount()">Create account</button></div></div></div>`);document.getElementById('new-account-name').focus()}
function saveNewAccount(){let name=document.getElementById('new-account-name').value.trim(),type=document.getElementById('new-account-type').value,sub=document.getElementById('new-account-sub').value.trim()||type;if(!name)return toast('Enter an account name.');if(db.accounts.some(a=>a.name.toLowerCase()===name.toLowerCase()))return toast('An account with that name already exists.');let slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),base='custom-'+(slug||id()),accountId=base;while(acct(accountId))accountId=base+'-'+Math.random().toString(36).slice(2,6);let a={id:accountId,name,type,sub};db.accounts.push(a);recordAccountChange('Created',a);save();if(window.accountLineTarget){const input=window.accountLineTarget,wrap=input.closest('.account-pick'),hidden=wrap?.querySelector('.li-account'),list=document.getElementById(input.getAttribute('list'));if(list){const option=document.createElement('option');option.value=accountPickerLabel(a);option.dataset.accountId=a.id;list.appendChild(option)}if(hidden)hidden.value=a.id;input.value=accountPickerLabel(a)}document.querySelectorAll('.account-modal-bg').forEach(x=>x.remove());const selectedFromJournal=!!window.accountLineTarget;window.accountLineTarget=null;if(activePage()==='chart')render('chart');toast(selectedFromJournal?'Account created and selected':'Account created')}
function accountPickerLabel(a){return `${a.name} · ${a.type} · ${a.id}`}function syncJournalAccount(input){const option=[...(input.list?.options||[])].find(o=>o.value===input.value),hidden=input.closest('.account-pick')?.querySelector('.li-account');if(hidden)hidden.value=option?.dataset.accountId||''}function addLine(){const list=document.getElementById('entry-lines');list.insertAdjacentHTML('beforeend',lineEditor());updateSums();list.lastElementChild?.scrollIntoView({block:'nearest'})}document.addEventListener('input',e=>{if(e.target.matches('.li-debit,.li-credit'))updateSums()});function updateSums(){let d=0,c=0;document.querySelectorAll('.li-debit').forEach(e=>d+=+e.value||0);document.querySelectorAll('.li-credit').forEach(e=>c+=+e.value||0);let dr=document.getElementById('sum-dr');if(dr){document.getElementById('sum-dr').textContent=money(d);document.getElementById('sum-cr').textContent=money(c);let dif=d-c;document.getElementById('sum-diff').textContent=Math.abs(dif)<.005?'Balanced':'Difference '+money(Math.abs(dif));document.getElementById('sum-diff').style.color=Math.abs(dif)<.005?'var(--green)':'var(--red)'}}
function saveEntry(existingId,draft){let date=document.getElementById('e-date').value,entryType=document.getElementById('e-type').value,ref=document.getElementById('e-ref').value.trim(),party=document.getElementById('e-party').value.trim(),memo=document.getElementById('e-memo').value.trim(),lineEls=[...document.querySelectorAll('.line-item')],incomplete=lineEls.some(el=>{let accountId=el.querySelector('.li-account').value,search=el.querySelector('.li-account-search').value.trim(),debit=+el.querySelector('.li-debit').value||0,credit=+el.querySelector('.li-credit').value||0;return !accountId&&(search||debit||credit)});if(!date)return toast('Choose an entry date.');if(incomplete)return toast('Choose an account from the search suggestions for every journal line you have started.');let arr=lineEls.map(el=>({accountId:el.querySelector('.li-account').value,debit:+el.querySelector('.li-debit').value||0,credit:+el.querySelector('.li-credit').value||0})).filter(l=>l.accountId&&(l.debit||l.credit)),d=arr.reduce((s,l)=>s+l.debit,0),c=arr.reduce((s,l)=>s+l.credit,0),old=existingId&&db.entries.find(x=>x.id===existingId);if(arr.length<2)return toast('Add at least two complete entry lines.');if(arr.some(l=>l.debit&&l.credit))return toast('A line cannot contain both a debit and a credit.');if(!draft&&Math.abs(d-c)>.005)return toast('Entry must balance before posting.');if(!draft&&arr.some(l=>!acct(l.accountId)))return toast('Choose a valid account for every line.');if(old?.importedFrom&&!draft&&!document.getElementById('e-import-confirm')?.checked)return toast('Confirm the imported date, amount and account split before posting.');let obj={...(old||{}),id:existingId||id(),date,entryType:entryType==='sale'?'Sale':entryType==='purchase'?'Purchase':entryType[0].toUpperCase()+entryType.slice(1),ref:ref||'AET-'+date.replaceAll('-','')+'-'+String(db.entries.length+1).padStart(3,'0'),party,memo,reconciled:document.getElementById('e-reconcile')?.checked||false,lines:arr,status:draft?'draft':'posted',createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(old&&old.status==='posted'&&!draft)obj.auditTrail=[...(old.auditTrail||[]),{at:new Date().toISOString(),action:'Edited',before:JSON.stringify(old.lines)}];if(existingId)db.entries[db.entries.findIndex(x=>x.id===existingId)]=obj;else db.entries.push(obj);save();closeModal();toast(draft?'Draft saved':'Entry posted');render(activePage())}

function closeModal(){document.getElementById('modal-root').innerHTML=''}function editEntry(eid){let e=db.entries.find(x=>x.id===eid);if(e)openEntry(e.entryType?.toLowerCase()==='sale'?'sale':e.entryType?.toLowerCase()==='purchase'?'purchase':'journal',e)}function inspectEntry(eid){let e=db.entries.find(x=>x.id===eid);if(!e)return;document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal narrow"><div class="modal-head"><h2>${esc(e.ref)}</h2><button class="x" onclick="closeModal()">×</button></div><p>${day(e.date)} · ${esc(e.entryType)}${e.closing?' · Period close':''}</p><p class="muted">${esc(e.memo)} ${e.party?'· '+esc(e.party):''}</p><table><thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${lines(e).map(l=>`<tr><td>${esc(acct(l.accountId)?.name||l.accountId)}</td><td>${l.debit?money(l.debit):'—'}</td><td>${l.credit?money(l.credit):'—'}</td></tr>`).join('')}</tbody></table><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" onclick="closeModal()">Close</button>${e.closing?'':`<button class="btn" onclick="editEntry('${e.id}')">Edit</button>`}</div></div></div>`}
function deleteEntry(eid){let e=db.entries.find(x=>x.id===eid);if(!e)return;if(e.status==='posted'){if(!confirm('Void this posted entry? It will be excluded from balances and reports, and retained in the audit trail.'))return;e.auditTrail=[...(e.auditTrail||[]),{at:new Date().toISOString(),action:'Voided',beforeStatus:'posted'}];e.status='void';e.updatedAt=new Date().toISOString();save();toast('Entry voided and retained in the audit trail')}else{if(!confirm('Delete this unposted draft?'))return;db.entries=db.entries.filter(x=>x.id!==eid);save();toast('Draft deleted')}render(activePage())}

function closePeriod(){if(db.entries.some(e=>e.status==='draft'))return toast('Review all drafts before period close.');if(Math.abs(trialDiff())>.005)return toast('Trial balance is not balanced. Investigate before close.');if(db.entries.some(e=>e.closing&&e.date===db.periodEnd))return toast('This period already has a closing entry.');let movement={};rangeEntries().forEach(e=>lines(e).forEach(l=>{movement[l.accountId]=(movement[l.accountId]||0)+(+l.debit)-(+l.credit)}));let closingLines=[];db.accounts.filter(a=>a.type==='Income'||a.type==='Expense').forEach(a=>{let raw=movement[a.id]||0;if(Math.abs(raw)>.005)closingLines.push({accountId:a.id,debit:raw<0?-raw:0,credit:raw>0?raw:0})});let diff=closingLines.reduce((s,l)=>s+l.debit-l.credit,0);if(Math.abs(diff)>.005){if(!acct('profit-summary'))db.accounts.push({id:'profit-summary',name:'Unallocated period profit / (loss)',type:'Equity',sub:'Unallocated profit'});closingLines.push({accountId:'profit-summary',debit:diff<0?-diff:0,credit:diff>0?diff:0})}if(closingLines.length<2)return toast('No balances to close.');db.entries.push({id:id(),date:db.periodEnd,ref:'CLOSE-'+db.periodEnd.replaceAll('-',''),memo:'Period close — transfer income and expenses to unallocated partner equity. Partner allocation remains pending approved sharing ratios.',entryType:'Closing',status:'posted',closing:true,lines:closingLines,createdAt:new Date().toISOString()});save();toast('Period closing entry posted');render('close')}
